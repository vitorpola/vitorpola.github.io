<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>GRL Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&family=Share+Tech+Mono&display=swap">
<style>
/* Visual: o tabuleiro 3D sobre o céu azul, o HUD da corrida em vidro escuro e, fora da corrida, um lobby com a mesma linguagem:
   painéis de vidro, títulos condensados em itálico e a dupla azul × laranja. As pistas escolhidas aparecem em retratos no centro do menu. */
:root{
  --sea:#6b4592;
  --blue:#2f8cff;     /* lado azul: grid e pilotos */
  --orange:#ff8a1c;   /* lado laranja: pistas e largada */
  --sheet:rgba(243,247,252,.84);   /* vidro dos painéis */
  --glass-brd:rgba(255,255,255,.8);
  --ink:#1d5687;
  --ink-dim:#71879c;
  --head:#d9540a;
  --btn:#0b5fc2;
  --rule:rgba(12,53,83,.17);
  --bar:#0f5a8c;
  --mono:"Lucida Console","Share Tech Mono","Consolas",ui-monospace,monospace;
  --disp:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;   /* títulos, botões, números grandes */
  --ui:"Barlow",system-ui,"Segoe UI",Roboto,sans-serif;                                /* textos dos menus */
  --text:#0d1b2a;     /* valores e textos fortes */
  --on-btn:#fff;      /* texto sobre botão cheio */
  --field:rgba(255,255,255,.72);   /* fundo de campos, teclas, cartões e listas */
  --field-hover:#fff;
  --sel:#ffd2a8;      /* pista escolhida */
  --wait-bg:#fff3f3; --wait-pulse:#ffd9d9;
  --dim-back:rgba(12,40,80,.45);
  --prev-glow:#cbd8e4;
  --vig:rgba(46,22,84,.45);       /* escurecimento das bordas da tela nos menus (roxo do crepúsculo) */
  color-scheme:light;
}
/* tema escuro: só as telas fora da corrida (menus, opções, pilotos, diálogos) */
:root[data-theme="dark"]{
  --sheet:rgba(14,19,28,.72);
  --glass-brd:rgba(255,255,255,.2);
  --ink:#a9c9e8;
  --ink-dim:#73879b;
  --head:#ff9a3d;
  --btn:#5aa9ff;
  --rule:rgba(255,255,255,.14);
  --text:#f2f6fa;
  --on-btn:#06121f;
  --field:rgba(255,255,255,.075);
  --field-hover:rgba(255,255,255,.15);
  --sel:rgba(255,138,28,.3);
  --wait-bg:#3a1d1d; --wait-pulse:#5a2626;
  --dim-back:rgba(0,0,0,.55);
  --prev-glow:#243444;
  --vig:rgba(14,6,30,.72);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--mono);color:var(--ink);
  background:var(--sea);   /* por baixo do céu (Sky): o mesmo fim de tarde, parado */
  background-image:radial-gradient(ellipse 70% 45% at 50% 104%,#ffd58ccc,transparent 70%),linear-gradient(#232c74,#6b4592 36%,#dc6f73 72%,#ffbb6a);}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#view{position:fixed;left:0;top:0;width:100%;height:calc(100% - var(--hudh,0px));display:block;outline:none;touch-action:none}
#ed{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#1d3a52}
button{font-family:inherit}
/* telas fora da corrida: vidro sobre o céu, com as bordas da tela escurecidas para o centro ficar em destaque */
.sheet{position:fixed;inset:0;overflow:hidden;padding:12px 16px;box-sizing:border-box;font-family:var(--ui);color:var(--ink);
  background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 35%,var(--vig) 100%)}
.sheet .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:0 10px;
  background:var(--sheet);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--glass-brd);border-radius:18px;box-shadow:0 12px 34px #0005,inset 0 3px 0 var(--blue)}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:clamp(8px,2vh,20px) 2% clamp(6px,1.2vh,10px);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.mhead h1{margin:0;font-family:var(--disp);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(24px,2.8vw,34px);line-height:1;color:var(--text)}
.mhead .brand{font-family:var(--disp);font-style:italic;font-weight:800;font-size:clamp(20px,2.3vw,28px);line-height:1;color:var(--head)}
.mbody{flex:1;min-height:0;padding:clamp(8px,1.8vh,18px) 4%;display:flex;flex-direction:column;gap:clamp(6px,1.4vh,14px);overflow-y:auto}
.mfoot{position:relative;display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;border-top:1px solid var(--rule);padding:clamp(6px,1.2vh,10px) 2% clamp(8px,1.6vh,14px)}
.mmsg{position:absolute;left:0;right:0;bottom:100%;margin:0 0 6px;text-align:center;color:var(--head);font-size:16px}
.lk{all:unset;cursor:pointer;box-sizing:border-box;color:var(--ink);font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(17px,1.8vw,22px);padding:4px 14px;border-radius:9px;transition:background .12s,color .12s}
.lk:hover,.lk:focus-visible{color:var(--head);background:var(--field-hover);outline:none}
.lk.dim{color:var(--ink-dim)}
.sq{all:unset;cursor:pointer;width:34px;height:34px;box-sizing:border-box;display:inline-grid;place-items:center;font-size:20px;border:2px solid var(--btn);border-radius:9px;color:var(--btn);background:transparent;flex:none}
.sq.fill{background:var(--btn);color:var(--on-btn)}
.sq:focus-visible{outline:2px solid var(--head)}
.sq:disabled{opacity:.4;cursor:default}

/* ---------------------------------------------------------------- menu principal: o lobby */
.home{padding:0}
.hwrap{height:100%;box-sizing:border-box;max-width:1560px;margin:0 auto;padding:14px 16px;display:grid;grid-template-rows:minmax(0,1fr)}
.glass{background:var(--sheet);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--glass-brd);box-shadow:0 8px 24px #0004}
.htop{display:flex;align-items:center;gap:14px;min-width:0}
/* marca: letras brancas inclinadas com a faixa azul → laranja por baixo */
.logo{margin:0 auto;flex:none;align-self:center;position:relative;font-family:var(--disp);font-style:italic;font-weight:800;font-size:clamp(32px,3.6vw,46px);line-height:.95;letter-spacing:.02em;color:#fff;text-shadow:0 2px 0 #2a1446,0 6px 16px #0007;white-space:nowrap;padding-bottom:5px}
.logo::after{content:"";position:absolute;left:2px;right:-4px;bottom:0;height:5px;border-radius:3px;transform:skewX(-20deg);background:linear-gradient(90deg,var(--blue) 0 48%,transparent 48% 52%,var(--orange) 52%)}
/* jogo online, dentro do card do grid: abrir sala ou entrar com o código */
.roomrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin:0 10px 8px;padding:7px 8px 8px 10px;border-radius:10px;background:var(--field);box-shadow:inset 0 0 0 1px var(--rule);font-size:.92em}
.roomrow .rlab{flex:1 1 auto;font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:1.05em;color:var(--text);white-space:nowrap}
.roomrow .rlab::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--ink-dim);margin-right:7px;vertical-align:.05em}
.roomrow.on .rlab::before{background:#2bd14a;box-shadow:0 0 0 3px #2bd14a44}
.roomrow .rrow{flex:1 1 100%;display:flex;align-items:center;gap:6px;min-width:0}
.roomrow .lk{font-size:1em;padding:4px 8px;white-space:nowrap}
.roomrow .bigbtn{padding:5px 12px;border-radius:8px;font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:1em;white-space:nowrap}
.roomrow .codein{flex:1 1 4em;min-width:0;width:auto;font-size:1em;letter-spacing:.18em;padding:3px 8px;border-width:2px;border-radius:8px;font-family:var(--mono)}
.roomrow .rcode{font-family:var(--mono);font-weight:400;font-size:1.25em;letter-spacing:.18em;color:var(--head)}
.roomrow .rst{flex:1 1 100%;color:var(--ink-dim);font-size:.92em}
.navb{all:unset;cursor:pointer;flex:none;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 12px;border-radius:14px;color:var(--text);font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(16px,1.5vw,19px);transition:transform .12s}
.navb svg{width:20px;height:20px;color:var(--btn)}
.navb:hover{transform:translateY(-1px)}.navb:hover svg{color:var(--head)}
/* três colunas: grid (azul) | pista ao vivo | percurso, pistas e largada (laranja) */
.hgrid{display:grid;grid-template-columns:clamp(270px,27vw,360px) minmax(0,1fr) clamp(270px,27vw,360px);gap:14px;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:16px;overflow:hidden;font-size:clamp(14px,1.25vw,16px)}
.pane.pb{box-shadow:0 8px 24px #0004,inset 0 3px 0 var(--blue)}
.pane.po{box-shadow:0 8px 24px #0004,inset 0 3px 0 var(--orange)}
.pane .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px 8px}
.pane .ph h2{margin:0;font-family:var(--disp);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(20px,1.9vw,25px);line-height:1;color:var(--text)}
.pane .ph .cnt{color:var(--ink-dim);font-size:.9em;white-space:nowrap;font-variant-numeric:tabular-nums}
/* vagas da largada */
#slots{display:flex;flex-direction:column;gap:5px;padding:0 10px}
.slot{display:grid;grid-template-columns:1.3em 56px minmax(0,1fr) 26px;align-items:center;gap:8px;height:clamp(36px,6.5vh,50px);padding:0 6px;border-radius:10px;background:var(--field);box-shadow:inset 4px 0 0 var(--c1,transparent);box-sizing:border-box}
.slot .pos{font-family:var(--disp);font-style:italic;font-weight:700;font-size:1.35em;text-align:right;color:var(--ink-dim)}
.slot canvas{width:56px;height:35px;max-height:100%;object-fit:contain;cursor:pointer}
.slot .who{min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.12}
.slot .drv{all:unset;display:block;cursor:pointer;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .car{all:unset;display:block;cursor:pointer;color:var(--ink);font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .car:hover,.slot .drv:hover{color:var(--head)}
.slot .car:disabled,.slot .drv:disabled{color:inherit}
.slot .kd{display:inline-block;margin-left:7px;padding:0 5px;border-radius:4px;background:var(--rule);color:var(--ink);font-size:.68em;font-weight:600;letter-spacing:.08em;vertical-align:.12em}
.slot .rm{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);font-size:17px;line-height:1}
.slot .rm:hover,.slot .rm:focus-visible{background:var(--head);color:#fff}
.slot.empty{display:flex;justify-content:center;background:transparent;box-shadow:none;border:1.5px dashed var(--rule);color:var(--ink-dim);font-size:.85em}
/* banco de pilotos: toque põe na corrida ou tira */
.bench{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:10px;border-top:1px solid var(--rule)}
.bench .bh{display:flex;justify-content:space-between;align-items:center;padding:5px 6px 3px 14px;font-size:.8em;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-dim)}
.bench .bh .lk{font-size:1.15em;padding:2px 8px;color:var(--btn)}
/* lista de pilotos: bandeira, nome e as ações (pôr/tirar do grid, editar, estatísticas, excluir) */
.drvbox{flex:1;min-height:40px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding:2px 10px 10px}
.dr{display:flex;align-items:center;gap:7px;flex:none;min-height:32px;padding:0 3px 0 8px;border-radius:9px;background:var(--field);box-sizing:border-box}
.dr.used{background:rgba(47,140,255,.18);box-shadow:inset 3px 0 0 var(--blue)}
.dr .cl{width:17px;height:17px;border-radius:50%;box-sizing:border-box;border:1.5px solid rgba(255,255,255,.8);box-shadow:0 0 0 1px #0003;flex:none}
.dr .nm{flex:1;min-width:0;font-weight:600;color:var(--text);font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .nm .kd{margin-left:6px;padding:0 4px;border-radius:4px;background:var(--rule);color:var(--ink);font-size:.72em;letter-spacing:.08em;vertical-align:.1em}
.dr .ib{all:unset;cursor:pointer;flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink)}
.dr .ib svg{width:17px;height:17px}
.dr .ib:hover,.dr .ib:focus-visible{background:var(--field-hover);color:var(--head)}
.dr .ib.add.on{color:var(--blue)}
.dr .ib.del:hover,.dr .ib.del:focus-visible{color:#e5484d}
.dr .ib:disabled{opacity:.3;cursor:default;background:none}
/* coluna da esquerda: grid e, embaixo, o botão de configurações */
.lcol{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.lcol .pb{flex:1}
.cfg{all:unset;cursor:pointer;flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:clamp(46px,7.5vh,60px);border-radius:14px;color:var(--text);font-family:var(--disp);font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(18px,1.8vw,23px);box-shadow:0 8px 24px #0004,inset 0 -3px 0 var(--blue);transition:transform .12s}
.cfg svg{width:24px;height:24px;color:var(--blue)}
.cfg:hover{transform:translateY(-1px)}.cfg:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* centro: as pistas escolhidas em retratos (Thumbs) com o nome por cima, numa grade que se ajusta ao número de pistas
   (fitStage); a corrida ao vivo opcional (Demo) põe o canvas 3D exatamente sobre #stageView. Embaixo, a ficha da pista */
.stage{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
#stageView{flex:1;min-height:70px;display:grid;gap:10px;justify-content:center;align-content:center}
.tc{all:unset;display:block;position:relative;box-sizing:border-box;container-type:size;min-width:0;min-height:0;border-radius:14px;overflow:hidden;cursor:pointer;color:#fff}
.tc img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .3s}
.tc img.on{opacity:1}
#stageView.live .tc img{opacity:0;transition:none}
.tc .tt{position:absolute;left:0;right:0;bottom:3%;padding:0 .3em;text-align:center;font-family:var(--disp);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1;font-size:clamp(20px,9cqw,56px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #2a1446,0 4px 14px #000a}
.tc.none{cursor:default}.tc.none .tt{top:50%;bottom:auto;transform:translateY(-50%);opacity:.85}
.tc.wait::before{content:"";position:absolute;inset:12% 8% 22%;border-radius:12px;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%) 0 0/250% 100%,rgba(255,255,255,.1);animation:tcWait 1.3s linear infinite}
@keyframes tcWait{to{background-position:-250% 0,0 0}}
@media (prefers-reduced-motion:reduce){.tc.wait::before{animation:none}}
.many .tc{background:var(--sheet);border:1px solid var(--glass-brd);box-shadow:0 6px 18px #0004;transition:transform .12s}
.many .tc:hover{transform:translateY(-2px)}
.many .tc .tt{bottom:0;padding:.9em .45em .4em;font-size:clamp(12px,10cqw,30px);background:linear-gradient(transparent,rgba(26,10,42,.72));text-shadow:0 1px 0 #2a1446,0 2px 8px #000a}
.many .tc.cur{box-shadow:0 0 0 3px var(--orange),0 6px 18px #0004}
.tc .no{position:absolute;left:6px;top:6px;z-index:1;min-width:1.5em;height:1.5em;line-height:1.5em;padding:0 .2em;box-sizing:border-box;border-radius:99px;text-align:center;font-family:var(--disp);font-weight:700;font-size:clamp(11px,8cqw,17px);background:#231000;color:#ffb054;box-shadow:0 0 0 2px #ffb054}
.tc.cur .no{background:var(--orange);color:#231000;box-shadow:none}
.tc:focus-visible{outline:3px solid var(--head);outline-offset:2px}
.tinfo{text-align:center;color:#fff;min-width:0}
.tinfo .tm{display:flex;justify-content:center;gap:5px 6px;flex-wrap:wrap;min-height:1.7em;font-size:clamp(12.5px,1.1vw,15px)}
.tinfo .tm span{background:rgba(10,18,32,.6);border-radius:99px;padding:2px 10px;white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tinfo .tm span.c{background:var(--orange);color:#1a0d00;font-weight:600}
.tinfo .tm b{font-weight:600;color:#ffd23a}
/* coluna da direita: percurso, pistas e o botão de largar */
.rcol{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.rcol .pcrs{flex:none;overflow:visible}
.rcol .trk{flex:1}
.lenrow{display:flex;align-items:center;gap:8px;padding:0 12px}
.lenrow .sq{width:32px;height:32px;font-size:19px}
.lenrow .val{flex:1;min-width:0;text-align:center;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--disp);font-weight:700;font-size:clamp(20px,2vw,26px);font-variant-numeric:tabular-nums}
.radios{display:flex;gap:6px;padding:8px 12px 12px}
.radios button{all:unset;cursor:pointer;flex:1;min-width:0;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:5px 6px;border-radius:9px;background:var(--field);color:var(--text);font-weight:600;font-size:.92em;white-space:nowrap}
.radios button::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;box-sizing:border-box;border:2px solid var(--ink-dim)}
.radios button:hover{background:var(--field-hover)}
.radios button[aria-checked="true"]{background:rgba(255,138,28,.16);box-shadow:inset 0 0 0 1.5px var(--orange)}
.radios button[aria-checked="true"]::before{border-color:var(--orange);background:radial-gradient(circle,var(--orange) 0 3px,transparent 3.5px)}
.radios button:disabled{cursor:default;opacity:.6}
.go{all:unset;cursor:pointer;box-sizing:border-box;flex:none;display:grid;place-items:center;text-align:center;width:100%;min-height:clamp(54px,9vh,76px);padding:6px 22px;border-radius:12px;font-family:var(--disp);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(26px,2.9vw,38px);line-height:1;color:#231000;background:linear-gradient(180deg,#ffb65c,#ff7a00);box-shadow:0 4px 0 #a84a00,0 10px 22px #ff7a0055,inset 0 2px 0 #fff6;transition:transform .08s,box-shadow .08s,filter .12s}
.go:hover,.go:focus-visible{filter:brightness(1.08)}
.go:focus-visible{outline:3px solid #fff;outline-offset:2px}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #a84a00,0 4px 10px #ff7a0055,inset 0 2px 0 #fff6}
.go:disabled{cursor:default;filter:saturate(.25);font-size:clamp(16px,1.6vw,20px);font-style:normal;box-shadow:none;transform:none;opacity:.8}
.home .mmsg{position:fixed;left:50%;right:auto;bottom:28px;transform:translateX(-50%);margin:0;padding:6px 16px;border-radius:10px;background:#c4260e;color:#fff;font-weight:600;box-shadow:0 6px 18px #0006;z-index:5}
/* pistas */
.trkbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 10px 8px}
.trkbar .find{flex:1 1 7em;min-width:0;box-sizing:border-box;font:inherit;color:var(--text);background:var(--field);border:1.5px solid var(--rule);border-radius:9px;padding:5px 10px;height:32px}
.trkbar .find::placeholder{color:var(--ink-dim)}
.trkbar .find:focus{border-color:var(--orange);outline:none}
.trkbar .rnd{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.trkbar .rnd input{width:56px;height:32px;box-sizing:border-box;padding:0 4px 0 10px;font:inherit;font-weight:600;text-align:center;color:var(--text);background:var(--field);border:1.5px solid var(--rule);border-radius:9px}
.trkbar .rnd .lk{font-size:1.05em;padding:3px 8px;color:var(--btn)}
#trkGrid{flex:1;min-height:90px;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;align-content:start;gap:3px 4px;padding:0 10px 8px}
#trkGrid button{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:6px;min-width:0;padding:5px 9px;border-radius:8px;color:var(--text);white-space:nowrap}

// faixa de "tonalidade" do piso -> índices da tabela de aderência (como o jogo original interpola)
function bandIdx(t){
  if(t===0) return [0,0,0]; if(t<8) return [1,2,(t-1)/6]; if(t<16) return [3,4,(t-8)/7]; if(t<20) return [5,6,(t-16)/3];
  if(t<24) return [7,8,(t-20)/3]; if(t<28) return [9,10,(t-24)/3]; if(t<40) return [11,12,((t-28)%4)/3]; return [13,13,0];
}

// ====================================================================== leitura do .trk
function parseTrk(buf){
  const dv=new DataView(buf); let p=0;
  const u8=()=>dv.getUint8(p++), u16=()=>{const v=dv.getUint16(p,true);p+=2;return v;}, i16=()=>{const v=dv.getInt16(p,true);p+=2;return v;}, u32=()=>{const v=dv.getUint32(p,true);p+=4;return v;};
  const ver=u16(); if(u16()!==0x5247) throw new Error('Arquivo não é uma pista');
  u32(); const W=u8(), water=u8()*.05, camAng=i16(), camRot=i16(); let zoom=1, showStart=1;
  if(ver>0x104){ zoom=u8()/100; showStart=u8(); }
  const n=u32(), codes=new Uint8Array(CELLS*CELLS); let k=0;
  for(let i=0;i<n;i++){ const w=u16(), c=w&15, r=w>>4; for(let j=0;j<r&&k<codes.length;j++) codes[k++]=c; }
  u16(); const hm=new Uint8Array(buf.slice(p,p+4096)); p+=4096;
  const un=W/1024;
  const nobj=ver<0x102?u8():u16(), objs=[];
  for(let i=0;i<nobj;i++){ const type=u8(), variant=u8(), x=u16()*un, y=u16()*un, ang=u16()/10000; objs.push({type,variant,x,y,ang}); }
  const pits=[]; for(let i=0,c=u8();i<c;i++) pits.push([u16()*un,u16()*un,u16()/10000]);
  const cps=[]; for(let i=0,c=u8();i<c;i++) cps.push([u16()*un,u16()*un,u16()*un,u16()*un]);
  const lims=[]; if(ver>0x11f) for(let i=0,c=u8();i<c;i++) lims.push([u16()*un,u16()*un,u16()*un,u16()*un]); // limitadores de velocidade (0x43d390: só a partir da versão 0x120)
  const ai=[]; for(let i=0,c=(ver<0x102?u8():u16());i<c;i++) ai.push([u16()*un,u16()*un]);
  const pitAi=[]; try{ for(let i=0,c=u8();i<c;i++) pitAi.push([u16()*un,u16()*un]); }catch(e){}
  return {ver,W,water,camAng,camRot,zoom,showStart,codes,hm,objs,pits,cps,lims,ai,pitAi};
}
async function gunzipB64(b64){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const s=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(s).arrayBuffer();
}

// Pinta a grade de "tonalidades" 512x512 do mesmo jeito que o jogo faz ao carregar (com espalhamento aleatório).
function paintTonality(raw,seed){
  const rnd=mulberry32(seed), R=k=>(rnd()*k)|0, t=new Uint8Array(CELLS*CELLS).fill(16), codes=raw.codes;
  const at=(x,y)=>clamp(y,0,511)*CELLS+clamp(x,0,511);
  for(let idx=0;idx<codes.length;idx++){
    const c=codes[idx], x=idx&511, y=idx>>9;
    switch(c){
      case 0: t[idx]=t[idx]<40?2:41; break;
      case 1: t[idx]=t[idx]<40?1:41; break;
      case 2: for(let r=0;r<3;r++){ const j=at(x+R(5)-2,y+R(5)-2); if(t[j]>=40) t[j]=42; else if(t[j]===16) t[j]=8+R(2.5); } break;
      case 4: t[idx]=t[idx]>=40?42:12+R(2); break;
      case 5: { const j=at(x+R(13)-6,y+R(13)-6), v=t[j];
        if(v===0) t[j]=40; else if(v<8) t[j]=41; else if(v<16) t[j]=42; else if(v<20) t[j]=43; else if(v<24) t[j]=44; else if(v<28){} else if(v<32) t[j]=45; else if(v<36) t[j]=46; else if(v<40) t[j]=47; break; }
      case 6: { const j=at(x+R(7)-3,y+R(7)-3); if((t[j]&0xfc)!==24) t[j]=20+R(2.5); t[idx]=t[idx]>=40?44:20+R(2.5); break; }
      case 7: t[idx]=24+R(2); break;
      case 8: t[idx]=26+R(2); break;
      case 9: t[idx]=t[idx]<40?28:45; break;
      case 10: t[idx]=t[idx]<40?32:46; break;
      case 11: t[idx]=t[idx]<40?36:47; break;
      case 12: t[idx]=t[idx]<40?0:40; break;
    }
  }
  if((raw.showStart||raw.ver<=0x104) && raw.cps.length){ // linha de chegada branca sobre o asfalto
    const [x1,y1,x2,y2]=raw.cps[raw.cps.length-1], s=CELLS/raw.W, L=Math.hypot(x2-x1,y2-y1)*s;
    for(let i=0;i<=L*2;i++){ const f=i/(L*2), cx=(x1+(x2-x1)*f)*s, cy=(y1+(y2-y1)*f)*s, nx=-(y2-y1)/(L/s||1)*.5, ny=(x2-x1)/(L/s||1)*.5;
      for(const o of [-.5,.5]){ const j=at((cx+nx*o)|0,(cy+ny*o)|0); if(t[j]<8) t[j]=28; } }
  }
  return t;
}

function catmullClosed(P,spacing){
  const n=P.length, dense=[];
  for(let i=0;i<n;i++){ const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    for(let k=0;k<12;k++){ const t=k/12,t2=t*t,t3=t2*t;
      dense.push([.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                  .5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]); } }
  const m=dense.length, cum=new Float64Array(m+1);
  for(let i=0;i<m;i++){ const a=dense[i],b=dense[(i+1)%m]; cum[i+1]=cum[i]+Math.hypot(b[0]-a[0],b[1]-a[1]); }
  const L=cum[m], N=Math.max(30,Math.round(L/spacing)), ds=L/N, x=new Float32Array(N), y=new Float32Array(N);
  let seg=0; for(let j=0;j<N;j++){ const tg=j*ds; while(seg<m-1&&cum[seg+1]<tg) seg++; const a=dense[seg],b=dense[(seg+1)%m],t=(tg-cum[seg])/((cum[seg+1]-cum[seg])||1); x[j]=a[0]+(b[0]-a[0])*t; y[j]=a[1]+(b[1]-a[1])*t; }
  return {x,y,N,ds,L};
}

const rampRGB=(r,s)=>{ const [a,n]=FLOOR_RAMP[r]; s=clamp(s,0,1)*(n-1); const i=Math.floor(s), f=s-i, A=PAL[a+i], B=PAL[a+Math.min(n-1,i+1)]; return [A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,A[2]+(B[2]-A[2])*f]; };
function tonRGB(t,sh=0,n=0,cx=0,cy=0){
  let c; const base=t>=40?[0,1,2,4,5,7,8,9][t-40]:-1, tt=base>=0?[0,2,8,16,20,28,32,36][base]:t;
  if(tt===0) c=rampRGB('oil',.25+n);
  else if(tt<8) c=rampRGB('asph',(tt===2?.68:.6)+sh*.35+n*.6);
  else if(tt<12) c=rampRGB('grass',.42+(tt-8)*.08+sh+n);
  else if(tt<16) c=rampRGB('gravel',.55+(tt-12)*.08+sh+n);
  else if(tt<20) c=rampRGB('dirt',.5+sh+n);
  else if(tt<24) c=rampRGB('sand',.55+(tt-20)*.06+sh+n);
  else if(tt<28) c=rampRGB('snow',.6+(tt-24)*.05+sh+n);
  else if(tt<32) c=rampRGB('white',.7+sh*.5+n*.4);
  else if(tt<36) c=rampRGB('yellow',.6+sh*.5+n*.4);
  else c=(((cx+cy)>>2)&1)?rampRGB('red',.6+sh*.4):rampRGB('white',.8+sh*.4);
  if(base>=0){ c=[c[0]*.62+40,c[1]*.6+34,c[2]*.58+28]; } // piso marcado (cascalho solto, ≥40): versão escurecida do piso de baixo
  return c;
}
// Cor de objeto do original (0x44e910): índice < 40 é uma tonalidade de piso (a pedra usa o asfalto, o pneu a faixa branca);
// a partir de 48, rampa de 3 tons cor..cor+2 conforme o ângulo da face (de lado, como as paredes vistas da câmera do
// tabuleiro, fica a cor base; de frente, a mais clara); aqui a cor base, e a luz da cena clareia os topos.
const objRGB=i=>{ const c=i<40?tonRGB(i):PAL[i]; return [c[0]/255,c[1]/255,c[2]/255]; };

class Car{
  constructor(spec,drv,g,T){
    this.spec=spec; this.drv=drv; this.name=drv.name; this.tag=tagOf(drv); this.cpTs=[]; this.c1=drv.c1; this.c2=drv.c2; this.human=drv.human;
    this.x=g.x; this.y=g.y; this.a=g.a; this.vx=0; this.vy=0; this.w=0; this.ws=.2; this.steer=0; this.delta=0; this.gs=0; this.slideAmt=0;
    this.wheels=spec.pw.map(([lx,ly])=>({lx,ly,f:lx>0?1:0,slide:0,spin:0,t:16,mx:null,my:null,sk:0,acc:0}));
    this.idx=T.nearest(g.x,g.y,(T.finIdx-40+T.N)%T.N); this.lastP=-1e9; this.stuckT=0;
    this.lapsDone=0; this.nextCp=0; this.lapStart=0; this.laps=[]; this.best=null;
    this.finished=false; this.finishT=null; this.wrong=0; this.inp={c:1,throttle:0,brake:0,steer:0}; this.wet=0;
    this.lim=0; this.limI=-1; // limitador ligado (+0xd8) e último limitador tocado (+0xd9), 0x43c130
    this.tyre=FULL; this.fuel=FULL; this.dmg=0; this.mis=10; this.thr=0; this.pitch=.2*4+50; this.skAcc=0; this.pit=null;
    const rel=((this.idx-T.finIdx)%T.N+T.N)%T.N; this.crossed=rel<T.N/2;
  }
  step(dt,inp,T){
    const s=this.spec, O=T.rules||NO_RULES, m=s.mass+this.fuel/FULL*O.fuelKg, k=1200/(m+200), ca=Math.cos(this.a), sa=Math.sin(this.a), Rx=-sa, Ry=ca;
    const spd=Math.hypot(this.vx,this.vy), vf=this.vx*ca+this.vy*sa;
    // pneu gasto tira até 36% da aderência
    const tyreF=this.tyre/FULL*.36+.64;
    // carga nas rodas: o contato com o chão anula a gravidade (0,2 por passo) e a pressão aerodinâmica (0xa0)
    const base=Math.sqrt(.2*(.2+s.dragAng*spd/m/100))/4;
    let gl=0, glF=0, wet=0;
    for(let i=0;i<this.wheels.length;i++){ const wh=this.wheels[i];
      const px=this.x+ca*wh.lx+Rx*wh.ly, py=this.y+sa*wh.lx+Ry*wh.ly, t=T.tonAt(px,py), isWet=T.wet(px,py);
      wh.t=t; wh.wet=isWet; wh.px=px; wh.py=py; if(isWet) wet++;
      const g=s.gT[t]*base*(isWet?.5:1); wh.load=g; gl+=g; if(i<2) glF+=g; }
    this.wet=wet;
    const l34=gl*tyreF, l28=glF*2*s.steer*tyreF*.45+.2;
    this.gs=this.gs*2<l34+l28 ? this.gs*.02+(l34+l28)*.49 : this.gs*.98+(l34+l28)*.01;
    // combustível: consumo% × velocidade / 100 por passo (100% = 100 unidades por metro)
    if(O.fuel){ const d=Math.floor(O.fuel*spd/100); this.fuel=this.fuel>d?this.fuel-d:0; }
    // dano: volante tremido e, acima de 5000, falhas do motor e fumaça
    let st=clamp(inp.steer,-1,1);
    if(this.dmg) st+=(Math.random()*4-2)*this.dmg/65536;
    this.pitch=(Math.abs(this.ws)*4+50)/s.vmax;
    if(this.dmg<5000) this.mis=10;
    else if(this.mis===0){ this.smoke=1; this.mis=Math.floor((Math.random()*4+2)*655350/(this.dmg*this.pitch))&255; }
    else this.mis--;
    // velocidade da roda conforme acelerador/freio (lc: 100 acelera, 1 solto, -100 freia/ré, 0 freio total)
    let lc=inp.c, ws=this.ws; const fire=this.mis>9; this.thr=0;
    if(lc>=2&&!fire) lc=1;
    if(lc<0&&vf*9.25<=2&&!fire) lc=1;
    if(lc>=2){ ws=Math.sqrt(this.fuel?(lc-1)/99*147.1*s.power/m+ws*ws:ws*ws+14.71); this.thr=1; }
    else if(lc<0){ if(vf*9.25<=2){ ws=-Math.sqrt(ws*ws-lc*.1471); this.thr=1; } else ws=vf*.25+lc/100*2; }
    else if(lc===1){ if(vf*9.9>.5) ws=vf*.9-.5; else if(vf*9.9>-.5) ws=vf*-9; else ws=vf*.9+.5; }
    else { if(vf*9.25>2) ws=vf*.25-2; else if(vf*9.25>-2) ws=vf*-9; else ws=vf*.25+2; }
    ws=clamp(ws,-s.vmax,s.vmax);
    if(this.lim) ws=clamp(ws,-15,15); // zona de limitador: roda a no máximo 15 m/s (0x407cd0)
    // pneus: círculo de atrito resolvido por bisseção, como no original
    let latI=0, slide=0, slF=0;
    if(l34>1e-4){
      const slip=ws-vf, c=Math.abs((slip*.1+vf)*s.drift), vl=-(this.vx*Rx+this.vy*Ry), L2=l34*l34, s2=slip*slip, v2=vl*vl;
      let f=1;
      if(L2<v2/((c+1)*(c+1))+s2/100){ let st=.25; f=2;
        do{ f=f/((s2/((f+9)*(f+9))+v2/((f+c)*(f+c))<=L2)?1+st*f:1-st*f); st*=.5; }while(st>1e-4); }
      const slipI=slip/(f+9); latI=vl/(f+c); slide=(f-1)*.1;
      slF=this.thr?slide*Math.abs(latI)/l34:slide;
      ws-=slipI*9;
      this.vx+=ca*slipI+Rx*latI; this.vy+=sa*slipI+Ry*latI;
      // desgaste: estado /= 1 + desgaste% × 2e-5 × escorregamento × aderência²
      // (as cargas daqui valem o dobro das do original, medidas na telemetria; GLD converte)
      if(O.tyre) this.tyre=Math.floor(this.tyre/(O.tyre*2e-5*(slF+slide)*(l34*GLD)**2+1));
    }
    this.ws=ws; this.slideAmt=slide;
    groundWear(this,T,slF,slide,spd,ws);
    // chiado dos pneus (só no asfalto): soma por roda que o som usa
    const X=(Math.abs(ws)+40)*1e-4*(spd+10);
    for(const wh of this.wheels){ wh.sk=0; if(wh.t<8&&!wh.wet){ const r=(wh.f?slF:slide)*wh.load*.4/X-1; if(r>0){ wh.sk=r; this.skAcc+=r*1e7; this.skNet=(this.skNet||0)+r*1e7; } } }
    // direção: giro direto proporcional à aderência dianteira; abaixo de 5 m/s escala com a velocidade
    if(spd<5) latI*=spd/5;
    const q=(spd*spd-vf*vf)*.2, r=(q+vf)/(q+5);
    if(r<-1) st=-st; else if(r<1) st*=r;
    if(!this.human&&r<0) st=-st;
    this.w+=(st*l28*2-latI)*5*k/(15-k);
    this.w*=1-k/15;
    this.steer=clamp(inp.steer,-1,1); this.delta=this.steer*.45;
    // arrasto (0x9c), 9x maior na água, e gravidade de 20 m/s² ao longo da rampa
    const dl=s.dragLin*spd*(wet?1+8*wet/this.wheels.length:1)/m/100;
    this.vx-=this.vx*dl; this.vy-=this.vy*dl;
    const e=.6, gx=(T.heightAt(this.x+e,this.y)-T.heightAt(this.x-e,this.y))/(2*e), gy=(T.heightAt(this.x,this.y+e)-T.heightAt(this.x,this.y-e))/(2*e);
    const gw=wet?.35:1; this.vx-=20*dt*gx*gw; this.vy-=20*dt*gy*gw;
    this.x+=this.vx*dt; this.y+=this.vy*dt; this.a+=this.w*dt;
    for(const wh of this.wheels){ wh.slide=slide; wh.spin=lc>=2&&ws-vf>4?1:0; }
    // limitadores (fim de 0x407cd0): ao entrar na faixa de ±1 m de um limitador diferente do último, liga/desliga a zona
    let onLim=false;
    for(let i=0;i<T.lims.length;i++){ const L=T.lims[i], rx=this.x-L.x, ry=this.y-L.y, al=rx*L.ux+ry*L.uy, pp=rx*L.uy-ry*L.ux;
      if(al>0&&al<L.len&&pp>-1&&pp<1){ onLim=true; if(i!==this.limI){ this.limI=i; this.lim=this.lim?0:1; } } }
    if(!onLim) this.limI=-1;
  }
  // batida: energia = (variação de velocidade)²; acima de 50 faz barulho e solta faíscas, e o dano soma dano% × energia
  // (m: massa com combustível, +0xc8; som (E−50)·m·10⁴; dano se dano%·E > 5000, como em 0x41f3c0/0x42ea10/0x42de90/0x42d3d0)
  hit(E,O,m=this.spec.mass){ if(E<=50) return; const ds=(E-50)*m*1e4; this.dmgSnd=(this.dmgSnd||0)+ds; this.dmgNet=(this.dmgNet||0)+ds; const d=O.dmg*E; if(d>5000){ this.dmg=Math.min(FULL,this.dmg+Math.floor(d)); this.mis=0; } }
  circles(){ const ca=Math.cos(this.a), sa=Math.sin(this.a); return this.spec.circ.map(([lx,r])=>[this.x+ca*lx,this.y+sa*lx,r]); }
}

// ====================================================================== IA (função 0x40b890 do original)
// Segue os pontos da linha da IA (um a cada ~5 m) com um desvio lateral sorteado, olha à frente
// conforme a velocidade e decide virar tudo para um lado ou para o outro, como no jogo original.
class AI{
  constructor(car,skill,T){
    this.car=car; this.skill=skill; this.cnt=0; this.off=100;
    const P=T.aiPts, N=P.length; let j=0,bd=1e18;
    for(let i=0;i<N;i++){ const d=(P[i][0]-car.x)**2+(P[i][1]-car.y)**2; if(d<bd){bd=d;j=i;} }
    const n=P[(j+1)%N], t=(car.x-P[j][0])*(n[0]-P[j][0])+(car.y-P[j][1])*(n[1]-P[j][1]);
    this.i=t>=0?(j+1)%N:j;
    // opcionais, fora do original (vêm da versão 2, v2 0x18039f4a0): confiança por ponto da linha, que cai onde o carro
    // bateu de frente, e aderência lida no ponto à frente; desligados, a IA é a de 0x40b890 sem mudança
    this.learn=!!Opts.aiLearn; this.look=!!Opts.aiGrip; if(this.learn){ this.conf=new Float32Array(N).fill(1); this.lat0=0; }
  }
  // batida de frente em borda ou objeto, fora do box (v2 0x18039db50 → 0x18039f4a0): a confiança do ponto atual cai à metade
  // e a dos anteriores cai menos, 1 − 0,5/(k+1), por 40 m (lá, 20 nós de 2 m; aqui os pontos ficam a ~5 m, k = 2,5·m)
  crash(){ if(!this.learn||this.pitLine) return; const C=this.conf, N=C.length;
    for(let m=0;m<8;m++){ const i=((this.i-m)%N+N)%N; C[i]=Math.max(.7,C[i]*(1-.5/(m*2.5+1))); } }
  update(R){
    const c=this.car, T=R.T, s=c.spec, onPit=!!this.pitLine, P=onPit?T.pitPts:T.aiPts, N=P.length;
    const at=k=>onPit?clamp(k,0,N-1):((k%N)+N)%N;
    const ca=Math.cos(c.a), sa=Math.sin(c.a), Rx=-sa, Ry=ca, spd=Math.hypot(c.vx,c.vy), vf=c.vx*ca+c.vy*sa;
    const out=(lc,st)=>{ if(spd>=3||lc===0||lc===1||this.stop) this.cnt=0; else this.cnt++; return {c:lc,steer:st,throttle:lc>=2?1:0,brake:lc<=0?1:0}; };
    // parado no box esperando a equipe
    if(this.stop){ if(c.pit&&c.pit.done||this.stopT++>1500){ this.stop=false; this.served=true; this.boxMode=false; } else return out(0,0); }
    const it=this.cnt%400;
    if(it>=200){ if(spd>20){ this.cnt+=400-it; return {c:100,steer:0,throttle:1,brake:0}; } this.cnt++; return {c:100,steer:0,throttle:1,brake:0}; }
    if(it>=140){ // preso: dá ré virando para o lado da linha
      const i=this.i, n=P[at(i+1)], sx=n[0]-P[i][0], sy=n[1]-P[i][1], rx=P[i][0]-c.x, ry=P[i][1]-c.y;
      const tt=(rx*sx+ry*sy)/(sx*sx+sy*sy+1e-4), dx=rx-tt*sx, dy=ry-tt*sy;
      this.cnt++; return {c:-100,steer:(Rx*dx+Ry*dy)>=0?1:-1,throttle:0,brake:1};
    }
    const Tl=2.5/Math.sqrt(Math.max(c.gs,1e-3)*100)*this.skill;
    const ip=at(this.i-1), a=P[ip], b=P[this.i], sx=b[0]-a[0], sy=b[1]-a[1], rx=c.x-a[0], ry=c.y-a[1];
    let t=(rx*sx+ry*sy)/(sx*sx+sy*sy+1e-4);
    if(t>0){
      const sl=Math.hypot(sx,sy)||1;
      let o=Math.random()*3+2+clamp((rx*-sy+ry*sx)/sl*.75+1.5,0,3);
      for(const oc of R.cars){ if(oc===c) continue;
        const dx=oc.x-c.x, dy=oc.y-c.y, df=dx*ca+dy*sa, lim=oc.spec.ax[2]+s.ax[2]+.5;
        if(-df<lim&&((oc.vx-c.vx)*ca+(oc.vy-c.vy)*sa)*Tl+df<lim){
          const dlat=dx*Rx+dy*Ry, w=s.ax[0]+.5+oc.spec.ax[0];
          if(dlat<=0){ const x=w+dlat; if(x>0) o+=x; } else { const x=dlat-w; if(x<0) o+=x; } } }
      this.off=onPit?100:o<0?0:o>10?200:(o/.05)|0;
      // confiança do ponto que acabou de passar (v2 0x18039f4a0): sobe 0,5 % com o carro alinhado à linha e cai 1 % por metro
      // que ele se afastou dela; lá o teto é habilidade + 0,7, aqui é 1 (nunca mais rápido que a fórmula do original)
      if(this.learn&&!onPit){ const lat=(rx*-sy+ry*sx)/sl, al=spd>1?(c.vx*sx+c.vy*sy)/(sl*spd):1, C=this.conf;
        C[this.i]=clamp(C[this.i]*((al-.5)*.01+1-(lat*this.lat0>=0?(Math.abs(lat)-Math.abs(this.lat0))*.01:0)),.7,1); this.lat0=lat; }
      if(onPit&&this.i>=N-1){ this.pitLine=false; this.boxMode=false; this.i=(T.pitOut+1)%T.aiPts.length; return this.update(R); }
      this.i=at(this.i+1);
      if(!onPit&&this.i===T.pitIn) this.pitDecide(R);
    }
    // ponto-alvo à frente, deslocado para o lado
    let L=Tl/5*spd+1+t; if(L<0) L=0;
    let j=at(ip+Math.floor(L)); const fr=L-Math.floor(L); const j1=at(j+1);
    // desvio para o lado +row0 do original (= R aqui, o mesmo lado em que se mede a posição e os outros carros);
    // antes estava espelhado (ey,−ex): o carro trocava de lado a cada ponto e o "desvio" puxava para o carro da frente (0x40b890)
    const ex=P[j1][0]-P[j][0], ey=P[j1][1]-P[j][1], el=Math.hypot(ex,ey)||1, ov=(this.off*.05-5)/el, ox=-ey*ov, oy=ex*ov;
    const th=c.w*Tl, hx=ca*Math.cos(th)+Rx*Math.sin(th), hy=sa*Math.cos(th)+Ry*Math.sin(th);
    let tx=P[j][0]*(1-fr)+P[j1][0]*fr+ox-c.x-c.vx*Tl-hx*s.aiB8, ty=P[j][1]*(1-fr)+P[j1][1]*fr+oy-c.y-c.vy*Tl-hy*s.aiB8;
    // acelerar, soltar ou frear conforme o alvo (LAB_0040d97c do original): alvo atrás freia, de ré acelera, senão velocidade de curva
    // kf (opcional, da v2) multiplica a aderência usada na velocidade de curva; sem as opções vale 1
    const thr=(dx,dy,kf=1)=>{ if(dx*ca+dy*sa<0) return -100; if(vf<0) return 100;
      const uD=-c.vy*dx+c.vx*dy; let vl=1000;
      // vl = √(|v|·d²·gs·100·0,5/|uD|), com uD = (cima × v)·d = |v|·d·sen θ, isto é, vl² = gs·100 · d/(2·sen θ): aceleração
      // lateral gs·100 no arco que leva ao alvo. O original tira a raiz de |cima × v|² antes de multiplicar (0x40dae9–0x40db7c,
      // CALL 0x405e60 = sqrt, que o pseudocódigo esconde); até 10/11 o port usava v² e a IA quase nunca freava para a curva
      if(uD>=1||uD<=-1) vl=Math.sqrt(spd*(dx*dx+dy*dy)*Math.max(c.gs,1e-3)*kf*50/Math.abs(uD));
      return vl<=spd?(vf<vl?1:0):100; };
    // box (0x40b890, estado ≥3): entra quando o ponto à frente na linha do box, à distância de frenagem 0,1·v²/(gs·100),
    // já passou do próprio box e está a menos de 15 m dele; com outro carro a menos de 5 m do box, segue no corredor
    const box=onPit&&!this.served?T.pitBoxes[c.boxI]:null;
    if(box){ const busy=R.cars.some(o=>o!==c&&Math.hypot(o.x-box.x,o.y-box.y)<5);
      if(!this.boxMode&&!busy){ const jj=at(this.i+Math.trunc(.1*spd*spd/(Math.max(c.gs,1e-3)*100))+1), q=P[jj], qp=P[at(jj-1)];
        if((q[0]-box.x)**2+(q[1]-box.y)**2<225&&(q[0]-box.x)*(q[0]-qp[0])+(q[1]-box.y)*(q[1]-qp[1])>0) this.boxMode=true; }
      if(this.boxMode&&busy&&Math.hypot(box.x-c.x,box.y-c.y)>5) this.boxMode=false; }
    if(box&&this.boxMode){
      // alvo: o box menos metade da componente ao longo da direção do box; nunca acelera de propósito,
      // freia se v² > 200·gs·|alvo|² ou a menos de 4 m (l. 778–843); a equipe atende abaixo de 5 m e 3 m/s
      const dx=box.x-c.x, dy=box.y-c.y, bx=Math.cos(box.a), by=Math.sin(box.a), pr=(dx*bx+dy*by)*.5, lx=dx-bx*pr, ly=dy-by*pr, d=Math.hypot(dx,dy);
      const stB=(Rx*lx+Ry*ly)>=0?1:-1;
      if(d<4&&spd<3){ this.stop=true; this.stopT=0; return out(0,0); }
      if((lx*lx+ly*ly)*2*Math.max(c.gs,1e-3)*100<spd*spd||d<4) return out(0,stB);
      return out(thr(lx,ly),stB);
    }
    const st=(Rx*tx+Ry*ty)>=0?1:-1;
    const j2=at(this.i+1+Math.trunc(.016*spd*spd*Tl*Tl)), ax=P[j2][0]+ox, ay=P[j2][1]+oy;
    let kf=1;
    if(this.learn&&!onPit) kf=this.conf[j2]; // a v2 multiplica o atrito do nó pela confiança dele (0x18039f4a0)
    // a v2 usa o atrito do piso no nó à frente (Wheel.GetCoF na posição, 0x1804577e0); aqui só reduz: a aderência do piso
    // no alvo dividida pela média sob as rodas agora, nunca acima de 1
    if(this.look){ let g0=0; for(const wh of c.wheels) g0+=s.gT[wh.t]*(wh.wet?.5:1); g0/=c.wheels.length;
      kf*=Math.min(1,s.gT[T.tonAt(ax,ay)]*(T.wet(ax,ay)?.5:1)/Math.max(g0,1e-3)); }
    return out(thr(ax-c.x,ay-c.y,kf),st);
  }
  // decisão de parar no box (0x40b890): falta combustível para terminar, ou o dano pesa nas voltas que faltam
  pitDecide(R){
    const c=this.car, T=R.T, O=T.rules||NO_RULES; if(!T.hasPits||T.pitPts.length<2||c.boxI==null) return;
    const left=R.laps-c.lapsDone-1, lapM=T.lapLen; if(left<1||R.timeLimit) return;
    const per=O.fuel*lapM; let go=false;
    if(c.fuel>=per*left) go=c.dmg*left*lapM>2e7;
    else if(per>65536) go=true; // pista mais longa que um tanque: no original a conta divide por zero e a IA para toda volta
    else { const lpt=Math.floor(65536/per);
      if(Math.floor((left-1-Math.floor(c.fuel/per))/lpt)<Math.floor((left-1)/lpt)) go=(left-Math.floor(left/lpt)*lpt)*c.dmg*lapM>2e7;
      else go=c.dmg>1000||Math.floor(left/lpt+1)*c.fuel*Math.random()<per; }
    if(go){ const P=T.pitPts; let j=0,bd=1e18; P.forEach((q,i)=>{ const d=(q[0]-c.x)**2+(q[1]-c.y)**2; if(d<bd){bd=d;j=i;} });
      this.pitLine=true; this.served=false; this.boxMode=false; this.i=Math.min(P.length-1,j+1); }
  }
}

// ====================================================================== box: a equipe troca os pneus (2,5 s), abastece 128 por passo e conserta 6600 a cada 0,5 s
function pitService(R){
  const T=R.T; if(!T.hasPits||!T.rules) return;
  for(const c of R.cars){ if(c.boxI==null) continue;
    const b=T.pitBoxes[c.boxI], d=Math.hypot(b.x-c.x,b.y-c.y), spd=Math.hypot(c.vx,c.vy);
    if(d>=5||spd>=3){ if(c.pit&&d>=10) c.pit=null; continue; }
    if(!c.pit) c.pit={t:0,fuel:c.fuel<65000,tyre:T.rules.tyre>0||c.tyre<FULL,rep:c.dmg>0,done:false};
    const p=c.pit; if(p.done) continue; p.t++;
    if(p.fuel){ c.fuel=Math.min(FULL,c.fuel+128); if(c.fuel>=FULL) p.fuel=false; }
    if(p.tyre&&p.t>=251){ c.tyre=FULL; p.tyre=false; }
    if(p.rep&&p.t%50===0){ c.dmg=Math.max(0,Math.floor((c.dmg-1)/6600)*6600); if(!c.dmg) p.rep=false; }
    if(!p.fuel&&!p.tyre&&!p.rep) p.done=true;
  }
}

// ====================================================================== colisões por impulso
const NO_RULES={tyre:0,fuel:0,fuelKg:0,dmg:0};
// Elipsoide × plano (0x42ea10), reduzido ao plano do chão: P0 = ponto do plano, n = normal, th = meia-espessura

// duas esferas (raio 0,8 a 0,4 m e raio 0,5 a 1 m de altura); o cone recebe −J/(massa·100) dessas esferas, com massa 0,001
// (+0x20), isto é, 10× a reação, e fica marcado como "mexeu" (+0x1d). O movimento depois do toque (0x42f640, corpo 3D com
// bordas em 0x43ae60) está aproximado: desliza com 8 m/s² de atrito e quica nas bordas do tabuleiro.

function moveCones(R){

const cleanTag=s=>String(s||'').normalize('NFD').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,3);

      // cabine: vidro nas laterais e teto na cor do carro

  function mergeGeos(items){

function updateStand(R){

  R.order.forEach((c,i)=>{ const r=rows[i]; if(!r) return; const a=R.order[i-1], K=c.cpTs.length-1, iv=r.children[3];
    let t='', cls='';
    if(c.pit&&!c.pit.done){ t='BOX'; cls='pit'; }
    else if(!a) t=c.finished?'🏁':'–';
    else if(a.cpTs.length-c.cpTs.length>=ncp){ t='+'+Math.floor((a.cpTs.length-c.cpTs.length)/ncp)+' V'; }
    else if(K>=0&&a.cpTs[K]!=null) t='+'+Math.max(0,c.cpTs[K]-a.cpTs[K]).toFixed(2); // ultrapassou depois do checkpoint: 0 até o próximo
    if(c.finished&&a){ cls='fin'; }
    r.children[0].textContent=i+1; r.children[1].style.background='linear-gradient(135deg,'+c.c1+' 50%,'+c.c2+' 50%)'; r.children[2].textContent=c.tag;

    if(fc) sf.querySelector('.cl').style.background='linear-gradient(135deg,'+fc.c1+' 50%,'+fc.c2+' 50%)'; }
}

// avisos de urgência no card de cada jogador deste computador (não existem no original): pneu abaixo de 25 %, dano acima
// de 50 %, combustível que não chega ao fim (consumo por metro O.fuel, como o "F" do original). O card pulsa em vermelho,
// a barra do problema pisca e o texto aparece no card. Um ding baixo quando surge um aviso novo.
function hudAlerts(R,O){
  const run=R.phase==='run'||R.phase==='resume';
  for(const e of hudEls){ const c=e.c, out=[];
    if(run&&!c.finished){
      if(O.tyre&&c.tyre<FULL*.25) out.push(['t','Pneus gastos']);
      if(O.dmg&&c.dmg>FULL*.5) out.push(['d','Carro danificado']);
      if(O.fuel){ const need=O.fuel*R.T.lapLen*(R.timeLimit?1.8:Math.min(1.8,R.laps-c.lapsDone));
        if(c.fuel<=0) out.push(['f','Sem combustível!']); else if(c.fuel<need) out.push(['f','Combustível no fim']); } }
    // no box (pitService): o fundo do card enche da esquerda para a direita com o progresso do serviço, no lugar dos avisos;
    // serviço pronto: borda verde e ding alto até o carro se afastar 10 m do box (quando c.pit volta a null)
    const P=c.pit, inPit=!!(P&&!P.done), ready=!!(P&&P.done)&&!c.finished;
    if(inPit) out.length=0;
    const key=out.map(a=>a[0]).join(), prev=e.alert||'';
    if(out.some(a=>!prev.includes(a[0]))) Sound.ding(false);
    if(ready&&!e.ready) Sound.ding(true);
    e.alert=key; e.ready=ready; e.card.classList.toggle('urg',!!out.length);
    e.rows.forEach(r=>r.classList.toggle('warn',key.includes(r.dataset.k)));
    e.card.classList.toggle('pitting',inPit); e.card.classList.toggle('ready',ready);
    if(inPit){ const left=Math.max(P.tyre?251-P.t:0,P.fuel?(FULL-c.fuel)/128:0,P.rep?Math.ceil(c.dmg/6600)*50:0); // mesmos tempos de pitService
      e.card.style.setProperty('--pp',(100*P.t/(P.t+left)).toFixed(1)+'%');
      out.push(...[[P.tyre,'Trocando pneus'],[P.fuel,'Abastecendo'],[P.rep,'Consertando']].filter(a=>a[0]).map(a=>['s',a[1]])); }
    // precisa parar: box dele destacado na pista (Gfx.boxMarks); some ao chegar ao box
    c.needBox=!!key&&R.T.hasPits&&c.boxI!=null&&!P;
    const html=out.map(a=>'<div'+(a[0]==='s'?' class="s"':'')+'>'+esc(a[1])+'</div>').join(''); if(e.msg.dataset.h!==html){ e.msg.innerHTML=html; e.msg.dataset.h=html; }
    e.msg.hidden=!out.length; }
}

// Pistas no centro do lobby (não existe no original): as pistas escolhidas em ordem de campeonato (ou as do anfitrião, no
// online), e a "atual" (a última clicada, senão a primeira), que é a da ficha embaixo e a da corrida ao vivo opcional.
const stageList=()=>isGuest()?(Net.tracks||[]).map(n=>Tracks.find(t=>t.name===n)).filter(Boolean):selected.map(id=>Tracks.find(t=>t.id===id)).filter(Boolean);

// Retratos das pistas: a cena 3D de cada pista, sem carros, desenhada UMA vez pela câmera do tabuleiro (a mesma da corrida,
// com sombras) e guardada como imagem WebP no localStorage (`gr.thumb.<id>`, ~45 KB cada, com a extensão da volta e o box
// para a ficha). Assim o menu não desenha nada por quadro. Gerados um de cada vez, com folga entre eles, só no menu; a
// pista carregada só para o retrato é solta depois (e.T). Mudou o desenho da pista? Suba THUMB_V para refazer todos.
const THUMB_V=1, THUMB_W=800, THUMB_H=500;
const Thumbs={
  mem:new Map(), bad:new Set(), queue:[], busy:false, tm:0,
  get(e){ if(!e) return null; let t=this.mem.get(e.id); if(t) return t;
    t=store.get('gr.thumb.'+e.id,null); if(t&&t.v===THUMB_V&&t.img){ this.mem.set(e.id,t); return t; } return null; },
  // fila na ordem da tela, a pista atual primeiro
  want(list,cur){ this.queue=[cur,...list].filter((e,i,a)=>e&&a.indexOf(e)===i&&!this.bad.has(e.id)&&!this.get(e)); this.kick(); },
  kick(d=80){ clearTimeout(this.tm); if(this.queue.length) this.tm=setTimeout(()=>this.pump(),d); },
  async pump(){
    if(this.busy||Game.mode!=='menu'||!Gfx.ren||Demo.live()) return;   // fora do menu ou com a corrida ao vivo: retoma no próximo show('menu') / buildMenu
    const e=this.queue.shift(); if(!e) return;
    if(this.get(e)){ this.kick(0); return; }
    this.busy=true;
    try{ const had=!!e.T, T=await loadTrack(e);
      if(Game.mode!=='menu'||Demo.live()){ this.queue.unshift(e); return; }
      const t=this.shoot(T); if(!had&&!(Game.R&&Game.R.T===T)) e.T=null;
      this.mem.set(e.id,t); store.set('gr.thumb.'+e.id,t); stageReady(e); }
    catch(err){ this.bad.add(e.id); }
    finally{ this.busy=false; this.kick(); }
  },
  // monta a pista no Gfx (que no menu está livre), desenha um quadro no tamanho do retrato e copia o canvas
  shoot(T){ const ren=Gfx.ren, cam=Gfx.cam, pr=ren.getPixelRatio(), sh=Opts.shadows;
    Opts.shadows=true; try{ Gfx.build(T); } finally{ Opts.shadows=sh; }
    ren.setPixelRatio(1); ren.setSize(THUMB_W,THUMB_H,false); cam.aspect=THUMB_W/THUMB_H; cam.updateProjectionMatrix(); Gfx.placeCam();
    ren.render(Gfx.scene,cam);
    const c=document.createElement('canvas'); c.width=THUMB_W; c.height=THUMB_H; c.getContext('2d').drawImage(ren.domElement,0,0);
    ren.setPixelRatio(pr); Demo.stale=true; Demo.sz='';   // a cena do Gfx agora é a do retrato
    let img=c.toDataURL('image/webp',.75); if(!img.startsWith('data:image/webp')) img=c.toDataURL('image/png');
    return {v:THUMB_V,img,len:T.lapLen,pits:!!T.hasPits};
  },
};

function buildStage(){
  const v=$('stageView'), list=stageList(), cur=stageCur(list), many=list.length>1, guest=isGuest();
  const k=list.map(e=>e.id).join('|')+'#'+(cur?cur.id:'')+'#'+guest;
  if(k!==stageKey){ stageKey=k; v.innerHTML=''; v.classList.toggle('many',many);
    if(!list.length){ const t=el('div','tc none'); t.appendChild(el('span','tt',guest?'Aguardando o anfitrião':'Escolha uma pista')); v.appendChild(t); }
    list.forEach((e,i)=>{ const b=el('button','tc'), im=el('img'), th=Thumbs.get(e); b.dataset.id=e.id; im.alt=''; im.decoding='async';
      if(th){ im.src=th.img; im.classList.add('on'); } else b.classList.add('wait');
      b.appendChild(im); if(many){ b.appendChild(el('b','no',String(i+1))); if(e===cur) b.classList.add('cur'); }
      b.appendChild(el('span','tt',e.name)); b.title=e.name+(many?' · etapa '+(i+1)+' de '+list.length:'');
      b.setAttribute('aria-label',b.title); if(many) b.setAttribute('aria-pressed',String(e===cur));
      b.onclick=()=>{ if(!many||previewId===e.id) return; previewId=e.id; buildMenu(); };   // com várias, clique escolhe qual vai na ficha
      v.appendChild(b); });
    fitStage(); }
  stageInfo(cur,list); Thumbs.want(list,cur);
}
// retrato pronto: põe a imagem no cartão (sem refazer a grade)
function stageReady(e){ const th=Thumbs.get(e);
  for(const b of $('stageView').children) if(b.dataset.id===e.id){ const im=b.querySelector('img'); im.src=th.img; im.classList.add('on'); b.classList.remove('wait'); }
  const list=stageList(); if(stageCur(list)===e) stageInfo(e,list); }
// grade: uma pista ocupa a janela toda; várias viram cartões 16:10 do maior tamanho que caiba (testa cada número de colunas)
function fitStage(){ const v=$('stageView'), n=v.children.length, s=v.style;
  if(n<=1){ s.gridTemplateColumns='minmax(0,1fr)'; s.gridTemplateRows='minmax(0,1fr)'; s.gridAutoRows=''; s.justifyContent=s.alignContent='stretch'; return; }
  const r=v.getBoundingClientRect(); if(r.width<2) return;
  const gap=n>12?6:10, AR=1.6; let best=0, bc=1;
  for(let c=1;c<=n;c++){ const rows=Math.ceil(n/c), w=Math.min((r.width-(c-1)*gap)/c,(r.height-(rows-1)*gap)/rows*AR); if(w>best+.5){ best=w; bc=c; } }
  best=Math.max(40,Math.floor(best));
  s.gap=gap+'px'; s.gridTemplateColumns='repeat('+bc+','+best+'px)'; s.gridTemplateRows=''; s.gridAutoRows=Math.floor(best/AR)+'px'; s.justifyContent=s.alignContent='center'; }
// ficha da pista atual sob a janela: etapa do campeonato, extensão da volta, distância da corrida, box e recorde
function stageInfo(e,list){ const m=$('trkMeta'); m.innerHTML=''; if(!e) return;
  const T=e.T, th=Thumbs.get(e), len=T?T.lapLen:th&&th.len, pits=T?T.hasPits:th&&th.pits, guest=isGuest();
  const km=(v,d)=>(v/1000).toFixed(d).replace('.',','), add=(h,c)=>{ const s=el('span',c); s.innerHTML=h; m.appendChild(s); };
  if(list.length>1) add('Etapa '+(list.indexOf(e)+1)+' de '+list.length,'c');
  if(len==null) return;   // ainda sem o retrato (que traz a extensão da volta)
  add('volta de <b>'+km(len,2)+' km</b>');
  if(!guest){ const n=raceLaps({lapLen:len}); add(Opts.lenMode==='min'?'<b>'+Opts.mins+' min</b> de corrida':'<b>'+n+'</b> '+(n===1?'volta':'voltas')+' · '+km(n*len,1)+' km'); }
  add(pits?'com box':'sem box');
  const rec=store.get('gr.rec.'+e.id,null); add(rec?'recorde <b>'+fmt(rec.t)+' s</b> · '+esc(rec.name):'sem recorde');
}

// Corrida ao vivo no lobby (opcional, desligada por padrão desde 11/11 por pesar na máquina; Opções → "Corrida no menu";
// não existe no original): com uma pista só, ela aparece em 3D no centro, com os carros do grid correndo sozinhos pela IA.
// É uma corrida `headless` à parte (`Demo.R`, nunca `Game.R`): sem som, sem HUD, sem desgaste nem dano, e não grava nada.
// A pista só é remontada quando muda; trocar piloto, carro ou cor refaz só os carros.
const Demo={
  R:null, cur:null, key:'', ck:'', stale:true, busy:false, again:false, tm:0, sz:'', lastDraw:0,
  live(){ return Opts.demo3d===true&&!!Gfx.ren&&stageList().length===1; },
  moving(){ return !Sky.calm; },            // parada com "reduzir movimento" do sistema
  ready(){ return !!(Gfx.ren&&Gfx.T&&!this.stale&&this.key); },
  off(){ clearTimeout(this.tm); this.R=null; this.ck=''; Gfx.sway=false; $('stageView').classList.remove('live'); if(Game.mode==='menu') $('view').hidden=true; },
  // o canvas 3D ocupa exatamente a janela do centro (#stageView)
  fit(){ const cv=$('view'), r=$('stageView').getBoundingClientRect(); if(Game.mode!=='menu'||r.width<2||!Gfx.ren) return;
    cv.classList.add('menu'); const s=cv.style; s.left=r.left+'px'; s.top=r.top+'px'; s.width=r.width+'px'; s.height=r.height+'px';
    const k=Math.round(r.width)+'x'+Math.round(r.height); if(k!==this.sz){ this.sz=k; Gfx.resize(); } },
  unfit(){ const cv=$('view'); cv.classList.remove('menu','swap'); cv.style.cssText=''; this.sz=''; Gfx.sway=false; },
  sync(){ if(!Gfx.ren) return; if(!this.live()){ if(this.R||$('stageView').classList.contains('live')) this.off(); return; }
    clearTimeout(this.tm); this.tm=setTimeout(()=>this.apply(),this.ready()?180:0); },   // chamado no fim de buildMenu
  async apply(){
    if(Game.mode!=='menu'||!this.live()) return;
    if(this.busy){ this.again=true; return; }
    const guest=isGuest(), e=stageCur(stageList());
    this.cur=e||null; if(!e) return;
    const rows=(guest?(Net.rows||[]):raceRows()).slice(0,6);
    const ck=e.id+'#'+rows.map(r=>[r.name,r.car,r.c1,r.c2,r.kind==='ai'&&r.drv?r.drv.skill:''].join(',')).join('|');
    this.busy=true; const cv=$('view');
    try{
      if(this.stale||this.key!==e.id||Gfx.T!==e.T){
        cv.classList.add('swap');
        const T=await loadTrack(e); if(Game.mode!=='menu'||!this.live()) return;
        Gfx.build(T); this.key=e.id; this.stale=false; this.ck=''; this.R=null; }
      if(this.ck!==ck){ this.ck=ck; const T=e.T, sv=Game.season; Game.season=null;
        Gfx.clearCars();
        const R=newRace(T,rows.map(r=>({drv:{name:r.name,tag:r.tag,human:false,skill:r.kind==='ai'&&r.drv?(r.drv.skill??80):90,c1:r.c1,c2:r.c2},spec:carByName(r.car)})),true);
        Game.season=sv; R.phase='run'; R.laps=1e9; R.timeLimit=null; R.demo=true; T.rules={tyre:0,fuel:0,fuelKg:0,dmg:0};
        Gfx.addCars(R); this.R=R; }
      Gfx.sway=this.moving(); cv.hidden=false; this.sz=''; this.fit(); this.lastDraw=0; stageInfo(e,[e]);   // sz='': Gfx.build mediu o canvas escondido
      $('stageView').classList.add('live'); void cv.offsetWidth; cv.classList.remove('swap');
    }catch(err){ cv.hidden=true; }
    finally{ this.busy=false; if(this.again){ this.again=false; this.sync(); } }
  },
  // um quadro da vitrine (chamado por frame no menu); parada, redesenha só de vez em quando
  frame(now,dt){ const R=this.R; if(!R||!this.ready()||$('view').hidden||!this.live()) return false;
    const mv=this.moving(); if(!mv&&now-this.lastDraw<400) return true; this.lastDraw=now;
    if(mv){ acc+=dt; while(acc>=DT){ raceStep(R); acc-=DT; } }
    Gfx.frame(R,mv?dt:0); return true; },
};

function raceRows(){
  const loc=Slots.map(s=>({s,d:drvByName(s.d)})).filter(x=>x.d).map(x=>({kind:x.d.human?'local':'ai',drv:x.d,name:x.d.name,car:x.s.car,c1:x.d.c1,c2:x.d.c2,slot:x.s}));
  const rem=Net.remotes().map(p=>({kind:'remote',id:p.id,name:p.name,tag:p.tag,car:p.car,c1:p.c1,c2:p.c2}));
  if(!rem.length) return loc;
  return [...loc.filter(r=>r.kind==='local'),...rem,...loc.filter(r=>r.kind==='ai')].slice(0,NET_MAX);
}
function buildRoomRow(guest){

  const leave=t=>{ const b=el('button','lk',t); b.onclick=()=>{ N.close(); history.replaceState(null,'',location.pathname+location.search); buildMenu(); }; return b; };
  if(N.state==='connecting'){ lab.textContent=N.role==='host'?'Abrindo a sala…':'Entrando na sala '+N.code+'…'; const c=el('button','lk','Cancelar'); c.onclick=()=>{ N.close(); buildMenu(); }; row.append(c); return; }
  if(N.open()){ const n=N.remotes().length; lab.textContent='Sala aberta';
    const code=el('b','rcode',N.code), cp=el('button','chip2','Copiar convite');
    cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(N.inviteUrl()); cp.textContent='Link copiado'; }catch(e){ cp.textContent=N.inviteUrl(); } };
    const cl=leave('Fechar'); cl.style.marginLeft='auto'; row.append(code,cp,cl);
    g.appendChild(el('span','rst',n?n+(n===1?' jogador conectado':' jogadores conectados'):'Esperando jogadores: mande o convite.')); return; }

    g.appendChild(el('span','rst',N.racing?'Corrida em andamento: você entra na próxima.':'O anfitrião escolhe a pista e larga.')); return; }

  const jb=el('button','lk','Entrar'); jb.title='Entra na sala com este código'; jb.onclick=()=>N.join(ci.value);
  row.append(op,ci,jb);

function buildOptions(){
  // duas colunas de dez linhas: Corrida + Tela | Pontos + Som (assim a tela cabe em 1100×620 sem rolar)
  const box=$('optGrid'); box.innerHTML=''; const col=t=>{ const c=document.createElement('div'); c.className='optgrid'; box.appendChild(c); head(c,t); return c; };
  const head=(c,t)=>{ const h=document.createElement('div'); h.className='h'; h.textContent=t; c.appendChild(h); };
  let g=col('Corrida');

  R.order.forEach((c,i)=>{ if(R.net&&!(c.human&&!c.drv.remote)) return; const st=statOf(c.name); if(i<6) st.r[i]++; st.pts+=c.pts||0; if(R.fastest&&c.best!=null&&c.best===R.fastest.t) st.fl++; });

function keyCapture(e){

let padRaf=0;
function padCapture(){ // espera um botão ou eixo do controle mudar em relação ao repouso
  cancelAnimationFrame(padRaf); const w=waitKey, base={};
  const snap=(p,first)=>{ p.buttons.forEach((b,i)=>{ const k=p.index+'b'+i; if(first||!b.pressed) base[k]=b.pressed; }); p.axes.forEach((v,i)=>{ const k=p.index+'a'+i; if(first) base[k]=v; }); };
  for(const p of pads()) if(p) snap(p,true);
  const tick=()=>{ if(waitKey!==w||Game.mode!=='drivers') return;
    for(const p of pads()){ if(!p) continue;
      if(!(p.index+'b0' in base)) snap(p,true);
      for(let i=0;i<p.buttons.length;i++) if(p.buttons[i].pressed&&!base[p.index+'b'+i]){ setBind('Pad'+p.index+':B'+i); return; }
      for(let i=0;i<p.axes.length;i++){ const dv=p.axes[i]-base[p.index+'a'+i]; if(Math.abs(dv)>.6){ setBind('Pad'+p.index+':A'+i+(dv>0?'+':'-')); return; } }
      snap(p,false); }
    padRaf=requestAnimationFrame(tick); };
  padRaf=requestAnimationFrame(tick);
}

  // ---------------------------------------------------------------- convidado
  async join(code){

    try{ await loadPeerLib(); }catch(e){ return this.fail(e.message); }
    const p=new Peer(undefined,peerOpts()); this.peer=p;
    this.joinTimer=setTimeout(()=>{ if(this.state==='connecting'&&this.peer===p) this.fail('A sala não respondeu. Confira o código.'); },15000);
    p.on('open',()=>{ if(this.peer!==p) return; const c=p.connect('grali-'+code,{reliable:true,serialization:'json'}); this.conn=c;
      c.on('open',()=>{ const me=this.me(); c.send({t:'hello',v:NET_V,name:me.name,tag:me.tag,car:me.car,c1:me.c1,c2:me.c2}); });

  },
  hostGone(){ if(this.role!=='guest'||this.state==='off') return; const inRace=Game.mode!=='online'; this.close(true); this.say('O anfitrião fechou a sala.'); buildNet(); if(inRace){ Game.R=null; show('menu'); } },
  helloAgain(){ if(this.role==='guest'&&this.conn&&this.conn.open){ const me=this.me(); this.conn.send({t:'hello',v:NET_V,name:me.name,tag:me.tag,car:me.car,c1:me.c1,c2:me.c2}); } else if(this.role==='host'&&this.players[0]){ const me=this.me(); Object.assign(this.players[0],{name:me.name,tag:me.tag,car:me.car,c1:me.c1,c2:me.c2}); this.lobbyOut(); } },
  guestMsg(d){
    if(!d||typeof d!=='object') return;

    if(d.t==='err'){ this.fail(String(d.m||'Erro')); return; }

  },
  async guestStart(d){

    let T; try{ T=await loadTrack(entry); }catch(e){ this.send({t:'leave'}); this.state='lobby'; show('menu'); this.say('Não consegui abrir a pista do anfitrião.'); return; }

  },
  guestFrame(R,dt){
    const me=R.cars.find(c=>c.mine), now=performance.now();

      if(key!==this.lastIn||now-this.lastInT>120){ this.lastIn=key; this.lastInT=now; this.send({t:'in',c:inp.c,s:r2(inp.steer)}); } }

      c.x=L(a[0],b[0]); c.y=L(a[1],b[1]); c.a=LA(a[2],b[2]); c.vx=L(a[3],b[3]); c.vy=L(a[4],b[4]); c.delta=L(a[5],b[5]); c.ws=L(a[6],b[6]);
      const ca=Math.cos(c.a), sa=Math.sin(c.a); c.wheels.forEach((w,q)=>{ w.slide=L(a[7+q]||0,b[7+q]||0); w.t=R.T.tonAt(c.x+ca*w.lx-sa*w.ly,c.y+sa*w.lx+ca*w.ly); });
      c.idx=R.T.nearest(c.x,c.y,c.idx); });

    if(me){ if(me.finished&&!me.saidFin){ me.saidFin=1; say(R,'Você terminou em '+(R.order.indexOf(me)+1)+'º lugar'); }
      else if(!me.finished&&me.lapsDone!==(me.lastL??me.lapsDone)&&me.lapsDone===R.laps-1){ say(R,'Última volta!'); Sound.ding(true); }

    for(const S of B){ if(S.used||!S.x) continue; S.used=1; S.x.forEach((v,j)=>{ const c=R.cars[j]; if(!c) return; [c.fuel,c.tyre,c.dmg,c.thr]=v; c.skAcc=(c.skAcc||0)+v[4]; c.dmgSnd=(c.dmgSnd||0)+v[5]; }); }
  },
  guestEnd(d){
    const R=Game.R; if(!R||R.net!=='guest') return;
    d.st.forEach((s,j)=>{ const c=R.cars[j]; if(!c) return; c.lapsDone=s[0]; c.best=s[1]; c.finished=s[2]; c.finishT=s[3]; c.pts=s[4]; });
    R.order=d.o.map(j=>R.cars[j]).filter(Boolean); R.fastest=d.f; this.state='lobby'; finishRace(R);
  },
};
function trackDesc(e){
  if(e.b64) return {name:e.name,b64:e.b64};
  if(e.b64raw) return {name:e.name,b64raw:e.b64raw};
  if(e.buf){ let s=''; const u=new Uint8Array(e.buf); for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return {name:e.name,b64raw:btoa(s)}; }
}

{ const m=/#sala=([A-Za-z0-9]+)/.exec(location.hash); if(m){ Net.joinCode=m[1].toUpperCase(); setTimeout(()=>Net.join(Net.joinCode),300); } }

// navegação dos menus pelas setas: o foco vai para o controle mais próximo naquela direção; Enter/Espaço ativa
const NAV_DIR={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
const NAV_SCOPE={menu:'mMain',options:'mOpt',drivers:'mDrv',paused:'pauseBox',results:'resBox'};
function navScope(){ if(!$('dlg').hidden) return $('dlgBody'); const id=NAV_SCOPE[Game.mode]; return id?$(id):null; }
function navScroller(n,stop){ for(let p=n.parentElement;p&&p!==stop;p=p.parentElement){ const o=getComputedStyle(p).overflowY; if(o==='auto'||o==='scroll') return p; } return null; }
function menuNav(e){
  const d=NAV_DIR[e.code], sc=navScope(); if(!d||!sc||e.altKey||e.ctrlKey||e.metaKey) return false;
  const cur=document.activeElement, inS=!!cur&&cur!==document.body&&sc.contains(cur);
  if(inS&&(cur.tagName==='TEXTAREA'||(cur.tagName==='SELECT'&&d[0]))) return false;   // na caixa de escolha, ← → trocam o valor e ↑ ↓ navegam
  if(inS&&cur.tagName==='INPUT'&&d[0]){ if(cur.type==='range') return false;   // ← → mexem no valor
    if(cur.type!=='color'){ const a=cur.selectionStart, b=cur.selectionEnd, n=cur.value.length; if(a!=null&&(d[0]<0?(a>0||b>0):(a<n||b<n))) return false; } }   // ← → andam no texto até a borda
  const all=[...sc.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(n=>!n.disabled&&n.getClientRects().length&&!n.closest('.locked,[hidden]')&&getComputedStyle(n).visibility!=='hidden');
  const go=n=>{ n.focus({preventScroll:true,focusVisible:true}); n.scrollIntoView({block:'nearest',inline:'nearest'}); return true; };
  if(!inS) return all.length?go(all.find(n=>n.classList.contains('sel'))||all[0]):false;
  // fora de vista numa lista com rolagem só vale se o foco já está nessa lista (assim as setas rolam a lista de pistas)
  const myS=navScroller(cur,sc), vis=n=>{ const s=navScroller(n,sc); if(!s||s===myS) return true; const a=n.getBoundingClientRect(), b=s.getBoundingClientRect(); return a.bottom>b.top+2&&a.top<b.bottom-2; };
  const r=cur.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let best=null, bs=Infinity;
  for(const n of all){ if(n===cur||!vis(n)) continue; const q=n.getBoundingClientRect(), qx=q.left+q.width/2, qy=q.top+q.height/2;
    let main, side, off;
    if(d[0]){ if((qx-cx)*d[0]<=1) continue; main=d[0]>0?q.left-r.right:r.left-q.right; side=Math.max(0,q.top-r.bottom,r.top-q.bottom); off=Math.abs(qy-cy); }
    else { if((qy-cy)*d[1]<=1) continue; main=d[1]>0?q.top-r.bottom:r.top-q.bottom; side=Math.max(0,q.left-r.right,r.left-q.right); off=Math.abs(qx-cx); }
    const s=Math.max(0,main)+2*side+.1*off; if(s<bs){ bs=s; best=n; } }
  if(best) go(best); return true;   // sem vizinho naquela direção: fica onde está, mas a seta não vaza para o carro
}
window.addEventListener('keydown',e=>{
  if(waitKey&&Game.mode==='drivers'){ keyCapture(e); return; }
  if(Game.mode!=='race'&&menuNav(e)){ e.preventDefault(); return; }
  const typing=e.target&&['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName); if(typing) return;
  keys.add(e.code);
  if(Game.mode==='race'||Game.mode==='paused'){
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if(e.code==='Escape'||e.code==='KeyP'){ if(Game.mode==='race') show('paused'); else resumeRace(); }
    if(e.code==='Backspace'&&Game.mode==='race'&&Game.R&&Game.R.phase==='run'){ for(const c of Game.R.cars) if(c.human&&Math.hypot(c.vx,c.vy)<2) resetCar(Game.R,c); }
  }
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{ keys.clear(); if(Game.mode==='race') show('paused'); });
document.querySelectorAll('#touch button').forEach(b=>{ const k=b.dataset.k, on=v=>e=>{ e.preventDefault(); touchK[k]=v; b.classList.toggle('on',!!v); };
  b.addEventListener('pointerdown',on(1)); b.addEventListener('pointerup',on(0)); b.addEventListener('pointercancel',on(0)); b.addEventListener('pointerleave',on(0)); });

// ====================================================================== laço principal
let last=performance.now(), acc=0;
function frame(now){
  let dt=Math.min(.2,(now-last)/1000); last=now;
  const R=Game.R;
  if(R&&(Game.mode==='race'||Game.mode==='paused'||Game.mode==='results')){
    const live=Game.mode==='race'||(R.net&&Game.mode==='paused');
    if(R.net==='guest'){ if(live) Net.guestFrame(R,dt); }
    else if(live){ acc+=dt; while(acc>=DT){ raceStep(R); if(R.net) Net.hostStep(R); acc-=DT; } } else acc=0;
    Gfx.frame(R,live?dt:0); updateHud(R,dt);
  }
  else if(Game.mode==='menu') Demo.frame(now,dt);
  Sound.update(R,Game.mode==='race');
  requestAnimationFrame(frame);
}
try{ Sky.init(); }catch(e){}
try{ Gfx.init(); }catch(e){ document.body.insertAdjacentHTML('beforeend','<div class="box">Seu navegador não conseguiu iniciar o 3D (WebGL). Tente outro navegador.</div>'); }
buildMenu(); show('menu'); requestAnimationFrame(frame);
if(firstVisit) dialog((box,close)=>{
  box.appendChild(el('h2',null,'Bem-vindo!'));
  box.appendChild(el('p',null,'Crie seu primeiro piloto para correr contra os carros do computador.'));
  const acts=el('div','dacts'), yes=el('button','lk','Criar piloto'), no=el('button','lk','Agora não');
  yes.onclick=()=>{ close(); show('drivers'); newDriver(); Slots.unshift({d:Drivers[drvIdx].name,car:'General'}); saveAll(); };
  no.onclick=close; acts.append(yes,no); box.appendChild(acts);
});

window.__gr={Tracks,loadTrack,CARS,drawCarIcon,simulate:async(name,secs,carName)=>{
  const e=Tracks.find(t=>t.name===name); const T=await loadTrack(e);
  const ents=Drivers.slice(0,6).map(d=>({drv:Object.assign({},d,{human:false,skill:100}),spec:carByName(carName||'General')}));
  Game.season=null; const R=newRace(T,ents,true); R.phase='run'; const n=Math.round(secs/DT); const tr=R.cars.map(()=>[]); for(let i=0;i<n;i++){ raceStep(R); if(i%25===0) R.cars.forEach((c,k)=>tr[k].push(c.x,c.y)); } window.__lastTrace={T,tr,names:R.cars.map(c=>c.name)};
  return {lapLen:Math.round(T.lapLen),cps:T.cps.length,cars:R.cars.map(c=>[c.name,c.lapsDone,c.best&&+c.best.toFixed(2)]),dbg:R.cars.filter(c=>c.lapsDone<2).map(c=>({n:c.name,x:+c.x.toFixed(1),y:+c.y.toFixed(1),idx:c.idx,N:T.N,next:c.nextCp,v:+Math.hypot(c.vx,c.vy).toFixed(1),h:+T.heightAt(c.x,c.y).toFixed(2),wet:T.wet(c.x,c.y),ai:c.ai&&c.ai.rev,wl:T.water,rx:+T.rx[c.idx].toFixed(1),ry:+T.ry[c.idx].toFixed(1)}))}; },
  Net,Gfx,Sky,start:async name=>{ selected=[Tracks.find(t=>t.name===name).id]; goStart(); }, Game, Opts, newRace, raceStep, Sound, collide, carHit, AI, buildHud, updateHud, autoTag, get Drivers(){ return Drivers; }};
})();
