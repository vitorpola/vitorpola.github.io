<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>G-Rali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a tilted 3D board over a sea-blue backdrop, a timing bar docked at the bottom, and flat pale-blue menu sheets like the original. */
:root{
  --sea:#3b8ae6;
  --sea-light:#62a6f2;
  --sheet:#dbe5ee;
  --ink:#0b5d91;
  --ink-dim:#9db2c6;
  --head:#d00000;
  --btn:#0c3553;
  --rule:#9fb3c8;
  --bar:#0f5a8c;
  --mono:"Lucida Console","Share Tech Mono","Consolas",ui-monospace,monospace;
  --text:#123;        /* valores e textos fortes */
  --on-btn:#fff;      /* texto sobre botão cheio */
  --field:#fff;       /* fundo de campos, teclas e listas */
  --field-hover:#eef4f9;
  --sel:#a4b6c9;      /* pista escolhida */
  --wait-bg:#fff3f3; --wait-pulse:#ffd9d9;
  --dim-back:rgba(12,53,83,.35);
  --prev-glow:#cbd8e4;
  color-scheme:light;
}
/* tema escuro: só as telas fora da corrida (menus, opções, pilotos, diálogos) */
:root[data-theme="dark"]{
  --sheet:#141d26;
  --ink:#8cc4ee;
  --ink-dim:#5d7286;
  --head:#ff6a5c;
  --btn:#9fcdf0;
  --rule:#2e4153;
  --text:#e3ecf3;
  --on-btn:#0d1620;
  --field:#0e1720;
  --field-hover:#1b2a38;
  --sel:#2d4b68;
  --wait-bg:#3a1d1d; --wait-pulse:#5a2626;
  --dim-back:rgba(0,0,0,.55);
  --prev-glow:#243444;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--mono);color:var(--ink);
  background:var(--sea);
  background-image:radial-gradient(ellipse 22% 7% at 14% 8%,var(--sea-light) 60%,transparent 62%),
    radial-gradient(ellipse 18% 6% at 88% 14%,var(--sea-light) 60%,transparent 62%),
    radial-gradient(ellipse 25% 8% at 6% 52%,var(--sea-light) 60%,transparent 62%),
    radial-gradient(ellipse 20% 6% at 94% 46%,var(--sea-light) 60%,transparent 62%),
    radial-gradient(ellipse 26% 8% at 10% 86%,var(--sea-light) 60%,transparent 62%),
    radial-gradient(ellipse 22% 7% at 92% 80%,var(--sea-light) 60%,transparent 62%);}
#view{position:fixed;left:0;top:0;width:100%;height:calc(100% - var(--hudh,0px));display:block;outline:none;touch-action:none}
#ed{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#1d3a52}
button{font-family:inherit}
/* menu sheets */
.sheet{position:fixed;inset:0;background:var(--sheet);overflow:hidden;padding-inline:16px;padding-block:0}
.sheet .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;height:100%}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:clamp(8px,2.2vh,22px) 2% clamp(6px,1.2vh,10px);border-bottom:3px solid var(--rule);flex-wrap:wrap}
.mhead h1{margin:0;font-weight:400;font-size:clamp(20px,2.4vw,28px);color:var(--head)}
.mhead .brand{font-size:clamp(18px,2.2vw,26px);color:var(--ink)}
.mbody{flex:1;min-height:0;padding:clamp(8px,1.8vh,18px) 4%;display:flex;flex-direction:column;gap:clamp(6px,1.4vh,14px);overflow-y:auto}
.mfoot{position:relative;display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;border-top:3px solid var(--rule);padding:clamp(6px,1.2vh,12px) 2% clamp(8px,1.8vh,18px)}
.mmsg{position:absolute;left:0;right:0;bottom:100%;margin:0 0 6px;text-align:center;color:var(--head);font-size:16px;background:var(--sheet)}
.lk{all:unset;cursor:pointer;color:var(--ink);font-size:clamp(17px,1.9vw,24px);padding:2px 6px}
.lk:hover,.lk:focus-visible{color:var(--head);outline:none}
.lk.dim{color:var(--ink-dim)}
.sq{all:unset;cursor:pointer;width:34px;height:34px;box-sizing:border-box;display:inline-grid;place-items:center;font-size:20px;border:3px solid var(--btn);color:var(--btn);background:transparent;flex:none}
.sq.fill{background:var(--btn);color:var(--on-btn)}
.sq:focus-visible{outline:2px solid var(--head)}
.lenrow{display:grid;grid-template-columns:1fr auto minmax(170px,auto) auto;align-items:center;gap:12px;max-width:900px;font-size:clamp(17px,1.9vw,24px)}
.lenrow .val{text-align:center;color:var(--text);white-space:nowrap}
.mid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,1fr);gap:30px;align-items:stretch;flex:none}
.slot{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:12px;border-bottom:3px solid var(--rule);height:clamp(30px,5.4vh,48px);font-size:clamp(16px,1.8vw,23px)}
.slot .car{all:unset;cursor:pointer;text-align:right;color:var(--ink)}
.slot .drv{all:unset;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.ai .car,.slot.ai .drv{color:var(--ink-dim)}
.slot canvas{width:64px;height:40px;max-height:100%;object-fit:contain}
.drvbox{border:3px solid var(--btn);height:calc(6 * clamp(30px,5.4vh,48px) - clamp(34px,6vh,50px));box-sizing:border-box;overflow-y:auto;padding:4px 10px;font-size:clamp(17px,1.9vw,24px)}
.drvbox button{all:unset;cursor:pointer;display:block;line-height:1.38;color:var(--ink)}
.drvbox button.ai{color:var(--ink-dim)}
.drvbox button.used{text-decoration:line-through;opacity:.55}
.trkbar{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;font-size:clamp(16px,1.8vw,23px)}
.trkbar .rnd{display:flex;align-items:center;gap:8px}.trkbar .rnd .sq{width:28px;height:28px;font-size:17px}
.trkbar .count{margin-left:auto}
.trkbar .tlab{color:var(--head)}
.trkbar .find{font:inherit;font-size:.9em;color:var(--text);background:var(--field);border:3px solid var(--btn);padding:2px 10px;width:12em;min-width:0}
.trkbar .find::placeholder{color:var(--ink-dim)}
.trkbar .count{color:var(--ink-dim);font-size:clamp(16px,1.8vw,23px)}
#trkGrid{border:3px solid var(--btn);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:max-content;align-content:start;flex:1;min-height:90px;overflow-y:auto;padding:2px 0}
#trkGrid button{all:unset;cursor:pointer;padding:3px 18px;font-size:clamp(16px,1.8vw,23px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trkGrid button.sel{background:var(--sel)}
#trkGrid button:focus-visible{outline:2px solid var(--head)}
.hint{color:var(--ink-dim);font-size:15px;margin:0;line-height:1.5}
.optgrid{display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(200px,1fr) auto;gap:12px 14px;align-items:center;max-width:900px;font-size:clamp(16px,1.8vw,23px)}
.optgrid .h{grid-column:1/-1;color:var(--head);margin-top:6px}
.optcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:10px 48px;align-items:start}
.optcols .optgrid{gap:clamp(6px,1.4vh,12px) 12px;grid-template-columns:minmax(150px,1fr) auto minmax(120px,1fr) auto}
.bar{height:34px;background:transparent;position:relative;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-dim)}
.bar span{position:relative}
.optgrid .tog{all:unset;cursor:pointer;grid-column:2/5;text-align:center;color:var(--text)}
.optgrid .na{grid-column:2/5;text-align:center;color:var(--ink-dim);font-size:.8em}
.kbtn{all:unset;cursor:pointer;grid-column:2/5;text-align:center;color:var(--text)}
.kbtn.wait{color:var(--head)}
#drvPrev{width:150px;height:110px;justify-self:center}
input.nm{font:inherit;color:var(--text);background:transparent;border:0;border-bottom:2px solid var(--rule);text-align:center;width:100%;min-width:0}
/* in-race HUD */
#hud{position:fixed;left:0;right:0;bottom:0;height:var(--hudh,84px);background:var(--bar);color:#fff;display:flex;align-items:center;gap:18px;padding-inline:10px;box-sizing:border-box;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
#hud .tn{min-width:170px;font-size:24px;line-height:1.35;white-space:nowrap}
#hud .lap{font-size:24px;min-width:70px;text-align:center}
#hudCars{display:flex;gap:14px;flex:1;justify-content:center;overflow:hidden}
.hc{display:grid;grid-template-columns:44px auto;grid-template-rows:auto auto;gap:3px 6px;align-items:center}
.hc canvas{width:44px;height:30px;grid-row:1}
.hc .bars{grid-row:2;display:flex;flex-direction:column;justify-content:space-between;height:30px;padding:2px 3px;background:#111;border:3px solid var(--c)}
.hc .bars span{display:flex;align-items:center;gap:2px;height:8px;font-size:8px;line-height:1}
.hc .bars b{width:9px;text-align:center;font-weight:normal}
.hc .bars i{height:5px;background:#3d3;display:block}
.hc .bars span:nth-child(2) i{background:#e33}
.hc .bars span:nth-child(3) i{background:#ee3}
.hc .b .p.f{color:#f33}
.hc .b{border:3px solid var(--c);background:#111;font-size:24px;padding:0 6px;display:flex;gap:18px;justify-content:space-between;min-width:96px;line-height:1.15;font-variant-numeric:tabular-nums}
.hc .b .p{color:#ff0}
.hc .b .p.pit{color:#4cf}
.hc .b .bt{color:#9f3;font-size:.65em;align-self:center}
.hc .b.pit{background:linear-gradient(90deg,#1b5fb0 var(--pp,0%),#111 0)}
#intro{position:fixed;left:50%;top:calc((100% - var(--hudh,84px))/2);transform:translate(-50%,-50%);background:rgba(55,55,55,.82);color:#fff;padding:36px 52px;font-size:clamp(18px,2.2vw,28px);line-height:1.3;min-width:min(340px,80vw);box-sizing:border-box;white-space:pre-line}
#intro b{color:#ff0;font-weight:400}
#big{position:fixed;left:50%;top:calc((100% - var(--hudh,84px))*.45);transform:translate(-50%,-50%);font-size:clamp(46px,9vw,110px);color:#ff0;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;pointer-events:none;white-space:nowrap}
#msg{position:fixed;left:50%;top:calc((100% - var(--hudh,84px))*.2);transform:translateX(-50%);font-size:clamp(20px,3vw,34px);color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none;white-space:nowrap}
/* semáforo da largada: as luzes vermelhas acendem uma por segundo e todas ficam verdes no "já" */
#lights{position:fixed;left:50%;top:calc((100% - var(--hudh,84px))*.14);transform:translate(-50%,-50%);display:flex;gap:clamp(10px,1.6vw,18px);padding:clamp(10px,1.6vw,16px) clamp(14px,2.2vw,24px);background:#151515;border:4px solid #333;border-radius:14px;box-shadow:0 6px 0 #0006;pointer-events:none}
#lights i{width:clamp(28px,4.2vw,54px);aspect-ratio:1;border-radius:50%;background:#3a0d0d;box-shadow:inset 0 -4px 0 #0008}
#lights i.r{background:radial-gradient(circle at 40% 35%,#ff9a8a,#e3170a 55%,#8f0a03);box-shadow:0 0 22px #ff2a14}
#lights.go i{background:radial-gradient(circle at 40% 35%,#c8ffb0,#1ed41a 55%,#0a7d08);box-shadow:0 0 22px #3cff2e}
/* indicador sobre o carro de cada jogador humano */
#tags{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none}
#tags .tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;font-size:clamp(14px,1.5vw,19px);color:#fff;white-space:nowrap}
#tags .tag b{font-weight:400;background:#111d;border:3px solid var(--c);padding:1px 9px;text-shadow:1px 1px 0 #000}
#tags .tag::after{content:"";width:0;height:0;border:9px solid transparent;border-top:11px solid var(--c);border-bottom:0;margin-top:-1px}
#endCd{position:fixed;left:50%;top:calc((100% - var(--hudh,84px))*.1);transform:translateX(-50%);font-size:clamp(16px,2.2vw,26px);color:#ff0;background:#000a;padding:3px 14px;pointer-events:none;white-space:nowrap}
.box{position:fixed;left:50%;top:calc((100% - var(--hudh,84px))/2);transform:translate(-50%,-50%);background:rgba(55,55,55,.88);color:#fff;padding:26px 30px;font-size:clamp(15px,1.7vw,21px);width:min(780px,calc(100% - 32px));box-sizing:border-box;max-height:calc(100% - 120px);overflow:auto}
.box h3{margin:0 0 14px;font-weight:400;color:#ff0;font-size:1.3em}
.box table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.box th{color:#ff0;font-weight:400;text-align:left;padding:3px 8px}
.box td{padding:3px 8px;white-space:nowrap}
.box td.n{text-align:right}
.box .chip{display:inline-block;width:12px;height:12px;margin-right:8px;border:1px solid #000}
.box .acts{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.box .acts button{all:unset;cursor:pointer;color:#fff;font-size:1.15em}
.box .acts button:hover,.box .acts button:focus-visible{color:#ff0}
.tablewrap{overflow-x:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;border:2px solid var(--btn);padding:4px 10px;color:var(--btn)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.warn{color:var(--head);margin:0;min-height:1.2em;font-size:14px}
#touch{position:fixed;left:0;right:0;bottom:calc(var(--hudh,84px) + 10px);padding:0 16px;display:flex;justify-content:space-between;pointer-events:none}
#touch .g{display:flex;gap:12px;pointer-events:auto}
#touch button{all:unset;width:70px;height:70px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.5);color:#fff;display:grid;place-items:center;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
#touch button.on{background:rgba(255,220,0,.5)}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(55,55,55,.85);color:#fff;padding:18px 28px;font-size:20px}
@media (max-width:820px){
  .mid{grid-template-columns:1fr}
  #trkGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lenrow{grid-template-columns:1fr auto auto auto}
  #hud .tn{min-width:0;font-size:16px}
  #hud .lap{font-size:18px;min-width:0}
  .hc canvas,.hc .bars{display:none}
  .hc{grid-template-columns:auto}
  .hc .b{font-size:16px;min-width:0;gap:8px}
  .optgrid{grid-template-columns:1fr auto minmax(110px,1fr) auto}
}
.drvtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:clamp(17px,1.9vw,24px)}
.dsel{font:inherit;color:var(--btn);background-color:var(--field);border:3px solid var(--btn);padding:4px 34px 4px 10px;min-width:240px;max-width:100%;appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--btn) 50%),linear-gradient(135deg,var(--btn) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.dsel.small{min-width:0;font-size:.85em}
.dsel:focus-visible,.drvBody button:focus-visible{outline:2px solid var(--head);outline-offset:2px}
.drvcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px 40px;font-size:clamp(16px,1.6vw,20px)}
.dcol{display:flex;flex-direction:column;gap:clamp(6px,1.3vh,12px);min-width:0}
.dcol .h{color:var(--head);margin-top:4px}
#drvPrev{width:auto;max-width:100%;height:min(240px,30vh);aspect-ratio:48/34;align-self:center;background:radial-gradient(ellipse at 50% 70%,var(--prev-glow) 0,transparent 70%)}
.dcap{text-align:center;color:var(--ink-dim);font-size:.85em}
.frow{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:12px}
.seg{display:flex;border:3px solid var(--btn)}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:5px 8px;color:var(--btn)}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--on-btn)}
.seg button:focus-visible{outline:2px solid var(--head);outline-offset:-4px}
.rng{display:flex;align-items:center;gap:10px}.rng input{flex:1;accent-color:var(--btn)}.rng output{min-width:3.2em;text-align:right}
.cbox{display:flex;flex-direction:column;gap:8px}
.chead{display:flex;align-items:center;gap:10px}
.chead .cur{width:30px;height:30px;border:3px solid var(--btn);flex:none}
.cpick{margin-left:auto;cursor:pointer;color:var(--ink);font-size:.85em;display:flex;align-items:center;gap:6px;position:relative}
.cpick input{width:30px;height:26px;padding:0;border:2px solid var(--btn);background:var(--field);cursor:pointer}
.sw{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.sw button{all:unset;cursor:pointer;aspect-ratio:1;border:2px solid rgba(12,53,83,.35);box-sizing:border-box}
.sw button[aria-pressed=true]{border:3px solid var(--head);box-shadow:0 0 0 2px #fff inset}
.sw button:focus-visible{outline:2px solid var(--head);outline-offset:1px}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,110px));grid-template-areas:". up ." "left down right";gap:8px;justify-content:center}
.kcap{all:unset;cursor:pointer;box-sizing:border-box;height:clamp(48px,7.5vh,64px);border:3px solid var(--btn);border-bottom-width:6px;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.kcap b.long{font-size:.8em}
.kcap b{font-weight:400;font-size:1.15em;color:var(--btn);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcap small{font-size:.68em;color:var(--ink)}
.kcap.k-up{grid-area:up}.kcap.k-down{grid-area:down}.kcap.k-left{grid-area:left}.kcap.k-right{grid-area:right}
.kcap:hover{background:var(--field-hover)}.kcap:focus-visible{outline:2px solid var(--head);outline-offset:2px}
.kcap.wait{border-color:var(--head);background:var(--wait-bg);animation:kpulse 1s infinite}
.kcap.wait b{color:var(--head)}
.kcap.clash{border-color:#d07000}
@keyframes kpulse{50%{background:var(--wait-pulse)}}
.khint{margin:0;color:var(--ink);font-size:.85em;text-align:center}.khint.warn{color:#b05a00}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip2{all:unset;cursor:pointer;border:2px solid var(--btn);padding:3px 10px;font-size:.8em;color:var(--btn)}
.chip2[aria-pressed=true]{background:var(--btn);color:var(--on-btn)}.chip2:focus-visible{outline:2px solid var(--head);outline-offset:2px}
.dlgback{position:fixed;inset:0;background:var(--dim-back);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--sheet);border:3px solid var(--ink);width:min(560px,100%);max-height:100%;overflow:auto;padding:16px 28px 10px;box-sizing:border-box;font-size:clamp(15px,1.7vw,20px)}
.dlg h2{font-weight:400;color:var(--head);margin:6px 0 10px;padding-bottom:10px;border-bottom:3px solid var(--rule);font-size:1.15em}
.dlg p{color:var(--ink)}
.dlg.wide{width:min(1000px,100%)}
.cpk{display:grid;grid-template-columns:150px minmax(0,1fr) 230px;gap:20px;align-items:start}
.cpk .list{display:flex;flex-direction:column;gap:2px;max-height:62vh;overflow-y:auto}
.cpk .list button{all:unset;cursor:pointer;padding:4px 8px;color:var(--btn)}
.cpk .list button[aria-pressed=true]{background:var(--btn);color:var(--on-btn)}
.cpk .list button:focus-visible{outline:2px solid var(--head)}
.cpk .prev{width:100%;height:auto;display:block}
.cpk .clab{color:var(--ink);font-size:.8em;margin:8px 0 3px}
.cpk .sw{grid-template-columns:repeat(10,minmax(0,1fr))}
.cpk .st{color:var(--ink);font-size:.8em;margin-bottom:9px}
.cpk .st div{display:flex;justify-content:space-between}
.cpk .bar{height:10px;background:var(--rule);margin-top:3px}
.cpk .bar i{display:block;height:100%;background:var(--btn)}
@media (max-width:820px){ .cpk{grid-template-columns:1fr} .cpk .list{flex-direction:row;flex-wrap:wrap;max-height:none} }
table.stats{width:100%;border-collapse:collapse;color:var(--ink)}
table.stats th{font-weight:400;padding:4px 6px;border-bottom:3px solid var(--rule)}
table.stats td{padding:3px 6px}table.stats .n{text-align:right}
table.stats tr.tot td{border-top:3px solid var(--rule)}table.stats tr.gap td{padding-top:22px}
.dacts{display:flex;justify-content:space-around;border-top:3px solid var(--rule);margin-top:14px;padding-top:8px}

function parseTrk(buf){
  const dv=new DataView(buf); let p=0;
  const u8=()=>dv.getUint8(p++), u16=()=>{const v=dv.getUint16(p,true);p+=2;return v;}, i16=()=>{const v=dv.getInt16(p,true);p+=2;return v;}, u32=()=>{const v=dv.getUint32(p,true);p+=4;return v;};

  if(ver>0x104){ zoom=u8()/100; showStart=u8(); }
  const n=u32(), codes=new Uint8Array(CELLS*CELLS); let k=0;
  for(let i=0;i<n;i++){ const w=u16(), c=w&15, r=w>>4; for(let j=0;j<r&&k<codes.length;j++) codes[k++]=c; }

  const pits=[]; for(let i=0,c=u8();i<c;i++) pits.push([u16()*un,u16()*un,u16()/10000]);
  const cps=[]; for(let i=0,c=u8();i<c;i++) cps.push([u16()*un,u16()*un,u16()*un,u16()*un]);
  const lims=[]; if(ver>0x11f) for(let i=0,c=u8();i<c;i++) lims.push([u16()*un,u16()*un,u16()*un,u16()*un]); // limitadores de velocidade (0x43d390: só a partir da versão 0x120)
  const ai=[]; for(let i=0,c=(ver<0x102?u8():u16());i<c;i++) ai.push([u16()*un,u16()*un]);
  const pitAi=[]; try{ for(let i=0,c=u8();i<c;i++) pitAi.push([u16()*un,u16()*un]); }catch(e){}

async function gunzipB64(b64){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));

}

// Pinta a grade de "tonalidades" 512x512 do mesmo jeito que o jogo faz ao carregar (com espalhamento aleatório).
function paintTonality(raw,seed){
  const rnd=mulberry32(seed), R=k=>(rnd()*k)|0, t=new Uint8Array(CELLS*CELLS).fill(16), codes=raw.codes;
  const at=(x,y)=>clamp(y,0,511)*CELLS+clamp(x,0,511);
  for(let idx=0;idx<codes.length;idx++){
    const c=codes[idx], x=idx&511, y=idx>>9;
    switch(c){
      case 0: t[idx]=t[idx]<40?2:41; break;
      case 1: t[idx]=t[idx]<40?1:41; break;
      case 2: for(let r=0;r<3;r++){ const j=at(x+R(5)-2,y+R(5)-2); if(t[j]>=40) t[j]=42; else if(t[j]===16) t[j]=8+R(2.5); } break;
      case 4: t[idx]=t[idx]>=40?42:12+R(2); break;
      case 5: { const j=at(x+R(13)-6,y+R(13)-6), v=t[j];
        if(v===0) t[j]=40; else if(v<8) t[j]=41; else if(v<16) t[j]=42; else if(v<20) t[j]=43; else if(v<24) t[j]=44; else if(v<28){} else if(v<32) t[j]=45; else if(v<36) t[j]=46; else if(v<40) t[j]=47; break; }
      case 6: { const j=at(x+R(7)-3,y+R(7)-3); if((t[j]&0xfc)!==24) t[j]=20+R(2.5); t[idx]=t[idx]>=40?44:20+R(2.5); break; }
      case 7: t[idx]=24+R(2); break;
      case 8: t[idx]=26+R(2); break;
      case 9: t[idx]=t[idx]<40?28:45; break;
      case 10: t[idx]=t[idx]<40?32:46; break;
      case 11: t[idx]=t[idx]<40?36:47; break;
      case 12: t[idx]=t[idx]<40?0:40; break;
    }
  }
  if((raw.showStart||raw.ver<=0x104) && raw.cps.length){ // linha de chegada branca sobre o asfalto
    const [x1,y1,x2,y2]=raw.cps[raw.cps.length-1], s=CELLS/raw.W, L=Math.hypot(x2-x1,y2-y1)*s;
    for(let i=0;i<=L*2;i++){ const f=i/(L*2), cx=(x1+(x2-x1)*f)*s, cy=(y1+(y2-y1)*f)*s, nx=-(y2-y1)/(L/s||1)*.5, ny=(x2-x1)/(L/s||1)*.5;
      for(const o of [-.5,.5]){ const j=at((cx+nx*o)|0,(cy+ny*o)|0); if(t[j]<8) t[j]=28; } }
  }
  return t;
}

function catmullClosed(P,spacing){
  const n=P.length, dense=[];
  for(let i=0;i<n;i++){ const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    for(let k=0;k<12;k++){ const t=k/12,t2=t*t,t3=t2*t;
      dense.push([.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                  .5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]); } }
  const m=dense.length, cum=new Float64Array(m+1);
  for(let i=0;i<m;i++){ const a=dense[i],b=dense[(i+1)%m]; cum[i+1]=cum[i]+Math.hypot(b[0]-a[0],b[1]-a[1]); }
  const L=cum[m], N=Math.max(30,Math.round(L/spacing)), ds=L/N, x=new Float32Array(N), y=new Float32Array(N);
  let seg=0; for(let j=0;j<N;j++){ const tg=j*ds; while(seg<m-1&&cum[seg+1]<tg) seg++; const a=dense[seg],b=dense[(seg+1)%m],t=(tg-cum[seg])/((cum[seg+1]-cum[seg])||1); x[j]=a[0]+(b[0]-a[0])*t; y[j]=a[1]+(b[1]-a[1])*t; }
  return {x,y,N,ds,L};
}

// ====================================================================== IA (função 0x40b890 do original)
// Segue os pontos da linha da IA (um a cada ~5 m) com um desvio lateral sorteado, olha à frente

class AI{
  constructor(car,skill,T){

}

// ====================================================================== box: a equipe troca os pneus (2,5 s), abastece 128 por passo e conserta 6600 a cada 0,5 s
function pitService(R){
  const T=R.T; if(!T.hasPits||!T.rules) return;

    const b=T.pitBoxes[c.boxI], d=Math.hypot(b.x-c.x,b.y-c.y), spd=Math.hypot(c.vx,c.vy);

    const p=c.pit; if(p.done) continue; p.t++;
    if(p.fuel){ c.fuel=Math.min(FULL,c.fuel+128); if(c.fuel>=FULL) p.fuel=false; }
    if(p.tyre&&p.t>=251){ c.tyre=FULL; p.tyre=false; }
    if(p.rep&&p.t%50===0){ c.dmg=Math.max(0,Math.floor((c.dmg-1)/6600)*6600); if(!c.dmg) p.rep=false; }

// ====================================================================== colisões por impulso

            else contact(R,car,1,ex,ey,o.z,0,0,1,o.r,o.co); } }

          for(const p of sides){ const qx=o.x+px*p, qy=o.y+py*p; if(al>-o.L&&al<o.L) contact(R,car,1,qx,qy,zt,o.fx,o.fy,0,o.r,o.co);
            for(const sg of [-1,1]) contact(R,car,2,qx+o.fx*o.L*sg,qy+o.fy*o.L*sg,zt,0,0,0,o.r,o.co); } } }
      else if(o.k==='r'){ // guarda-corpos: só para quem está sobre o tabuleiro (quem passa por baixo não os alcança)
        if(car.deck==null) continue; const al=dx*o.fx+dy*o.fy, px=-o.fy, py=o.fx; if(al<=-o.L||al>=o.L) continue;
        for(const sg of [-1,1]) contact(R,car,0,o.x+px*o.W*sg,o.y+py*o.W*sg,car.cz,px,py,0,o.H,o.co); }
      else if(o.k==='p'){ // cápsula (barco): linha ao longo da direção entre a0 e a1, e esferas nas pontas
        const al=dx*o.fx+dy*o.fy; if(al>o.a0&&al<o.a1) contact(R,car,1,o.x,o.y,o.z,o.fx,o.fy,0,o.r,o.co);
        for(const a of [o.a0,o.a1]) contact(R,car,2,o.x+o.fx*a,o.y+o.fy*a,o.z,0,0,0,o.r,o.co); }
      else { // bloco: duas faces (cada uma dentro da outra metade) + quinas verticais de raio 0
        const px=-o.fy, py=o.fx, a=dx*px+dy*py, b=dx*o.fx+dy*o.fy;
        if(b>-o.B&&b<o.B) contact(R,car,0,o.x,o.y,o.z,px,py,0,o.A,o.co);
        if(a>-o.A&&a<o.A) contact(R,car,0,o.x,o.y,o.z,o.fx,o.fy,0,o.B,o.co);
        for(const sa of [-1,1]) for(const sb of [-1,1]) contact(R,car,1,o.x+px*o.A*sa+o.fx*o.B*sb,o.y+py*o.A*sa+o.fy*o.B*sb,o.z,0,0,1,0,o.co); }
    }
  }
  for(const car of cs) coneHits(R,car); // (no original, dentro de 0x420560 de cada carro; aqui logo depois dos objetos fixos)
  for(let a=0;a<cs.length;a++) for(let b=a+1;b<cs.length;b++) carHit(R,cs[a],cs[b]);

}
// Cone móvel (tipo 36). Contra o carro (0x420560, caso 36): cilindro macio de raio 0,7 (abaixo de 1,7 m; 1 / 0,1 / 0,01) e
// duas esferas (raio 0,8 a 0,4 m e raio 0,5 a 1 m de altura); o cone recebe −J/(massa·100) dessas esferas, com massa 0,001
// (+0x20), isto é, 10× a reação, e fica marcado como "mexeu" (+0x1d). O movimento depois do toque (0x42f640, corpo 3D com
// bordas em 0x43ae60) está aproximado: desliza com 8 m/s² de atrito e quica nas bordas do tabuleiro.
const CONE_CO=[1,.1,.01];
function coneHits(R,car){
  const T=R.T, S2=car.spec.ax[2];
  for(const m of R.movers||[]){ const dx=car.x-m.x, dy=car.y-m.y; if(dx*dx+dy*dy>=(S2+2.8)*(S2+2.8)) continue;
    const z=T.heightAt(m.x,m.y)+.15;
    if(car.cz-z<1.7) contact(R,car,1,m.x,m.y,z,0,0,1,.7,CONE_CO);
    for(const [h,r] of [[.4,.8],[1,.5]]){ const d=contact(R,car,2,m.x,m.y,z+h,0,0,0,r,CONE_CO); if(d){ m.vx-=10*d[0]; m.vy-=10*d[1]; m.moved=true; } } }
}
function moveCones(R){
  const W=R.T.W;
  for(const m of R.movers||[]){ if(!m.moved) continue; const v=Math.hypot(m.vx,m.vy); if(v<1e-3){ m.vx=m.vy=0; continue; }
    const k=Math.max(0,v-8*DT)/v; m.vx*=k; m.vy*=k; m.x+=m.vx*DT; m.y+=m.vy*DT; m.spin=(m.spin||0)+v*DT*2;
    if(m.x<.5){ m.x=.5; m.vx=Math.abs(m.vx)*.5; } if(m.x>W-.5){ m.x=W-.5; m.vx=-Math.abs(m.vx)*.5; }
    if(m.y<.5){ m.y=.5; m.vy=Math.abs(m.vy)*.5; } if(m.y>W-.5){ m.y=W-.5; m.vy=-Math.abs(m.vy)*.5; } }
}
// carro × carro (0x41f3c0): cada carro é um elipsoide de semi-eixos ax=[lado, altura, comprimento]
// (+0x10/+0x14/+0x18 da ficha), aqui reduzido ao plano (o original tira 80% da alavanca vertical; no plano ela é zero)
function carHit(R,A,B){
  const sA=A.spec, sB=B.spec, dx=B.x-A.x, dy=B.y-A.y, rr=sA.ax[2]+sB.ax[2];
  if(dx*dx+dy*dy>=rr*rr) return; // esferas de raio +0x18
  const fax=Math.cos(A.a), fay=Math.sin(A.a), lax=-fay, lay=fax, fbx=Math.cos(B.a), fby=Math.sin(B.a), lbx=-fby, lby=fbx;
  // normal: a distância medida na métrica de cada elipsoide (dividida pelos semi-eixos), somada e normalizada
  const dfa=(dx*fax+dy*fay)/sA.ax[2], dla=(dx*lax+dy*lay)/sA.ax[0], dfb=(dx*fbx+dy*fby)/sB.ax[2], dlb=(dx*lbx+dy*lby)/sB.ax[0];
  let nx=fax*dfa+lax*dla+fbx*dfb+lbx*dlb, ny=fay*dfa+lay*dla+fby*dfb+lby*dlb; const nl=Math.hypot(nx,ny)+.001; nx/=nl; ny/=nl;
  // ponto de suporte de cada elipsoide na direção do outro (deslocamento a partir do centro)
  const sup=(s,fx,fy,lx,ly,sg)=>{ const u=(nx*fx+ny*fy)*s.ax[2]*sg, v=(nx*lx+ny*ly)*s.ax[0]*sg, l=Math.hypot(u,v)||1; return [(fx*u*s.ax[2]+lx*v*s.ax[0])/l,(fy*u*s.ax[2]+ly*v*s.ax[0])/l]; };
  const [oax,oay]=sup(sA,fax,fay,lax,lay,1), [obx,oby]=sup(sB,fbx,fby,lbx,lby,-1);
  const gap=(dx+obx-oax)*nx+(dy+oby-oay)*ny; if(gap>=0) return; // se tocam
  const rvx=B.vx-B.w*oby-(A.vx-A.w*oay), rvy=B.vy+B.w*obx-(A.vy+A.w*oax), vn=rvx*nx+rvy*ny; if(vn>=0) return; // e se aproximam
  // separa na proporção das massas (+0xc8: ficha + combustível)
  const O=R.T.rules||NO_RULES, mA=sA.mass+A.fuel/FULL*O.fuelKg, mB=sB.mass+B.fuel/FULL*O.fuelKg, f=mA/(mA+mB);
  A.x+=(1-f)*gap*nx; A.y+=(1-f)*gap*ny; B.x-=f*gap*nx; B.y-=f*gap*ny;
  // impulso: atrito que anula o deslize relativo, limitado a √(1,5·|vn|) (0x41ff52), mais normal 1,5·|vn| + 5 m/s
  let jx=vn*nx-rvx, jy=vn*ny-rvy; const jl=Math.hypot(jx,jy)+.001, jm=Math.sqrt(-1.5*vn); if(jm<jl){ jx*=jm/jl; jy*=jm/jl; }
  const jn=-1.5*vn+5; jx+=jn*nx; jy+=jn*ny;
  // cada carro leva sua parte (1−f ou f), dividida por 1 + k·|r⊥n|², com k = 1200/(m+200) (+0xc4) a inércia do carro
  const kA=1200/(mA+200), kB=1200/(mB+200), xa=oax*ny-oay*nx, xb=obx*ny-oby*nx, wA=(1-f)/(xa*xa*kA+1), wB=f/(xb*xb*kB+1);
  A.vx-=jx*wA; A.vy-=jy*wA; A.w-=kA*wA*(oax*jy-oay*jx);
  B.vx+=jx*wB; B.vy+=jy*wB; B.w+=kB*wB*(obx*jy-oby*jx);
  // energia de cada um = (variação de velocidade)²: acima de 50 faísca no ponto de contato, som e dano (sem DMGK)
  const J2=jx*jx+jy*jy;
  for(const [c,w,ox,oy,m] of [[A,wA,oax,oay,mA],[B,wB,obx,oby,mB]]){ const E=J2*w*w; if(E<=50) continue;
    c.hit(E,O,m); if(!R.headless) Gfx.sparks(c.x+ox,c.y+oy,Math.sqrt(E)); }
}

// ====================================================================== som
// Como no original: um mixer próprio de 16 canais (0x46f080) soma as amostras de cada canal × volume/128 e passa
// a soma por uma saturação suave y = x/(1+|x|) (em unidades do fundo de escala), sem compressor nem ganho mestre.
// Volume de cada som em milibels, como no DirectSound: mB = −10000 + 1000·log10(1 + opção·a), com a opção de 0 a 100
// e `a` a intensidade (1e8 para os sons fixos); fator = round(128/10^(−mB/2000))/128 (0x48fb00), ou seja ≈ √(opção/100).
// Três opções separadas, como no original: motor, chiado e efeitos (batida e ding), todas 80 por padrão.
// - Motor (0x407cd0, 0x407520): um canal por carro, sem atenuação por distância; taxa = (|roda|×4+50)/vel_máx × 10000/22050
//   (metade debaixo d'água); E = 1000·log10(1+1e8·opção) (0x43bbe0); acelerando mB = E−10000, solto mB = 0,93·E−10000.
// - Chiado (0x406592): um canal em laço para a corrida; `a` = soma do escorregamento no quadro, até 1e8.
// - Batida (0x406643): a energia acumula entre quadros e, quando passa de 1, toca damage.wav desde o início (num canal
//   livre; todas as cópias tocando usam o volume da última) e zera.
// - Ding (0x416bc0, 0x40dbe0): contagem com taxa 1,0884 e largada/última volta com 1,4512.
// Os sons são sintetizados aqui com o nível e o timbre medidos nos .wav do original (os arquivos não vão para o repositório).
const ENG_H=[0,-8.3,-9.5,-13.3,-14.6,-19.7,-19.4,-20.8,-25.8,-24.9,-28.3,-25.7,-31.7,-33,-37.2]; // harmônicos do motor original (dB)
const SND_CH=16; // canais do mixer original
const sndGain=mB=>Math.floor(128/Math.pow(10,mB/-2000)+.5)/128;                                // 0x48fb00
const sndLevel=(opt,a)=>-10000-Math.trunc(-1000*Math.log10(1+opt*Math.min(a,1e8)));             // 0x43bbe0, 0x406592
const Sound={
  ctx:null, out:null, eng:[], skid:null, dmAcc:0, dmG:null, nDmg:0,
  init(){ if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{ const ctx=this.ctx=new (window.AudioContext||window.webkitAudioContext)(), sr=ctx.sampleRate;
      // saturação do mixer (0x46f080): y = 1 − 1/(1+x) para x ≥ 0, simétrica; a entrada é reduzida 16× para caber na curva
      const K=SND_CH, N=32769, cv=new Float32Array(N); for(let i=0;i<N;i++){ const u=K*(2*i/(N-1)-1); cv[i]=u/(1+Math.abs(u)); }
      const ws=ctx.createWaveShaper(); ws.curve=cv; ws.connect(ctx.destination);
      this.out=ctx.createGain(); this.out.gain.value=1/K; this.out.connect(ws);
      const mk=(sec,fn)=>{ const n=Math.floor(sec*sr), b=ctx.createBuffer(1,n,sr), d=b.getChannelData(0); fn(d,n); return b; };
      const envAt=(env,t)=>{ const k=t/.05, i=Math.min(env.length-2,Math.floor(k)), f=Math.min(1,k-i); return Math.pow(10,(env[i]+(env[i+1]-env[i])*f)/20); };
      // motor: harmônicos medidos no engine.wav, com o mesmo nível dele (RMS −16,9 dBFS)
      const re=new Float32Array(ENG_H.length+1), im=new Float32Array(ENG_H.length+1); let r=12345, p2=0;
      ENG_H.forEach(db=>{ const a=Math.pow(10,db/20); p2+=a*a/2; });
      const a0=Math.pow(10,-16.9/20)/Math.sqrt(p2);
      ENG_H.forEach((db,i)=>{ const a=a0*Math.pow(10,db/20), ph=((r=(r*16807)%2147483647)/2147483647)*Math.PI*2; re[i+1]=a*Math.cos(ph); im[i+1]=a*Math.sin(ph); });
      this.engWave=ctx.createPeriodicWave(re,im,{disableNormalization:true});
      // chiado: assobio em torno de 1,3 kHz que oscila devagar, como o skid.wav (RMS −10,9 dBFS)
      this.skidBuf=mk(2,(d,n)=>{ let ph=0, lp=0; for(let i=0;i<n;i++){ const t=i/sr, f=1320+38*Math.sin(2*Math.PI*1.5*t)+22*Math.sin(2*Math.PI*3*t+1); ph+=2*Math.PI*f/sr;
        lp+=(Math.random()*2-1-lp)*.3; d[i]=.40*Math.sin(ph)+.044*Math.sin(2*ph+.5)+.055*lp; } });
      // batida: ruído entre ~190 e 460 Hz, 0,16 s, envelope do damage.wav (−8, −12, −16, −23 dB a cada 50 ms)
      this.dmgBuf=mk(.2,(d,n)=>{ const w0=2*Math.PI*300/sr, al=Math.sin(w0)/(2*.8), b0=al, a1=-2*Math.cos(w0), a2=1-al, a0b=1+al; let x1=0,x2=0,y1=0,y2=0, s=0;
        for(let i=0;i<n;i++){ const x=Math.random()*2-1, y=(b0*x-b0*x2-a1*y1-a2*y2)/a0b; x2=x1; x1=x; y2=y1; y1=y; d[i]=y; if(i<.05*sr) s+=y*y; }
        const g=1/Math.sqrt(s/(.05*sr)); for(let i=0;i<n;i++) d[i]*=g*envAt([-6,-10,-14,-20,-40],i/sr); });
      // ding: seno de 583 Hz com um toque inicial mais agudo e o decaimento do ding.wav (−6 … −60 dB em 0,7 s)
      const DE=[-6,-5,-7,-9,-10,-11,-14,-16,-19,-21,-25,-30,-36,-48,-60,-90];
      this.dingBuf=mk(.75,(d,n)=>{ for(let i=0;i<n;i++){ const t=i/sr; d[i]=Math.SQRT2*envAt(DE,t)*(Math.sin(2*Math.PI*583*t)+.5*Math.exp(-t/.02)*Math.sin(2*Math.PI*1610*t)); } });
      this.dmG=ctx.createGain(); this.dmG.connect(this.out);
    }catch(e){ this.ctx=null; } },
  setVol(){},
  opt(k){ return clamp(Opts[k]??80,0,100); },
  fxGain(){ return sndGain(sndLevel(this.opt('volFx'),1e8)); },
  voice(buf){ const ctx=this.ctx, g=ctx.createGain(); g.gain.value=0; let src;
    if(buf){ src=ctx.createBufferSource(); src.buffer=buf; src.loop=true; } else { src=ctx.createOscillator(); src.setPeriodicWave(this.engWave); }
    src.connect(g); g.connect(this.out); src.start(); return {src,g,buf:!!buf}; },
  update(R,active){
    if(!this.ctx) return; const t=this.ctx.currentTime, cars=active&&R&&R.phase!=='wait'?R.cars:[];
    while(this.eng.length<cars.length) this.eng.push(this.voice(null));
    const E=1000*Math.log10(1+1e8*this.opt('volEng'));                                              // 0x43bbe0
    this.eng.forEach((e,i)=>{ const c=cars[i];
      if(!c){ e.g.gain.setTargetAtTime(0,t,.03); return; }
      const under=c.wet&&c.wet>=c.wheels.length, rate=Math.floor((Math.abs(c.ws)*4+50)/c.spec.vmax*10000)/22050*(under?.5:1);
      if(e.buf) e.src.playbackRate.setTargetAtTime(rate,t,.02); else e.src.frequency.setTargetAtTime(104.5*rate,t,.02);
      e.g.gain.setTargetAtTime(sndGain((c.thr?Math.trunc(E):Math.trunc(E*.93))-10000),t,.03); });   // 0x407cd0
    // chiado e batidas: soma desde o último quadro, normalizada para 2 passos de física por quadro
    const dt=Math.max(.01,t-(this.lt||t)); this.lt=t; let sk=0, dm=0;
    for(const c of cars){ sk+=c.skAcc||0; dm+=c.dmgSnd||0; }
    if(R) for(const c of R.cars){ c.skAcc=0; c.dmgSnd=0; }
    if(!this.skid&&cars.length) this.skid=this.voice(this.skidBuf);
    if(this.skid) this.skid.g.gain.setTargetAtTime(cars.length?sndGain(sndLevel(this.opt('volSkid'),sk*.02/dt)):0,t,.02);
    if(!cars.length){ this.dmAcc=0; return; }
    this.dmAcc+=dm*.02/dt; if(this.dmAcc>1&&t-(this.lastDmg||0)>=.02){ this.lastDmg=t; this.crash(sndGain(sndLevel(this.opt('volFx'),this.dmAcc))); this.dmAcc=0; } },
  // uma cópia nova do damage.wav por batida, enquanto houver canal livre; todas usam o volume da última
  crash(v){ if(!this.ctx||v<=0||this.eng.length+1+this.nDmg>=SND_CH) return; const ctx=this.ctx, src=ctx.createBufferSource();
    src.buffer=this.dmgBuf; this.dmG.gain.setValueAtTime(v,ctx.currentTime); src.connect(this.dmG);
    this.nDmg++; src.onended=()=>{ this.nDmg--; src.disconnect(); }; src.start(); },
  bump(v){ this.crash(v); },
  play(buf,rate=1){ if(!this.ctx||!buf) return; const ctx=this.ctx, s=ctx.createBufferSource(), g=ctx.createGain();
    s.buffer=buf; s.playbackRate.value=rate; g.gain.value=this.fxGain(); s.connect(g); g.connect(this.out); s.onended=()=>g.disconnect(); s.start(); },
  ding(hi){ this.play(this.dingBuf,hi?1.45125:1.08844); },                     // 0x416bc0: 0x3fb9c278, 0x3f8b51da
  beep(f){ this.ding(f>=800); },
};

// ====================================================================== modelos dos carros (próprios, low-poly)
const CarKit=(()=>{
  const PI=Math.PI, mats=new Map();
  const get=(k,f)=>{ if(!mats.has(k)) mats.set(k,f()); return mats.get(k); };
  // visual low-poly no estilo do jogo original: faces planas, sem brilho
  const M=c=>get('f'+c,()=>new THREE.MeshPhongMaterial({color:c,shininess:0,specular:0,flatShading:true}));
  const GLASS=0xa9c3df, DARK=0x2a2a2a, TYRE=0x333333;

  // perfil lateral [[z,y],...] extrudado na largura w, centrado em x=0
  function prof(pts,w){
    const s=new THREE.Shape(); pts.forEach(([z,y],i)=>i?s.lineTo(z,y):s.moveTo(z,y));
    const g=new THREE.ExtrudeGeometry(s,{depth:w,bevelEnabled:false,curveSegments:4});
    g.rotateY(-PI/2); g.translate(w/2,0,0); return g;
  }
  const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
  // estreita a peça no eixo x: no topo (top) e na frente (nose); rear<1 estreita a traseira
  function taper(g,pts,top,nose,rear){
    const ys=pts.map(p=>p[1]), zs=pts.map(p=>p[0]), y0=Math.min(...ys), y1=Math.max(...ys), z0=Math.min(...zs), z1=Math.max(...zs);
    const p=g.attributes.position;
    for(let i=0;i<p.count;i++){ const t=(p.getZ(i)-z0)/(z1-z0||1); p.setX(i,p.getX(i)*lerp(1,top,(p.getY(i)-y0)/(y1-y0||1))*lerp(rear,nose,t)); }
    p.needsUpdate=true; g.computeVertexNormals(); return g;
  }

  function Builder(){
    const parts=[], root=new THREE.Group(), fronts=[], wheels=[];
    const B={root,fronts,wheels,
      add(geo,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); m.updateMatrix(); parts.push(m); return m; },
      box(w,h,d,mat,x,y,z,rx,ry,rz){ return B.add(new THREE.BoxGeometry(w,h,d),mat,x,y,z,rx,ry,rz); },
      piece(pts,w,mat,x=0,top=1,nose=1,rear=1){ return B.add(taper(prof(pts,w),pts,top,nose,rear),mat,x,0,0); },
      pyr(r,h,mat,x,y,z){ return B.add(new THREE.ConeGeometry(r,h,4),mat,x,y,z,0,PI/4,0); },
      helmet(x,y,z,col,s=1){ B.add(new THREE.SphereGeometry(.28*s,8,6),M(col),x,y,z); },
      wheel(x,z,r,steer){ // roda = esfera achatada, como no original
        const hub=new THREE.Group(); hub.position.set(x,r,z); const g=new THREE.SphereGeometry(r,10,8); g.scale(.7,1,1);
        const mesh=new THREE.Mesh(g,M(TYRE)); mesh.castShadow=true; const spin=new THREE.Group(); spin.add(mesh); hub.add(spin); root.add(hub);
        wheels.push({spin,r}); if(steer) fronts.push(hub); return hub;
      },
      done(){ // junta as peças por material: poucos draw calls por carro
        const byMat=new Map(); for(const m of parts){ const g=m.geometry.clone(); g.applyMatrix4(m.matrix); if(!byMat.has(m.material)) byMat.set(m.material,[]); byMat.get(m.material).push(g); }
        const list=[...byMat.entries()], merged=mergeGeos(list.flatMap(([mat,gs],mi)=>gs.map(g=>({g,mi}))));
        const mesh=new THREE.Mesh(merged,list.map(e=>e[0])); mesh.castShadow=true; mesh.receiveShadow=false; root.add(mesh);
        parts.forEach(p=>p.geometry.dispose()); return B; },
    };
    return B;
  }
  function mergeGeos(items){
    const pos=[],nor=[],groups=[]; let cur=-1,start=0,n=0;
    items.sort((a,b)=>a.mi-b.mi);
    for(const {g,mi} of items){ const gg=g.index?g.toNonIndexed():g; gg.computeVertexNormals();
      if(mi!==cur){ if(cur>=0) groups.push([start,n-start,cur]); cur=mi; start=n; }
      pos.push(...gg.attributes.position.array); nor.push(...gg.attributes.normal.array); n+=gg.attributes.position.count; }
    if(cur>=0) groups.push([start,n-start,cur]);
    const out=new THREE.BufferGeometry(); out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
    groups.forEach(([s,c,m])=>out.addGroup(s,c,m)); return out;
  }

  // ---------------------------------------------------------------- um modelo por carro (referência: gene-rally.fandom.com/wiki/Cars)
  function build(spec,col1,col2){
    const B=Builder(), c1=new THREE.Color(col1).getHex(), c2=new THREE.Color(col2).getHex(), P1=M(c1), P2=M(c2), G=M(GLASS), D=M(DARK), n=spec.name;
    const W=i=>spec.wheels[i], R=(i,d)=>spec.wr[i]||d;
    const four=(d,out=0)=>{ for(let i=0;i<4;i++){ const w=W(i); B.wheel(w[0]+Math.sign(w[0])*out,w[2],R(i,d),w[2]>0); } };
    const open=()=>{ // cunha do General/Formula
      four(.5);
      B.piece([[-1.5,.35],[2.0,.35],[2.0,.45],[0,.95],[-1.2,1.05],[-1.5,.95]],1.3,P1,0,.6,.5);
      B.box(.5,.05,.7,D,0,1.02,-.45,.1); B.helmet(0,1.2,-.6,c2);
    };
    if(n==='General') open();
    else if(n==='Formula'){
      open();
      B.box(2.1,.05,.55,P2,0,.45,1.85,.25);
      B.box(1.9,.05,.7,P2,0,1.35,-1.6,-.25); for(const s of [-1,1]) B.box(.06,.4,.06,D,s*.4,1.15,-1.5);
    }
    else if(n==='Go-Kart'){
      four(.4);
      B.piece([[-1.2,.25],[1.5,.25],[1.5,.35],[.4,.7],[-.4,.95],[-1.2,.8]],1.3,P1,0,.5,.55);
      B.piece([[-.8,.7],[-.1,.7],[-.3,1.1],[-.7,1.1]],.55,D,0,.7);
      B.helmet(0,1.32,-.45,c2,1.1);
    }
    else if(n==='McTurbo'){ // dragster: rodas da frente pequenas, traseiras grandes, asa alta
      for(let i=0;i<4;i++){ const w=W(i); B.wheel(w[0],w[2],R(i,.4),w[2]>0); }
      B.piece([[-1.6,.3],[2.1,.3],[2.1,.38],[-.3,.85],[-1.6,.95]],.95,P1,0,.6,.35);
      B.helmet(0,1.15,-.75,c2);
      B.box(1.3,.05,.6,P2,0,1.55,-1.55,-.3); for(const s of [-1,1]) B.box(.05,.6,.05,D,s*.35,1.25,-1.45);
    }
    else if(n==='Mini'){
      four(.35);
      B.piece([[-1.3,.22],[1.28,.22],[1.33,.55],[1.2,.75],[-1.3,.8],[-1.33,.5]],1.5,P1,0,.95);
      B.piece([[.7,.78],[.35,1.25],[-1.0,1.25],[-1.2,.78]],1.4,G,0,.85);
      B.box(1.22,.06,1.38,P2,0,1.28,-.32);
    }
    else if(n==='Rallycar'){
      four(.5);
      B.piece([[-1.7,.4],[1.7,.4],[1.75,.65],[1.6,.9],[.7,1.0],[-1.7,1.05],[-1.75,.7]],1.8,P1,0,.9);
      B.piece([[.7,.98],[.2,1.5],[-1.3,1.5],[-1.6,1.0]],1.6,G,0,.85);
      B.box(1.38,.06,1.5,P1,0,1.53,-.55);
      B.box(1.45,.05,.95,P2,0,.97,1.15,.1);
    }
    else if(n==='Yankee'){
      four(.35);
      B.piece([[-1.75,.25],[2.05,.25],[2.1,.45],[1.9,.65],[.4,.8],[-1.75,.85],[-1.8,.55]],1.8,P1,0,.9,.8);
      B.piece([[.45,.78],[-.1,1.25],[-.7,1.25],[-1.75,.85]],1.55,G,0,.8);
      B.box(1.45,.05,1.4,P2,0,.75,1.15,.1);
    }
    else if(n==='Truck'){ // cabine avançada e carroceria baixa
      four(.5);
      B.box(1.9,.3,4.2,D,0,.65,-.2);
      B.piece([[.8,.6],[2.1,.6],[2.1,1.3],[1.9,2.1],[.8,2.15]],2.4,P1,0,.85);
      B.piece([[1.5,1.35],[2.13,1.35],[1.95,2.0],[1.5,2.0]],2.2,G,0,.88);
      B.box(2.05,.08,1.35,P2,0,2.17,1.45);
      B.box(2.4,.35,3.2,P1,0,.95,-.9);
    }
    else if(n==='MonsterTruck'){
      four(.6,.15);
      B.box(1.2,.3,2.4,D,0,.85,0);
      B.piece([[-1.6,1.0],[1.6,1.0],[1.65,1.3],[1.5,1.55],[-1.6,1.6]],1.8,P1,0,.95);
      B.box(1.6,.03,1.0,D,0,1.61,-1.0);
      B.piece([[.5,1.55],[.2,2.1],[-.55,2.1],[-.65,1.55]],1.6,G,0,.85);
      B.box(1.4,.07,.8,P2,0,2.12,-.18);
    }
    else if(n==='Triangle'){ // duas rodas na frente, uma atrás
      B.wheel(W(0)[0],W(0)[2],R(0,.4),true); B.wheel(W(1)[0],W(1)[2],R(1,.4),true); B.wheel(0,W(2)[2],R(2,.4),false);
      B.piece([[-1.4,.3],[1.8,.3],[1.8,.4],[-1.4,.75]],2.0,P1,0,.8,1,.2);
      B.pyr(.75,.7,P2,0,1.0,-.1); B.piece([[.15,.6],[.9,.55],[.2,1.05]],.7,G,0,.4);
    }
    else if(n==='Sidamob'){ // sidecar coberto por uma carenagem só (rodas escondidas)
      B.piece([[-1.4,.15],[1.9,.15],[1.9,.25],[.3,.6],[-1.4,.55]],2.4,P1,.1,.55,.5);
      B.piece([[-1.2,.5],[1.0,.5],[.2,.95],[-.9,.95]],.75,P1,-.3,.6);
      B.helmet(-.3,1.15,-.25,c2);
    }
    else if(n==='Onewheeler'){ // uma roda sob uma pirâmide
      const r=R(1,.4)+.1; B.wheel(0,0,r,false);
      B.pyr(1.7,1.4,P1,0,1.6*r+.7,0);
      B.helmet(0,1.6*r+1.1,.25,c2,.7);
    }
    B.done();
    B.root.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
    return B;
  }

  // ---------------------------------------------------------------- ícones (render 3D em canvas)
  let ren=null, scene, cam, cache=new Map();
  function icon(cv,spec,c1,c2,view){

    x.clearRect(0,0,cv.width,cv.height);

      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const p of pts){ x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); }
      const asp=cv.width/cv.height, cx=(x0+x1)/2, cy=(y0+y1)/2; let hw=(x1-x0)/2*1.08, hh=(y1-y0)/2*1.08; if(hw/hh>asp) hh=hw/asp; else hw=hh*asp;
      cam.left=cx-hw; cam.right=cx+hw; cam.top=cy+hh; cam.bottom=cy-hh; cam.updateProjectionMatrix();

      const off=document.createElement('canvas'); off.width=cv.width; off.height=cv.height; off.getContext('2d').drawImage(ren.domElement,0,0);
      cache.set(key,off); x.drawImage(off,0,0);

  }

})();

// ícone do carro (render 3D próprio, usado nos menus e na barra)
function drawCarIcon(cv,spec,c1,c2){ CarKit.icon(cv,spec,c1,c2); }

// ====================================================================== entrada
const keys=new Set(), touchK={up:0,down:0,left:0,right:0};
// uma ação pode estar ligada a uma tecla ("KeyW") ou a um controle ("Pad0:B7" botão, "Pad0:A0+" eixo)
const PADRE=/^Pad(\d+):(B|A)(\d+)([+-]?)$/;
function pads(){ try{ return navigator.getGamepads?navigator.getGamepads():[]; }catch(e){ return []; } }
function bindVal(code,gp){
  if(!code) return 0; const m=PADRE.exec(code); if(!m) return keys.has(code)?1:0;
  const p=gp[+m[1]]; if(!p) return 0;
  if(m[2]==='B'){ const b=p.buttons[+m[3]]; return b?(b.pressed?Math.max(b.value,.999):b.value>.15?b.value:0):0; }
  const v=(p.axes[+m[3]]||0)*(m[4]==='-'?-1:1); return v>.2?Math.min(1,(v-.2)/.7):0;
}
function humanInput(car,first){
  const k=car.drv.keys||{}, gp=pads(), val=n=>bindVal(k[n],gp);
  let up=val('up'),down=val('down'),left=val('left'),right=val('right');
  if(first){ up=Math.max(up,touchK.up); down=Math.max(down,touchK.down); left=Math.max(left,touchK.left); right=Math.max(right,touchK.right); }
  const inp={throttle:up,brake:down,steer:right-left};
  let lc=Math.round(100*inp.throttle-100*inp.brake); if(Math.abs(lc)<=10) lc=1; inp.c=lc;
  return inp;
}
const KEYNAME=c=>!c?'–':PADRE.test(c)?(m=>'🎮'+(+m[1]+1)+' '+(m[2]==='B'?'Botão '+m[3]:(m[3]==='0'?'X':m[3]==='1'?'Y':'Eixo '+m[3])+(m[4]==='-'?'−':'+')))(PADRE.exec(c)):c.startsWith('Numpad')?'Num '+c.slice(6):c.startsWith('Key')?c.slice(3):c.startsWith('Digit')?c.slice(5):({ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Semicolon:';',Comma:',',Period:'.',Slash:'/',Space:'Espaço',ShiftLeft:'Shift esq.',ShiftRight:'Shift dir.',ControlLeft:'Ctrl esq.',ControlRight:'Ctrl dir.',Enter:'Enter',Backslash:'\\',BracketLeft:'[',BracketRight:']',Quote:"'",Minus:'-',Equal:'='}[c]||c);

// ====================================================================== corrida
const Game={ mode:'menu', R:null, season:null, entry:null };
function raceLaps(T){ if(Opts.lenMode==='laps') return Opts.laps; if(Opts.lenMode==='km') return Math.max(1,Math.round(Opts.km*1000/T.lapLen)); return 255; }
function lenText(){ return Opts.lenMode==='laps'?Opts.laps+(Opts.laps===1?' volta':' voltas'):Opts.lenMode==='km'?Opts.km+(Opts.km===1?' quilômetro':' quilômetros'):Opts.mins+(Opts.mins===1?' minuto':' minutos'); }

function newRace(T,entrants,headless){
  // ordem de largada
  let order=entrants.slice();
  const pts=Game.season?Game.season.points:{};
  if(Opts.order==='rand'||!Game.season||Game.season.idx===0){ for(let i=order.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [order[i],order[j]]=[order[j],order[i]]; } }
  else { order.sort((a,b)=>(pts[b.drv.name]||0)-(pts[a.drv.name]||0)); if(Opts.order==='rev') order.reverse(); }
  const starts=T.starts.length?T.starts:[{x:T.rx[0],y:T.ry[0],a:Math.atan2(T.ty[0],T.tx[0])}];
  const cars=order.map((e,i)=>{ const s=starts[i%starts.length]; const g={x:s.x+(i>=starts.length?-Math.cos(s.a)*4:0),y:s.y+(i>=starts.length?-Math.sin(s.a)*4:0),a:s.a};
    const c=new Car(e.spec,e.drv,g,T); if(!e.drv.human) c.ai=new AI(c,clamp(e.drv.skill??80,1,100)/100,T); return c; });
  T.ton.set(T.ton0); T.tonDirty.length=0; // cada corrida começa com o piso original
  const R={T,cars,laps:raceLaps(T),timeLimit:Opts.lenMode==='min'?Opts.mins*60:null,phase:'intro',t:0,cd:0,order:cars.slice(),firstFin:null,endAt:null,fastest:null,headless,msg:null};
  R.movers=T.objs.filter(o=>o.type===36).map(o=>({x:o.x,y:o.y,a:o.a,vx:0,vy:0,moved:false})); // cones móveis voltam ao lugar a cada corrida
  // regras de desgaste: sem box na pista só vale o dano, como não haveria onde abastecer
  T.rules={tyre:T.hasPits?Opts.tyre:0,fuel:T.hasPits?Opts.fuel:0,fuelKg:T.hasPits?Opts.fuelKg:0,dmg:Opts.dmg};
  if(T.hasPits) cars.forEach((c,i)=>{ c.boxI=i%T.pitBoxes.length; });
  return R;
}
function raceStep(R){
  const T=R.T, prog=c=>{ const rel=((c.idx-T.finIdx)%T.N+T.N)%T.N; return c.crossed?c.lapsDone*T.N+rel:rel-T.N; };
  if(R.phase==='wait') return;
  if(R.phase==='intro'){ R.cd+=DT; if(R.cd>=3.4){ R.phase='count'; R.cd=0; } return; }
  // largada e retomada depois da pausa: três luzes vermelhas, uma por segundo (ding baixo), e verde no "já" (ding alto)
  if(R.phase==='count'||R.phase==='resume'){ R.cd+=DT; const lit=Math.min(3,Math.floor(R.cd)+1); if(lit!==R.lit){ R.lit=lit; Sound.beep(440); }
    if(R.cd>=3){ if(R.phase==='count') R.t=0; R.phase='run'; R.lit=0; R.greenT=R.t+1; Sound.beep(880); R.goFlash=1; } return; }
  if(R.phase!=='run') return;
  R.t+=DT;
  let firstHuman=true;
  for(const c of R.cars){ c.px=c.x; c.py=c.y; if(c.human){ if(c.drv.remote) c.inp=Net.remoteInput(c.drv.remote); else { c.inp=humanInput(c,firstHuman); firstHuman=false; } } else { c.inp=c.ai.update(R); if(c.finished) c.inp=coolDown(c,c.inp); } c.step(DT,c.inp,T); }
  collide(R); pitService(R);
  const last=T.cps.length-1;
  for(const c of R.cars){
    c.idx=T.nearest(c.x,c.y,c.idx);
    for(let k=0;k<T.cps.length;k++){
      const cp=T.cps[k]; if(!segX(c.px,c.py,c.x,c.y,cp.ax,cp.ay,cp.bx,cp.by)) continue;
      if(k===last) c.crossed=true;
      if(k!==c.nextCp) continue;
      if(k===last && !c.finished){
        const lt=R.t-c.lapStart; c.lapStart=R.t; c.laps.push(lt); c.lapsDone++;
        if(c.best==null||lt<c.best) c.best=lt;
        if(R.fastest==null||lt<R.fastest.t) R.fastest={t:lt,name:c.name};
        const done=c.lapsDone>=R.laps||(R.timeLimit!=null&&(R.firstFin!=null||R.t>=R.timeLimit));
        if(done){ c.finished=true; c.finishT=R.t; if(R.firstFin==null) R.firstFin=R.t; if(isMine(R,c)) say(R,R.net?'Você terminou em '+(R.order.indexOf(c)+1)+'º lugar':c.name+': '+(R.order.indexOf(c)+1)+'º lugar'); }
        else if(isMine(R,c)&&c.lapsDone===R.laps-1){ say(R,R.net?'Última volta!':'Última volta: '+c.name); if(!R.headless) Sound.ding(true); } // 0x40dbe0
      }
      c.nextCp=(k+1)%T.cps.length;
    }
    if(!c.human&&!c.finished){ const p=prog(c); if(p>c.lastP+2||c.ai.pitLine||c.ai.stop){ c.lastP=p; c.stuckT=0; } else if((c.stuckT+=DT)>10){
      const i=c.idx; if(R.cars.every(o=>o===c||Math.hypot(o.x-T.rx[i],o.y-T.ry[i])>4)){ resetCar(R,c); c.stuckT=0; c.lastP=p; c.ai.cnt=0; c.ai.i=nearAi(T,c); } } }
  }
  R.order=R.cars.slice().sort((a,b)=>{ if(a.finished&&b.finished) return a.finishT-b.finishT; if(a.finished) return -1; if(b.finished) return 1; return prog(b)-prog(a); });
  if(!R.headless){
    const hs=R.cars.filter(c=>c.human);
    const allDone=R.cars.every(c=>c.finished), humansDone=hs.length?hs.every(c=>c.finished):allDone;
    if(R.firstFin!=null){
      if(allDone||humansDone){ if(R.endAt==null||R.endCd){ R.endAt=R.t+1.5; R.endCd=false; } }
      else if(R.endAt==null){ R.endAt=R.firstFin+END_WAIT; R.endCd=true; } }
    if(R.endAt!=null&&R.t>=R.endAt) finishRace(R);
  }
}
function segX(ax,ay,bx,by,cx,cy,dx,dy){ const d=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx); if(Math.abs(d)<1e-9) return false; const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d, u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d; return t>=0&&t<=1&&u>=0&&u<=1; }
function say(R,t){ if(R.headless) return; R.msg={t,until:R.t+2.2}; }
const END_WAIT=45; // segundos para os outros terminarem depois do primeiro
// o carro deste jogador: no online, só o desta aba; fora dele, todos os humanos deste computador
function isMine(R,c){ return R.net==='guest'?!!c.mine:!!(c.human&&!(c.drv&&c.drv.remote)); }
// depois da chegada a IA segue a linha devagar (uns 7 m/s)
function coolDown(c,inp){ const v=Math.hypot(c.vx,c.vy), lc=v>9?-60:v<6?40:1; return {c:lc,steer:inp.steer,throttle:lc>=2?lc/100:0,brake:lc<0?-lc/100:0}; }
function nearAi(T,c){ const P=T.aiPts; let j=0,bd=1e18; for(let i=0;i<P.length;i++){ const d=(P[i][0]-c.x)**2+(P[i][1]-c.y)**2; if(d<bd){bd=d;j=i;} } return (j+1)%P.length; }
function resetCar(R,c){ const T=R.T, i=c.idx; c.x=T.rx[i]; c.y=T.ry[i]; c.a=Math.atan2(T.ty[i],T.tx[i]); c.vx=c.vy=c.w=c.ws=0; c.px=c.x; c.py=c.y; if(c.ai){ c.ai.pitLine=false; c.ai.stop=false; } }

async function startRace(entry){

  Sound.init();

  if(!entrants.length){ alertMenu('Ponha pelo menos um piloto na corrida.'); return; }
  show('loading');
  let T; try{ T=await loadTrack(entry); }catch(e){ show('menu'); alertMenu('Não consegui abrir essa pista: '+e.message); return; }

  Gfx.build(T);

  Gfx.addCars(Game.R);
  raceIntro(Game.R);

}

  const S=Game.season; const P=Opts.pts;
  if(R.net!=='guest') R.order.forEach((c,i)=>{ let p=c.finished?(P[i]||0):0; if(R.fastest&&c.best===R.fastest.t) p+=Opts.fl; c.pts=p; if(S){ S.points[c.name]=(S.points[c.name]||0)+p; S.wins[c.name]=(S.wins[c.name]||0)+(i===0&&c.finished?1:0); } });

    h+='<tr><td>'+(i+1)+'</td><td><span class="chip" style="background:'+c.c1+'"></span>'+esc(c.name)+'</td><td>'+c.spec.name+'</td><td class="n">'+t+'</td><td class="n">'+fmt(c.best)+(R.fastest&&c.best===R.fastest.t?' *':'')+'</td><td class="n">'+c.pts+'</td></tr>'; });
  h+='</table></div><p>'+(rec?(nr?'Novo recorde da pista: ':'Recorde da pista: ')+fmt(rec.t)+'s · '+esc(rec.name):'')+'</p>';
  const more=S&&S.idx<S.list.length-1;
  if(S&&S.list.length>1){ const rows=Object.entries(S.points).sort((a,b)=>b[1]-a[1]);
    h+='<h3>'+(more?'Campeonato após '+(S.idx+1)+' de '+S.list.length+' pistas':'Classificação final do campeonato')+'</h3><div class="tablewrap"><table><tr><th></th><th>Piloto</th><th class="n">Vitórias</th><th class="n">Pontos</th></tr>'+rows.map(([n,p],i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(n)+'</td><td class="n">'+(S.wins[n]||0)+'</td><td class="n">'+p+'</td></tr>').join('')+'</table></div>'; }
  if(R.net==='host') Net.state='lobby';

  h+='<div class="acts">'+(more?'<button id="rNext">Próxima pista</button>':'<button id="rAgain">Correr de novo</button>')+'<button id="rMenu">'+'Menu'+'</button></div>';
  $('resBox').innerHTML=h; show('results');
  if($('rNext')) $('rNext').onclick=()=>{ S.idx++; startRace(S.list[S.idx]); };

  $('rMenu').onclick=()=>backToMenu();
}

function keyCapture(e){

let padRaf=0;
function padCapture(){ // espera um botão ou eixo do controle mudar em relação ao repouso
  cancelAnimationFrame(padRaf); const w=waitKey, base={};
  const snap=(p,first)=>{ p.buttons.forEach((b,i)=>{ const k=p.index+'b'+i; if(first||!b.pressed) base[k]=b.pressed; }); p.axes.forEach((v,i)=>{ const k=p.index+'a'+i; if(first) base[k]=v; }); };
  for(const p of pads()) if(p) snap(p,true);
  const tick=()=>{ if(waitKey!==w||Game.mode!=='drivers') return;
    for(const p of pads()){ if(!p) continue;
      if(!(p.index+'b0' in base)) snap(p,true);
      for(let i=0;i<p.buttons.length;i++) if(p.buttons[i].pressed&&!base[p.index+'b'+i]){ setBind('Pad'+p.index+':B'+i); return; }
      for(let i=0;i<p.axes.length;i++){ const dv=p.axes[i]-base[p.index+'a'+i]; if(Math.abs(dv)>.6){ setBind('Pad'+p.index+':A'+i+(dv>0?'+':'-')); return; } }
      snap(p,false); }
    padRaf=requestAnimationFrame(tick); };
  padRaf=requestAnimationFrame(tick);
}
function setBind(code){
  const w=waitKey; if(!w) return;
  w.d.keys[w.k]=code; saveAll();
  const i=KEY_ACTS.findIndex(a=>a[0]===w.k); waitKey=w.seq&&i<3?{d:w.d,k:KEY_ACTS[i+1][0],seq:true}:null; buildDriver();
}

function trackDesc(e){
  if(e.b64) return {name:e.name,b64:e.b64};
  if(e.b64raw) return {name:e.name,b64raw:e.b64raw};
  if(e.buf){ let s=''; const u=new Uint8Array(e.buf); for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return {name:e.name,b64raw:btoa(s)}; }
}

let last=performance.now(), acc=0;
function frame(now){
  let dt=Math.min(.2,(now-last)/1000); last=now;
  const R=Game.R;
  if(R&&(Game.mode==='race'||Game.mode==='paused'||Game.mode==='results')){
    const live=Game.mode==='race'||(R.net&&Game.mode==='paused');
    if(R.net==='guest'){ if(live) Net.guestFrame(R,dt); }
    else if(live){ acc+=dt; while(acc>=DT){ raceStep(R); if(R.net) Net.hostStep(R); acc-=DT; } } else acc=0;
    Gfx.frame(R,live?dt:0); updateHud(R,dt);
  }
  Sound.update(R,Game.mode==='race');
  requestAnimationFrame(frame);
}

  const ents=Drivers.slice(0,6).map(d=>({drv:Object.assign({},d,{human:false,skill:100}),spec:carByName(carName||'General')}));
  Game.season=null; const R=newRace(T,ents,true); R.phase='run'; const n=Math.round(secs/DT); const tr=R.cars.map(()=>[]); for(let i=0;i<n;i++){ raceStep(R); if(i%25===0) R.cars.forEach((c,k)=>tr[k].push(c.x,c.y)); } window.__lastTrace={T,tr,names:R.cars.map(c=>c.name)};
  return {lapLen:Math.round(T.lapLen),cps:T.cps.length,cars:R.cars.map(c=>[c.name,c.lapsDone,c.best&&+c.best.toFixed(2)]),dbg:R.cars.filter(c=>c.lapsDone<2).map(c=>({n:c.name,x:+c.x.toFixed(1),y:+c.y.toFixed(1),idx:c.idx,N:T.N,next:c.nextCp,v:+Math.hypot(c.vx,c.vy).toFixed(1),h:+T.heightAt(c.x,c.y).toFixed(2),wet:T.wet(c.x,c.y),ai:c.ai&&c.ai.rev,wl:T.water,rx:+T.rx[c.idx].toFixed(1),ry:+T.ry[c.idx].toFixed(1)}))}; },
  Net,Gfx,start:async name=>{ selected=[Tracks.find(t=>t.name===name).id]; goStart(); }, Game, Opts, newRace, raceStep, Sound, collide, carHit};
})();
