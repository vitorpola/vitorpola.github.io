<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>G-Rali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a tilted 3D board over a sea-blue backdrop, a timing bar docked at the bottom, and flat pale-blue menu sheets like the original. */
:root{
  --sea:#3b8ae6;
  --sea-light:#62a6f2;
  --sheet:#dbe5ee;
  --ink:#0b5d91;
  --ink-dim:#9db2c6;
  --head:#d00000;
  --btn:#0c3553;
  --rule:#9fb3c8;
  --bar:#0f5a8c;
  --mono:"Lucida Console","Share Tech Mono","Consolas",ui-monospace,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--mono);color:var(--ink);
  background:var(--sea);
  background-image:radial-gradient(ellipse 22% 7% at 14% 8%,var(--sea-light) 60%,transparent 62%),
    radial-gradient(ellipse 18% 6% at 88% 14%,var(--sea-light) 60%,transparent 62%),
    radial-gradient(ellipse 25% 8% at 6% 52%,var(--sea-light) 60%,transparent 62%),
    radial-gradient(ellipse 20% 6% at 94% 46%,var(--sea-light) 60%,transparent 62%),
    radial-gradient(ellipse 26% 8% at 10% 86%,var(--sea-light) 60%,transparent 62%),
    radial-gradient(ellipse 22% 7% at 92% 80%,var(--sea-light) 60%,transparent 62%);}
#view{position:fixed;left:0;top:0;width:100%;height:calc(100% - var(--hudh,0px));display:block;outline:none;touch-action:none}
#ed{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#1d3a52}
button{font-family:inherit}
/* menu sheets */
.sheet{position:fixed;inset:0;background:var(--sheet);overflow:hidden;padding-inline:16px;padding-block:0}
.sheet .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;height:100%}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:clamp(8px,2.2vh,22px) 2% clamp(6px,1.2vh,10px);border-bottom:3px solid var(--rule);flex-wrap:wrap}
.mhead h1{margin:0;font-weight:400;font-size:clamp(20px,2.4vw,28px);color:var(--head)}
.mhead .brand{font-size:clamp(18px,2.2vw,26px);color:var(--ink)}
.mbody{flex:1;min-height:0;padding:clamp(8px,1.8vh,18px) 4%;display:flex;flex-direction:column;gap:clamp(6px,1.4vh,14px);overflow-y:auto}
.mfoot{position:relative;display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;border-top:3px solid var(--rule);padding:clamp(6px,1.2vh,12px) 2% clamp(8px,1.8vh,18px)}
.mmsg{position:absolute;left:0;right:0;bottom:100%;margin:0 0 6px;text-align:center;color:var(--head);font-size:16px;background:var(--sheet)}
.lk{all:unset;cursor:pointer;color:var(--ink);font-size:clamp(17px,1.9vw,24px);padding:2px 6px}
.lk:hover,.lk:focus-visible{color:var(--head);outline:none}
.lk.dim{color:var(--ink-dim)}
.sq{all:unset;cursor:pointer;width:34px;height:34px;box-sizing:border-box;display:inline-grid;place-items:center;font-size:20px;border:3px solid var(--btn);color:var(--btn);background:transparent;flex:none}
.sq.fill{background:var(--btn);color:#fff}
.sq:focus-visible{outline:2px solid var(--head)}
.lenrow{display:grid;grid-template-columns:1fr auto minmax(170px,auto) auto;align-items:center;gap:12px;max-width:900px;font-size:clamp(17px,1.9vw,24px)}
.lenrow .val{text-align:center;color:#122;white-space:nowrap}
.mid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,1fr);gap:30px;align-items:stretch;flex:none}
.slot{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:12px;border-bottom:3px solid var(--rule);height:clamp(30px,5.4vh,48px);font-size:clamp(16px,1.8vw,23px)}
.slot .car{all:unset;cursor:pointer;text-align:right;color:var(--ink)}
.slot .drv{all:unset;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.ai .car,.slot.ai .drv{color:var(--ink-dim)}
.slot canvas{width:64px;height:40px;max-height:100%;object-fit:contain}
.drvbox{border:3px solid var(--btn);height:calc(6 * clamp(30px,5.4vh,48px) - clamp(34px,6vh,50px));box-sizing:border-box;overflow-y:auto;padding:4px 10px;font-size:clamp(17px,1.9vw,24px)}
.drvbox button{all:unset;cursor:pointer;display:block;line-height:1.38;color:var(--ink)}
.drvbox button.ai{color:var(--ink-dim)}
.drvbox button.used{text-decoration:line-through;opacity:.55}
.trkbar{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;font-size:clamp(16px,1.8vw,23px)}
.trkbar .rnd{display:flex;align-items:center;gap:8px}.trkbar .rnd .sq{width:28px;height:28px;font-size:17px}
.trkbar .count{margin-left:auto}
.trkbar .folder{all:unset;cursor:pointer;border:3px solid var(--btn);border-bottom:0;padding:6px 18px;font-size:clamp(17px,1.9vw,24px);min-width:250px;text-align:center}
.trkbar .count{color:var(--ink-dim);font-size:clamp(16px,1.8vw,23px)}
#trkGrid{border:3px solid var(--btn);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:max-content;align-content:start;flex:1;min-height:90px;overflow-y:auto;padding:2px 0}
#trkGrid button{all:unset;cursor:pointer;padding:3px 18px;font-size:clamp(16px,1.8vw,23px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trkGrid button.sel{background:#a4b6c9}
#trkGrid button:focus-visible{outline:2px solid var(--head)}
.hint{color:var(--ink-dim);font-size:15px;margin:0;line-height:1.5}
.optgrid{display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(200px,1fr) auto;gap:12px 14px;align-items:center;max-width:900px;font-size:clamp(16px,1.8vw,23px)}
.optgrid .h{grid-column:1/-1;color:var(--head);margin-top:6px}
.optcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:10px 48px;align-items:start}
.optcols .optgrid{gap:clamp(6px,1.4vh,12px) 12px;grid-template-columns:minmax(150px,1fr) auto minmax(120px,1fr) auto}
.bar{height:34px;background:transparent;position:relative;display:grid;place-items:center;cursor:pointer;color:#123}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-dim)}
.bar span{position:relative}
.optgrid .tog{all:unset;cursor:pointer;grid-column:2/5;text-align:center;color:#123}
.optgrid .na{grid-column:2/5;text-align:center;color:var(--ink-dim);font-size:.8em}
.kbtn{all:unset;cursor:pointer;grid-column:2/5;text-align:center;color:#123}
.kbtn.wait{color:var(--head)}
#drvPrev{width:150px;height:110px;justify-self:center}
input.nm{font:inherit;color:#123;background:transparent;border:0;border-bottom:2px solid var(--rule);text-align:center;width:100%;min-width:0}
/* in-race HUD */
#hud{position:fixed;left:0;right:0;bottom:0;height:var(--hudh,84px);background:var(--bar);color:#fff;display:flex;align-items:center;gap:18px;padding-inline:10px;box-sizing:border-box;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
#hud .tn{min-width:170px;font-size:24px;line-height:1.35;white-space:nowrap}
#hud .lap{font-size:24px;min-width:70px;text-align:center}
#hudCars{display:flex;gap:14px;flex:1;justify-content:center;overflow:hidden}
.hc{display:grid;grid-template-columns:44px auto;grid-template-rows:auto auto;gap:3px 6px;align-items:center}
.hc canvas{width:44px;height:30px;grid-row:1}
.hc .bars{grid-row:2;display:flex;gap:3px;justify-content:center;height:30px;align-items:end;padding:2px;background:#111;border:3px solid var(--c)}
.hc .bars i{width:7px;background:#3d3;display:block}
.hc .bars i:nth-child(2){background:#e33}
.hc .bars i:nth-child(3){background:#ee3}
.hc .b .p.f{color:#f33}
.hc .b{border:3px solid var(--c);background:#111;font-size:24px;padding:0 6px;display:flex;gap:18px;justify-content:space-between;min-width:96px;line-height:1.15;font-variant-numeric:tabular-nums}
.hc .b .p{color:#ff0}
#intro{position:fixed;left:50%;top:calc((100% - var(--hudh,84px))/2);transform:translate(-50%,-50%);background:rgba(55,55,55,.82);color:#fff;padding:36px 52px;font-size:clamp(18px,2.2vw,28px);line-height:1.3;min-width:min(340px,80vw);box-sizing:border-box;white-space:pre-line}
#intro b{color:#ff0;font-weight:400}
#big{position:fixed;left:50%;top:calc((100% - var(--hudh,84px))*.45);transform:translate(-50%,-50%);font-size:clamp(46px,9vw,110px);color:#ff0;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;pointer-events:none;white-space:nowrap}
#msg{position:fixed;left:50%;top:calc((100% - var(--hudh,84px))*.2);transform:translateX(-50%);font-size:clamp(20px,3vw,34px);color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none;white-space:nowrap}
.box{position:fixed;left:50%;top:calc((100% - var(--hudh,84px))/2);transform:translate(-50%,-50%);background:rgba(55,55,55,.88);color:#fff;padding:26px 30px;font-size:clamp(15px,1.7vw,21px);width:min(780px,calc(100% - 32px));box-sizing:border-box;max-height:calc(100% - 120px);overflow:auto}
.box h3{margin:0 0 14px;font-weight:400;color:#ff0;font-size:1.3em}
.box table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.box th{color:#ff0;font-weight:400;text-align:left;padding:3px 8px}
.box td{padding:3px 8px;white-space:nowrap}
.box td.n{text-align:right}
.box .chip{display:inline-block;width:12px;height:12px;margin-right:8px;border:1px solid #000}
.box .acts{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.box .acts button{all:unset;cursor:pointer;color:#fff;font-size:1.15em}
.box .acts button:hover,.box .acts button:focus-visible{color:#ff0}
.tablewrap{overflow-x:auto}
/* editor panel */
#edPanel{position:fixed;top:0;left:0;bottom:0;width:min(400px,100%);background:var(--sheet);overflow-y:auto;box-sizing:border-box;padding-inline:18px;padding-block:16px;display:flex;flex-direction:column;gap:12px;font-size:15px;border-right:3px solid var(--rule)}
#edPanel h2{margin:0;color:var(--head);font-weight:400;font-size:22px}
#edPanel label{color:var(--ink);font-size:14px}
#edPanel input[type=text],#edPanel select,#edPanel textarea{font:inherit;color:#123;background:#fff;border:2px solid var(--rule);padding:5px;width:100%;box-sizing:border-box;min-width:0}
#edPanel textarea{font-size:12px;min-height:64px}
#edPanel input[type=range]{width:100%;accent-color:var(--btn)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;border:2px solid var(--btn);padding:4px 10px;color:var(--btn)}
.seg button[aria-pressed="true"]{background:var(--btn);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{all:unset;cursor:pointer;border:2px solid var(--btn);padding:6px 12px;color:var(--btn)}
.btns button.main{background:var(--btn);color:#fff}
.warn{color:var(--head);margin:0;min-height:1.2em;font-size:14px}
#touch{position:fixed;left:0;right:0;bottom:calc(var(--hudh,84px) + 10px);padding:0 16px;display:flex;justify-content:space-between;pointer-events:none}
#touch .g{display:flex;gap:12px;pointer-events:auto}
#touch button{all:unset;width:70px;height:70px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.5);color:#fff;display:grid;place-items:center;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
#touch button.on{background:rgba(255,220,0,.5)}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(55,55,55,.85);color:#fff;padding:18px 28px;font-size:20px}
@media (max-width:820px){
  .mid{grid-template-columns:1fr}
  #trkGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lenrow{grid-template-columns:1fr auto auto auto}
  #hud .tn{min-width:0;font-size:16px}
  #hud .lap{font-size:18px;min-width:0}
  .hc canvas,.hc .bars{display:none}
  .hc{grid-template-columns:auto}
  .hc .b{font-size:16px;min-width:0;gap:8px}
  #edPanel{top:auto;height:46%;width:100%;border-right:0;border-top:3px solid var(--rule)}
  .optgrid{grid-template-columns:1fr auto minmax(110px,1fr) auto}
}
.drvtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:clamp(17px,1.9vw,24px)}
.dsel{font:inherit;color:var(--btn);background:#fff;border:3px solid var(--btn);padding:4px 34px 4px 10px;min-width:240px;max-width:100%;appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--btn) 50%),linear-gradient(135deg,var(--btn) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.dsel.small{min-width:0;font-size:.85em}
.dsel:focus-visible,.drvBody button:focus-visible{outline:2px solid var(--head);outline-offset:2px}
.drvcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px 40px;font-size:clamp(16px,1.6vw,20px)}
.dcol{display:flex;flex-direction:column;gap:clamp(6px,1.3vh,12px);min-width:0}
.dcol .h{color:var(--head);margin-top:4px}
#drvPrev{width:auto;max-width:100%;height:min(240px,30vh);aspect-ratio:48/34;align-self:center;background:radial-gradient(ellipse at 50% 70%,#cbd8e4 0,transparent 70%)}
.dcap{text-align:center;color:var(--ink-dim);font-size:.85em}
.frow{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:12px}
.seg{display:flex;border:3px solid var(--btn)}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:5px 8px;color:var(--btn)}
.seg button[aria-pressed=true]{background:var(--btn);color:#fff}
.seg button:focus-visible{outline:2px solid var(--head);outline-offset:-4px}
.rng{display:flex;align-items:center;gap:10px}.rng input{flex:1;accent-color:var(--btn)}.rng output{min-width:3.2em;text-align:right}
.cbox{display:flex;flex-direction:column;gap:8px}
.chead{display:flex;align-items:center;gap:10px}
.chead .cur{width:30px;height:30px;border:3px solid var(--btn);flex:none}
.cpick{margin-left:auto;cursor:pointer;color:var(--ink);font-size:.85em;display:flex;align-items:center;gap:6px;position:relative}
.cpick input{width:30px;height:26px;padding:0;border:2px solid var(--btn);background:#fff;cursor:pointer}
.sw{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.sw button{all:unset;cursor:pointer;aspect-ratio:1;border:2px solid rgba(12,53,83,.35);box-sizing:border-box}
.sw button[aria-pressed=true]{border:3px solid var(--head);box-shadow:0 0 0 2px #fff inset}
.sw button:focus-visible{outline:2px solid var(--head);outline-offset:1px}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,110px));grid-template-areas:". up ." "left down right";gap:8px;justify-content:center}
.kcap{all:unset;cursor:pointer;box-sizing:border-box;height:clamp(48px,7.5vh,64px);border:3px solid var(--btn);border-bottom-width:6px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.kcap b.long{font-size:.8em}
.kcap b{font-weight:400;font-size:1.15em;color:var(--btn);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcap small{font-size:.68em;color:var(--ink)}
.kcap.k-up{grid-area:up}.kcap.k-down{grid-area:down}.kcap.k-left{grid-area:left}.kcap.k-right{grid-area:right}
.kcap:hover{background:#eef4f9}.kcap:focus-visible{outline:2px solid var(--head);outline-offset:2px}
.kcap.wait{border-color:var(--head);background:#fff3f3;animation:kpulse 1s infinite}
.kcap.wait b{color:var(--head)}
.kcap.clash{border-color:#d07000}
@keyframes kpulse{50%{background:#ffd9d9}}
.khint{margin:0;color:var(--ink);font-size:.85em;text-align:center}.khint.warn{color:#b05a00}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip2{all:unset;cursor:pointer;border:2px solid var(--btn);padding:3px 10px;font-size:.8em;color:var(--btn)}
.chip2[aria-pressed=true]{background:var(--btn);color:#fff}.chip2:focus-visible{outline:2px solid var(--head);outline-offset:2px}
.dlgback{position:fixed;inset:0;background:rgba(12,53,83,.35);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--sheet);border:3px solid var(--ink);width:min(560px,100%);max-height:100%;overflow:auto;padding:16px 28px 10px;box-sizing:border-box;font-size:clamp(15px,1.7vw,20px)}
.dlg h2{font-weight:400;color:var(--head);margin:6px 0 10px;padding-bottom:10px;border-bottom:3px solid var(--rule);font-size:1.15em}
.dlg p{color:var(--ink)}
table.stats{width:100%;border-collapse:collapse;color:var(--ink)}
table.stats th{font-weight:400;padding:4px 6px;border-bottom:3px solid var(--rule)}
table.stats td{padding:3px 6px}table.stats .n{text-align:right}
table.stats tr.tot td{border-top:3px solid var(--rule)}table.stats tr.gap td{padding-top:22px}
.dacts{display:flex;justify-content:space-around;border-top:3px solid var(--rule);margin-top:14px;padding-top:8px}
@media (max-width:820px){ .sheet{overflow-y:auto} .sheet .wrap{height:auto;min-height:100%} .mbody{overflow:visible} #trkGrid{flex:none;height:290px} .sw{grid-template-columns:repeat(10,minmax(0,1fr))} .drvcols{grid-template-columns:1fr} .dsel{min-width:0;flex:1} .frow{grid-template-columns:96px minmax(0,1fr)} }
.netyou{display:flex;align-items:center;gap:10px 24px;flex-wrap:wrap;font-size:clamp(16px,1.7vw,21px)}
.netyou .nyf{display:grid;grid-template-columns:auto minmax(0,240px);gap:8px 12px;align-items:center}
.netyou .dsel{min-width:0;width:100%}
.netcar{width:120px;height:78px}
.netjoin,.netroom{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px 40px;font-size:clamp(16px,1.7vw,21px);min-height:0}
.ncard{display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);border:3px solid var(--rule);padding:clamp(10px,1.8vh,18px) 20px;min-height:0}
.ncard .h{color:var(--head)}.ncard p{margin:0;color:var(--ink)}
.bigbtn{all:unset;cursor:pointer;align-self:flex-start;background:var(--btn);color:#fff;padding:8px 26px;font-size:1.05em}
.bigbtn:disabled{opacity:.5;cursor:default}.bigbtn:focus-visible{outline:2px solid var(--head);outline-offset:2px}
.coderow{display:flex;gap:10px;flex-wrap:wrap}
.codein{font:inherit;font-size:1.3em;letter-spacing:.25em;text-transform:uppercase;width:7.5em;min-width:0;border:3px solid var(--btn);background:#fff;color:var(--btn);padding:2px 10px}
.codebig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.codebig b{font-weight:400;font-size:2em;letter-spacing:.2em;color:var(--btn)}
.plist{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:0}
.plist li{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:10px;align-items:center;border-bottom:2px solid var(--rule);padding:4px 0}
.plist li.empty{display:block;color:var(--ink-dim)}
.plist .chip{width:16px;height:16px;border:2px solid var(--btn)}.plist .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plist .pc,.plist .pt{color:var(--ink-dim);font-size:.85em}
.ncard .frow{grid-template-columns:150px minmax(0,1fr)}
.stepper{display:flex;align-items:center;gap:10px}.stepper .sv{min-width:2em;text-align:center}
#intro[data-wait="1"]::after{content:"\A\AEsperando os outros jogadores…";font-size:.8em}
.roomrow{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;border:3px solid var(--btn);padding:6px 14px;font-size:clamp(16px,1.7vw,21px);min-height:44px;box-sizing:border-box}
.roomrow .rlab{color:var(--head)}.roomrow .ror{color:var(--ink-dim)}
.roomrow .bigbtn{padding:4px 18px}
.roomrow .codein{font-size:1em;width:6.5em;padding:1px 8px}
.roomrow .rcode{font-weight:400;font-size:1.35em;letter-spacing:.2em;color:var(--btn)}
.roomrow .rst{color:var(--ink);font-size:.85em;margin-left:auto}
.slot.net .drv,.slot.net .car{color:var(--ink)}
.slot button:disabled{cursor:default}
.locked{opacity:.45;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="view" tabindex="0" aria-label="Pista"></canvas>
<canvas id="ed" hidden></canvas>

<!-- menu principal -->

// Pinta a grade de "tonalidades" 512x512 do mesmo jeito que o jogo faz ao carregar (com espalhamento aleatório).
function paintTonality(raw,seed){
  const rnd=mulberry32(seed), R=k=>(rnd()*k)|0, t=new Uint8Array(CELLS*CELLS).fill(16), codes=raw.codes;

      case 4: t[idx]=t[idx]>=40?42:12+R(2); break;

      case 8: t[idx]=26+R(2); break;
      case 9: t[idx]=t[idx]<40?28:45; break;
      case 10: t[idx]=t[idx]<40?32:46; break;
      case 11: t[idx]=t[idx]<40?36:47; break;
      case 12: t[idx]=t[idx]<40?0:40; break;

}

function catmullClosed(P,spacing){
  const n=P.length, dense=[];

}

function prepareTrack(raw,name,seed){

// ====================================================================== IA (função 0x40b890 do original)
// Segue os pontos da linha da IA (um a cada ~5 m) com um desvio lateral sorteado, olha à frente
// conforme a velocidade e decide virar tudo para um lado ou para o outro, como no jogo original.
class AI{
  constructor(car,skill,T){
    this.car=car; this.skill=skill; this.cnt=0; this.off=100;
    const P=T.aiPts, N=P.length; let j=0,bd=1e18;
    for(let i=0;i<N;i++){ const d=(P[i][0]-car.x)**2+(P[i][1]-car.y)**2; if(d<bd){bd=d;j=i;} }
    const n=P[(j+1)%N], t=(car.x-P[j][0])*(n[0]-P[j][0])+(car.y-P[j][1])*(n[1]-P[j][1]);
    this.i=t>=0?(j+1)%N:j;

  update(R){
    const c=this.car, T=R.T, s=c.spec, onPit=!!this.pitLine, P=onPit?T.pitPts:T.aiPts, N=P.length;
    const at=k=>onPit?clamp(k,0,N-1):((k%N)+N)%N;
    const ca=Math.cos(c.a), sa=Math.sin(c.a), Rx=-sa, Ry=ca, spd=Math.hypot(c.vx,c.vy), vf=c.vx*ca+c.vy*sa;
    const out=(lc,st)=>{ if(spd>=3||lc===0||lc===1||this.stop) this.cnt=0; else this.cnt++; return {c:lc,steer:st,throttle:lc>=2?1:0,brake:lc<=0?1:0}; };
    // parado no box esperando a equipe
    if(this.stop){ if(c.pit&&c.pit.done||this.stopT++>1500){ this.stop=false; this.served=true; } else return out(0,0); }
    const it=this.cnt%400;
    if(it>=200){ if(spd>20){ this.cnt+=400-it; return {c:100,steer:0,throttle:1,brake:0}; } this.cnt++; return {c:100,steer:0,throttle:1,brake:0}; }
    if(it>=140){ // preso: dá ré virando para o lado da linha
      const i=this.i, n=P[at(i+1)], sx=n[0]-P[i][0], sy=n[1]-P[i][1], rx=P[i][0]-c.x, ry=P[i][1]-c.y;
      const tt=(rx*sx+ry*sy)/(sx*sx+sy*sy+1e-4), dx=rx-tt*sx, dy=ry-tt*sy;
      this.cnt++; return {c:-100,steer:(Rx*dx+Ry*dy)>=0?1:-1,throttle:0,brake:1};
    }
    const Tl=2.5/Math.sqrt(Math.max(c.gs,1e-3)*100)*this.skill;
    const ip=at(this.i-1), a=P[ip], b=P[this.i], sx=b[0]-a[0], sy=b[1]-a[1], rx=c.x-a[0], ry=c.y-a[1];
    let t=(rx*sx+ry*sy)/(sx*sx+sy*sy+1e-4);
    if(t>0){
      const sl=Math.hypot(sx,sy)||1;
      let o=Math.random()*3+2+clamp((rx*-sy+ry*sx)/sl*.75+1.5,0,3);
      for(const oc of R.cars){ if(oc===c) continue;
        const dx=oc.x-c.x, dy=oc.y-c.y, df=dx*ca+dy*sa, lim=oc.spec.ax[2]+s.ax[2]+.5;
        if(-df<lim&&((oc.vx-c.vx)*ca+(oc.vy-c.vy)*sa)*Tl+df<lim){
          const dlat=dx*Rx+dy*Ry, w=s.ax[0]+.5+oc.spec.ax[0];
          if(dlat<=0){ const x=w+dlat; if(x>0) o+=x; } else { const x=dlat-w; if(x<0) o+=x; } } }
      this.off=onPit?100:o<0?0:o>10?200:(o/.05)|0;
      if(onPit&&this.i>=N-1){ this.pitLine=false; this.i=(T.pitOut+1)%T.aiPts.length; return this.update(R); }
      this.i=at(this.i+1);
      if(!onPit&&this.i===T.pitIn) this.pitDecide(R);
    }
    // ponto-alvo à frente, deslocado para o lado
    let L=Tl/5*spd+1+t; if(L<0) L=0;
    let j=at(ip+Math.floor(L)); const fr=L-Math.floor(L); const j1=at(j+1);
    const ex=P[j1][0]-P[j][0], ey=P[j1][1]-P[j][1], el=Math.hypot(ex,ey)||1, ov=(this.off*.05-5)/el, ox=ey*ov, oy=-ex*ov;
    const th=c.w*Tl, hx=ca*Math.cos(th)+Rx*Math.sin(th), hy=sa*Math.cos(th)+Ry*Math.sin(th);
    let tx=P[j][0]*(1-fr)+P[j1][0]*fr+ox-c.x-c.vx*Tl-hx*s.aiB8, ty=P[j][1]*(1-fr)+P[j1][1]*fr+oy-c.y-c.vy*Tl-hy*s.aiB8;
    // no corredor do box: mira o próprio box, freia e para nele
    const box=onPit&&!this.served?T.pitBoxes[c.boxI]:null, bd=box?Math.hypot(box.x-c.x,box.y-c.y):1e9;
    if(box&&bd<14){ tx=box.x-c.x-c.vx*Tl*.5; ty=box.y-c.y-c.vy*Tl*.5; }
    const st=(Rx*tx+Ry*ty)>=0?1:-1;
    if(box&&bd<14){ if(bd<3.5&&spd<2.5){ this.stop=true; this.stopT=0; return out(0,0); }
      // passou do box: volta de ré até ele
      if((box.x-c.x)*ca+(box.y-c.y)*sa<-1) return out(spd>1&&vf>0?0:-100,-st);
      const vl=Math.sqrt(2*4*Math.max(0,bd-2))+.6; return out(spd>vl?0:vf<vl*.8?100:1,st); }
    // acelerar, soltar ou frear conforme a curva à frente
    const j2=at(this.i+1+Math.trunc(.016*spd*spd*Tl*Tl)), dx=P[j2][0]+ox-c.x, dy=P[j2][1]+oy-c.y;
    let lc;
    if(dx*ca+dy*sa<0) lc=-100;
    else if(vf<0) lc=100;
    else { const uD=-c.vy*dx+c.vx*dy; let vl=1000;
      if(uD>=1||uD<=-1) vl=Math.sqrt(spd*spd*(dx*dx+dy*dy)*Math.max(c.gs,1e-3)*50/Math.abs(uD));
      lc=vl<=spd?(vf<vl?1:0):100; }
    if(onPit&&spd>13) lc=spd>16?-100:0; // corredor do box: devagar
    if(box){ const vb=Math.sqrt(8*Math.max(0,bd-2))+.6; if(spd>vb) lc=spd>vb+2?-100:0; } // chegando no box
    return out(lc,st);
  }
  // decisão de parar no box (0x40b890): falta combustível para terminar, ou o dano pesa nas voltas que faltam
  pitDecide(R){
    const c=this.car, T=R.T, O=T.rules||NO_RULES; if(!T.hasPits||T.pitPts.length<2||c.boxI==null) return;
    const left=R.laps-c.lapsDone-1, lapM=T.lapLen; if(left<1||R.timeLimit) return;
    const per=O.fuel*lapM; let go=false;
    if(c.fuel>=per*left) go=c.dmg*left*lapM>2e7;
    else if(per>65536) go=true; // pista mais longa que um tanque: no original a conta divide por zero e a IA para toda volta
    else { const lpt=Math.floor(65536/per);
      if(Math.floor((left-1-Math.floor(c.fuel/per))/lpt)<Math.floor((left-1)/lpt)) go=(left-Math.floor(left/lpt)*lpt)*c.dmg*lapM>2e7;
      else go=c.dmg>1000||Math.floor(left/lpt+1)*c.fuel*Math.random()<per; }
    if(go){ const P=T.pitPts; let j=0,bd=1e18; P.forEach((q,i)=>{ const d=(q[0]-c.x)**2+(q[1]-c.y)**2; if(d<bd){bd=d;j=i;} });
      this.pitLine=true; this.served=false; this.i=Math.min(P.length-1,j+1); }
  }
}

// ====================================================================== box: a equipe troca os pneus (2,5 s), abastece 128 por passo e conserta 6600 a cada 0,5 s
function pitService(R){
  const T=R.T; if(!T.hasPits||!T.rules) return;
  for(const c of R.cars){ if(c.boxI==null) continue;
    const b=T.pitBoxes[c.boxI], d=Math.hypot(b.x-c.x,b.y-c.y), spd=Math.hypot(c.vx,c.vy);
    if(d>=5||spd>=3){ if(c.pit&&d>=10) c.pit=null; continue; }
    if(!c.pit) c.pit={t:0,fuel:c.fuel<65000,tyre:T.rules.tyre>0||c.tyre<FULL,rep:c.dmg>0,done:false};
    const p=c.pit; if(p.done) continue; p.t++;
    if(p.fuel){ c.fuel=Math.min(FULL,c.fuel+128); if(c.fuel>=FULL) p.fuel=false; }
    if(p.tyre&&p.t>=251){ c.tyre=FULL; p.tyre=false; }
    if(p.rep&&p.t%50===0){ c.dmg=Math.max(0,Math.floor((c.dmg-1)/6600)*6600); if(!c.dmg) p.rep=false; }
    if(!p.fuel&&!p.tyre&&!p.rep) p.done=true;
  }
}

// ====================================================================== colisões por impulso
const NO_RULES={tyre:0,fuel:0,fuelKg:0,dmg:0};
function hitStatic(car,px,py,nx,ny,pen,e){
  const s=car.spec, m=s.mass, I=s.I; car.x+=nx*pen; car.y+=ny*pen; car.lastE=0;
  const rx=px-car.x, ry=py-car.y, vpx=car.vx-car.w*ry, vpy=car.vy+car.w*rx, vn=vpx*nx+vpy*ny; if(vn>=0) return 0;
  const rn=rx*ny-ry*nx, j=-(1+e)*vn/(1/m+rn*rn/I);
  car.vx+=j*nx/m; car.vy+=j*ny/m; car.w+=rn*j/I;
  const tx=-ny,ty=nx,vt=vpx*tx+vpy*ty,rt=rx*ty-ry*tx, jt=clamp(-vt/(1/m+rt*rt/I),-.25*j,.25*j);
  car.vx+=jt*tx/m; car.vy+=jt*ty/m; car.w+=rt*jt/I; car.lastE=(j/(1+e)/m)**2; return -vn;
}
function collide(R){
  const T=R.T;
  for(const car of R.cars){
    for(const [x,y,r] of car.circles()){
      for(const o of T.circles){ const dx=x-o.x, dy=y-o.y, rr=r+o.r; if(dx>rr||dx<-rr||dy>rr||dy<-rr) continue;
        const d=Math.hypot(dx,dy); if(d<rr&&d>1e-6){ const nx=dx/d, ny=dy/d; impact(R,hitStatic(car,o.x+nx*o.r,o.y+ny*o.r,nx,ny,rr-d,.3),o.x+nx*o.r,o.y+ny*o.r,car); } }
      for(const b of T.boxes){ const ext=b.hw+b.hh+r; if(Math.abs(x-b.x)>ext||Math.abs(y-b.y)>ext) continue;
        const c=Math.cos(b.ang), s=Math.sin(b.ang), lx=(x-b.x)*c+(y-b.y)*s, ly=-(x-b.x)*s+(y-b.y)*c;
        const qx=clamp(lx,-b.hw,b.hw), qy=clamp(ly,-b.hh,b.hh); const dx=lx-qx, dy=ly-qy, d=Math.hypot(dx,dy);
        if(d<r){ let nlx,nly,pen;
          if(d>1e-6){ nlx=dx/d; nly=dy/d; pen=r-d; } else { const ex=b.hw-Math.abs(lx), ey=b.hh-Math.abs(ly); if(ex<ey){ nlx=Math.sign(lx)||1; nly=0; pen=ex+r; } else { nlx=0; nly=Math.sign(ly)||1; pen=ey+r; } }
          const nx=nlx*c-nly*s, ny=nlx*s+nly*c, px=b.x+qx*c-qy*s, py=b.y+qx*s+qy*c;
          impact(R,hitStatic(car,px,py,nx,ny,pen,.3),px,py,car); } }
      const m=.3, W=T.W;
      if(x-r<m) impact(R,hitStatic(car,m,y,1,0,m-(x-r),.3),m,y,car);
      if(x+r>W-m) impact(R,hitStatic(car,W-m,y,-1,0,x+r-(W-m),.3),W-m,y,car);
      if(y-r<m) impact(R,hitStatic(car,x,m,0,1,m-(y-r),.3),x,m,car);
      if(y+r>W-m) impact(R,hitStatic(car,x,W-m,0,-1,y+r-(W-m),.3),x,W-m,car);

  for(let a=0;a<cs.length;a++) for(let b=a+1;b<cs.length;b++){
    const A=cs[a], B=cs[b], lim=(A.spec.L+B.spec.L)/2+1; if(Math.abs(A.x-B.x)>lim||Math.abs(A.y-B.y)>lim) continue;
    for(const [ax,ay,ra] of A.circles()) for(const [bx,by,rb] of B.circles()){
      const dx=ax-bx, dy=ay-by, d=Math.hypot(dx,dy), rr=ra+rb; if(d>=rr||d<1e-6) continue;
      const nx=dx/d, ny=dy/d, pen=rr-d, ma=A.spec.mass, mb=B.spec.mass;
      A.x+=nx*pen*mb/(ma+mb); A.y+=ny*pen*mb/(ma+mb); B.x-=nx*pen*ma/(ma+mb); B.y-=ny*pen*ma/(ma+mb);
      const px=bx+nx*rb, py=by+ny*rb, rax=px-A.x, ray=py-A.y, rbx=px-B.x, rby=py-B.y;
      const vn=(A.vx-A.w*ray-(B.vx-B.w*rby))*nx+(A.vy+A.w*rax-(B.vy+B.w*rbx))*ny; if(vn>=0) continue;
      const rna=rax*ny-ray*nx, rnb=rbx*ny-rby*nx, j=-1.35*vn/(1/ma+1/mb+rna*rna/A.spec.I+rnb*rnb/B.spec.I);
      A.vx+=j*nx/ma; A.vy+=j*ny/ma; A.w+=rna*j/A.spec.I; B.vx-=j*nx/mb; B.vy-=j*ny/mb; B.w-=rnb*j/B.spec.I;
      const O=R.T.rules||NO_RULES; A.hit((j/1.35/ma)**2,O); B.hit((j/1.35/mb)**2,O);
      impact(R,-vn,px,py,A,B);
    }
  }
}
function impact(R,v,x,y,a,b){
  if(a&&!b){ a.hit(a.lastE||0,R.T.rules||NO_RULES); }
  const E=Math.max(a&&!b?a.lastE||0:0,v*v*.5);
  if(R.headless||E<=50) return; Gfx.sparks(x,y,Math.sqrt(E)); }

// ====================================================================== som
// Como no original (0x407cd0 e 0x4061c0): cada carro tem um motor tocando sem parar, com o tom
// proporcional à velocidade da roda: taxa = (|roda|×4+50)/vel_máx × 10000/22050 (metade debaixo d'água);
// acelerando fica 7 dB mais alto. O chiado é um só para a corrida, com volume ∝ √(soma do escorregamento
// das rodas no asfalto); a batida idem com a energia das colisões. Sons próprios por padrão; dá para
// carregar os .wav de uma instalação do jogo original nas Opções.
const ENG_H=[0,-8.3,-9.5,-13.3,-14.6,-19.7,-19.4,-20.8,-25.8,-24.9,-28.3,-25.7,-31.7,-33,-37.2]; // harmônicos do motor original (dB)
const Sound={
  ctx:null, master:null, eng:[], skid:null, custom:{}, lastDmg:0,
  init(){ if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{ const ctx=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-10; comp.knee.value=12; comp.ratio.value=6; comp.connect(ctx.destination);
      this.master=ctx.createGain(); this.master.gain.value=.8; this.master.connect(comp);
      const len=ctx.sampleRate, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.noise=buf;
      const re=new Float32Array(ENG_H.length+1), im=new Float32Array(ENG_H.length+1); let r=12345;
      ENG_H.forEach((db,i)=>{ const a=Math.pow(10,db/20), ph=((r=(r*16807)%2147483647)/2147483647)*Math.PI*2; re[i+1]=a*Math.cos(ph); im[i+1]=a*Math.sin(ph); });
      this.engWave=ctx.createPeriodicWave(re,im);
      // chiado: assobio em torno de 1,3 kHz que oscila devagar, como o skid.wav original
      const sl=2*ctx.sampleRate, sb=ctx.createBuffer(1,sl,ctx.sampleRate), sd=sb.getChannelData(0); let ph=0, lp=0;
      for(let i=0;i<sl;i++){ const t=i/ctx.sampleRate, f=1320+38*Math.sin(2*Math.PI*1.5*t)+22*Math.sin(2*Math.PI*3*t+1); ph+=2*Math.PI*f/ctx.sampleRate;
        lp+=(Math.random()*2-1-lp)*.3; sd[i]=.36*Math.sin(ph)+.04*Math.sin(2*ph+.5)+.05*lp; }
      this.skidBuf=sb;
      this.loadCustom();
    }catch(e){ this.ctx=null; } },
  setVol(){},
  vol(){ return clamp(Opts.vol,0,100)/100; },
  // sons do jogo original escolhidos pelo jogador (ficam só neste navegador)
  loadCustom(){ const c=store.get('gr.snd',null); this.custom={}; if(!c||!this.ctx) return;
    for(const [k,b64] of Object.entries(c)){ try{ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      this.ctx.decodeAudioData(u.buffer,b=>{ this.custom[k]=b; if(k==='engine') this.resetEngines(); if(k==='skid') this.resetSkid(); },()=>{}); }catch(e){} } },
  resetEngines(){ this.eng.forEach(e=>{ try{ e.src.stop(); }catch(_){} e.g.disconnect(); }); this.eng=[]; },
  resetSkid(){ if(this.skid){ try{ this.skid.src.stop(); }catch(_){} this.skid.g.disconnect(); this.skid=null; } },
  voice(buf){ const ctx=this.ctx, g=ctx.createGain(); g.gain.value=0; let src;
    if(buf){ src=ctx.createBufferSource(); src.buffer=buf; src.loop=true; } else { src=ctx.createOscillator(); src.setPeriodicWave(this.engWave); }
    src.connect(g); g.connect(this.master); src.start(); return {src,g,buf:!!buf}; },
  update(R,active){
    if(!this.ctx) return; const t=this.ctx.currentTime, V=this.vol(), cars=active&&R&&R.phase!=='wait'?R.cars:[];
    while(this.eng.length<cars.length) this.eng.push(this.voice(this.custom.engine));
    this.eng.forEach((e,i)=>{ const c=cars[i];
      if(!c){ e.g.gain.setTargetAtTime(0,t,.03); return; }
      const under=c.wet&&c.wet>=c.wheels.length, rate=Math.floor((Math.abs(c.ws)*4+50)/c.spec.vmax*10000)/22050*(under?.5:1);

  crash(v){ if(!this.ctx||v<.02) return; const ctx=this.ctx, src=ctx.createBufferSource(), g=ctx.createGain();

    if(this.custom.ding&&f>=800){ const s=ctx.createBufferSource(), g=ctx.createGain(); s.buffer=this.custom.ding; g.gain.value=this.vol(); s.connect(g); g.connect(this.master); s.start(); return; }

};

const PADRE=/^Pad(\d+):(B|A)(\d+)([+-]?)$/;

function bindVal(code,gp){
  if(!code) return 0; const m=PADRE.exec(code); if(!m) return keys.has(code)?1:0;
  const p=gp[+m[1]]; if(!p) return 0;
  if(m[2]==='B'){ const b=p.buttons[+m[3]]; return b?(b.pressed?Math.max(b.value,.999):b.value>.15?b.value:0):0; }

  const k=car.drv.keys||{}, gp=pads(), val=n=>bindVal(k[n],gp);

  if(first){ up=Math.max(up,touchK.up); down=Math.max(down,touchK.down); left=Math.max(left,touchK.left); right=Math.max(right,touchK.right); }
  const inp={throttle:up,brake:down,steer:right-left};

}

const Game={ mode:'menu', R:null, season:null, entry:null };

function newRace(T,entrants,headless){
  // ordem de largada
  let order=entrants.slice();
  const pts=Game.season?Game.season.points:{};
  if(Opts.order==='rand'||!Game.season||Game.season.idx===0){ for(let i=order.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [order[i],order[j]]=[order[j],order[i]]; } }
  else { order.sort((a,b)=>(pts[b.drv.name]||0)-(pts[a.drv.name]||0)); if(Opts.order==='rev') order.reverse(); }
  const starts=T.starts.length?T.starts:[{x:T.rx[0],y:T.ry[0],a:Math.atan2(T.ty[0],T.tx[0])}];
  const cars=order.map((e,i)=>{ const s=starts[i%starts.length]; const g={x:s.x+(i>=starts.length?-Math.cos(s.a)*4:0),y:s.y+(i>=starts.length?-Math.sin(s.a)*4:0),a:s.a};
    const c=new Car(e.spec,e.drv,g,T); if(!e.drv.human) c.ai=new AI(c,clamp(e.drv.skill??80,1,100)/100,T); return c; });
  const R={T,cars,laps:raceLaps(T),timeLimit:Opts.lenMode==='min'?Opts.mins*60:null,phase:'intro',t:0,cd:0,order:cars.slice(),firstFin:null,endAt:null,fastest:null,headless,msg:null};
  // regras de desgaste: sem box na pista só vale o dano, como não haveria onde abastecer
  T.rules={tyre:T.hasPits?Opts.tyre:0,fuel:T.hasPits?Opts.fuel:0,fuelKg:T.hasPits?Opts.fuelKg:0,dmg:Opts.dmg};
  if(T.hasPits) cars.forEach((c,i)=>{ c.boxI=i%T.pitBoxes.length; });
  return R;
}
function raceStep(R){
  const T=R.T, prog=c=>{ const rel=((c.idx-T.finIdx)%T.N+T.N)%T.N; return c.crossed?c.lapsDone*T.N+rel:rel-T.N; };

  if(R.phase==='count'){ const before=Math.ceil(3-R.cd); R.cd+=DT; const n=Math.ceil(3-R.cd); if(n!==before&&n>0) Sound.beep(440); if(R.cd>=3){ R.phase='run'; R.t=0; Sound.beep(880,.4); R.goFlash=1; } return; }
  if(R.phase!=='run') return;
  R.t+=DT;
  let firstHuman=true;
  for(const c of R.cars){ c.px=c.x; c.py=c.y; if(c.human){ if(c.drv.remote) c.inp=Net.remoteInput(c.drv.remote); else { c.inp=humanInput(c,firstHuman); firstHuman=false; } } else c.inp=c.ai.update(R); c.step(DT,c.inp,T); }

  const last=T.cps.length-1;
  for(const c of R.cars){
    c.idx=T.nearest(c.x,c.y,c.idx);
    for(let k=0;k<T.cps.length;k++){
      const cp=T.cps[k]; if(!segX(c.px,c.py,c.x,c.y,cp.ax,cp.ay,cp.bx,cp.by)) continue;
      if(k===last) c.crossed=true;
      if(k!==c.nextCp) continue;
      if(k===last && !c.finished){
        const lt=R.t-c.lapStart; c.lapStart=R.t; c.laps.push(lt); c.lapsDone++;
        if(c.best==null||lt<c.best) c.best=lt;
        if(R.fastest==null||lt<R.fastest.t) R.fastest={t:lt,name:c.name};
        const done=c.lapsDone>=R.laps||(R.timeLimit!=null&&(R.firstFin!=null||R.t>=R.timeLimit));
        if(done){ c.finished=true; c.finishT=R.t; if(R.firstFin==null) R.firstFin=R.t; if(c.human) say(R,c.name+': '+(R.order.indexOf(c)+1)+'º lugar'); }

    }
    if(c.human){ const sp=c.vx*T.tx[c.idx]+c.vy*T.ty[c.idx]; c.wrong=sp<-4?c.wrong+DT:0; }
    else if(!c.finished){ const p=prog(c); if(p>c.lastP+2||c.ai.pitLine||c.ai.stop){ c.lastP=p; c.stuckT=0; } else if((c.stuckT+=DT)>10){

  }
  R.order=R.cars.slice().sort((a,b)=>{ if(a.finished&&b.finished) return a.finishT-b.finishT; if(a.finished) return -1; if(b.finished) return 1; return prog(b)-prog(a); });
  if(!R.headless){
    const hs=R.cars.filter(c=>c.human);
    const allDone=R.cars.every(c=>c.finished), humansDone=hs.length?hs.every(c=>c.finished):R.firstFin!=null;
    if(R.endAt==null&&(allDone||(humansDone&&R.firstFin!=null))) R.endAt=allDone?R.t+1.5:Math.min(R.t+20,(R.firstFin??R.t)+30);

function segX(ax,ay,bx,by,cx,cy,dx,dy){ const d=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx); if(Math.abs(d)<1e-9) return false; const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d, u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d; return t>=0&&t<=1&&u>=0&&u<=1; }

    e.p.textContent=lowF&&((R.t*2|0)&1)?'F':pos; e.p.classList.toggle('f',!!lowF); e.l.textContent=c.lapsDone;

    [c.tyre,FULL-c.dmg,c.fuel].forEach((v,q)=>{ e.bars[q].style.height=Math.round(clamp(v/FULL,0,1)*24)+'px'; }); }
  const big=$('big');

function keyCapture(e){

let padRaf=0;
function padCapture(){ // espera um botão ou eixo do controle mudar em relação ao repouso
  cancelAnimationFrame(padRaf); const w=waitKey, base={};
  const snap=(p,first)=>{ p.buttons.forEach((b,i)=>{ const k=p.index+'b'+i; if(first||!b.pressed) base[k]=b.pressed; }); p.axes.forEach((v,i)=>{ const k=p.index+'a'+i; if(first) base[k]=v; }); };
  for(const p of pads()) if(p) snap(p,true);
  const tick=()=>{ if(waitKey!==w||Game.mode!=='drivers') return;
    for(const p of pads()){ if(!p) continue;
      if(!(p.index+'b0' in base)) snap(p,true);
      for(let i=0;i<p.buttons.length;i++) if(p.buttons[i].pressed&&!base[p.index+'b'+i]){ setBind('Pad'+p.index+':B'+i); return; }
      for(let i=0;i<p.axes.length;i++){ const dv=p.axes[i]-base[p.index+'a'+i]; if(Math.abs(dv)>.6){ setBind('Pad'+p.index+':A'+i+(dv>0?'+':'-')); return; } }
      snap(p,false); }
    padRaf=requestAnimationFrame(tick); };
  padRaf=requestAnimationFrame(tick);
}
function setBind(code){

  w.d.keys[w.k]=code; saveAll();
  const i=KEY_ACTS.findIndex(a=>a[0]===w.k); waitKey=w.seq&&i<3?{d:w.d,k:KEY_ACTS[i+1][0],seq:true}:null; buildDriver();

const r2=v=>Math.round(v*100)/100, r3=v=>Math.round(v*1000)/1000;
function loadPeerLib(){
  if(window.Peer) return Promise.resolve();
  return new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src=window.GR_PEERJS_SRC||PEERJS_SRC; s.onload=()=>ok(); s.onerror=()=>bad(new Error('não consegui carregar a biblioteca de rede')); document.head.appendChild(s); });
}
const peerOpts=()=>Object.assign({debug:0},window.GR_PEER_OPTS||{});
const Net={
  state:'off', role:null, peer:null, conns:new Map(), conn:null, code:'', myId:'host', players:[], trackId:null, trackName:'', laps:3, ai:0,
  inputs:{}, ready:new Set(), buf:[], rt:null, k:0, lastIn:'', lastInT:0, msg:'', joinCode:'',
  prefs:store.get('gr.net',{}),

    let d=drvByName(this.prefs.drv); if(!d||!d.human) d=(sl&&drvByName(sl.d))||hs[0]||Drivers[0];
    return {drv:d.name,name:d.name,car:carByName(this.prefs.car||(sl&&sl.car)||'General').name,c1:d.c1,c2:d.c2}; },

  inviteUrl(){ return location.href.split('#')[0]+'#sala='+this.code; },

  // ---------------------------------------------------------------- anfitrião

    if(this.gm) drawLayers(x,this.gm,d,'pretty'); else { x.fillStyle=EPAL.grass; x.fillRect(0,0,d.w,d.w); }
    x.strokeStyle='rgba(255,255,255,.08)'; x.lineWidth=1/v.s; for(let i=10;i<d.w;i+=10){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,d.w); x.moveTo(0,i); x.lineTo(d.w,i); x.stroke(); }
    if(this.gm){ const gm=this.gm; x.fillStyle='rgba(255,255,255,.6)'; for(let i=8;i<gm.N;i+=18){ x.save(); x.translate(gm.cx[i],gm.cy[i]); x.rotate(Math.atan2(gm.ty[i],gm.tx[i])); x.beginPath(); x.moveTo(1.8,0); x.lineTo(-1.2,-1.5); x.lineTo(-1.2,1.5); x.closePath(); x.fill(); x.restore(); }
      x.save(); x.translate(gm.cx[0],gm.cy[0]); x.rotate(Math.atan2(gm.ty[0],gm.tx[0])); x.fillStyle='#fff'; x.fillRect(-.4,-d.width/2,.8,d.width); x.restore(); }
    x.setTransform(dpr,0,0,dpr,0,0); x.textAlign='center'; x.textBaseline='middle'; x.font='12px "Share Tech Mono",monospace';
    if(this.tool==='pond') d.ponds.forEach((p,i)=>{ x.strokeStyle=this.hover===i||this.drag===i?'#ffd000':'rgba(255,255,255,.7)'; x.lineWidth=2; x.beginPath(); x.ellipse(v.ox+p[0]*v.s,v.oy+p[1]*v.s,p[2]*v.s,p[3]*v.s,0,0,7); x.stroke(); });
    d.pts.forEach((p,i)=>{ const X=v.ox+p[0]*v.s, Y=v.oy+p[1]*v.s, hot=this.tool==='pts'&&(this.hover===i||this.drag===i);
      x.beginPath(); x.arc(X,Y,i===0?11:9,0,7); x.fillStyle=i===0?'#ffd000':hot?'#fff':'#0c3553'; x.fill(); x.lineWidth=2; x.strokeStyle='#ffd000'; x.stroke(); x.fillStyle=i===0||hot?'#000':'#fff'; x.fillText(String(i+1),X,Y+.5); }); },
  play(){ const d=this.def; if(d.pts.length<4||(this.gm&&this.gm.L<120)){ $('edWarn').textContent='A pista precisa de pelo menos 4 pontos e 120 m.'; return; }
    const e={id:'u:'+d.id,name:d.name,folder:'Minhas pistas',def:JSON.parse(JSON.stringify(d))}; Game.season=null; startRace(e).then(()=>{ Game.fromEditor=true; }); },
  save(){ const d=this.def, list=store.get('gr.mytracks',[]), i=list.findIndex(t=>t.id===d.id), copy=JSON.parse(JSON.stringify(d)); if(i>=0) list[i]=copy; else list.push(copy);
    const ok=store.set('gr.mytracks',list); const old=Tracks.find(t=>t.id==='u:'+d.id); if(old) Tracks.splice(Tracks.indexOf(old),1); Tracks.push({id:'u:'+d.id,name:d.name,folder:'Minhas pistas',def:copy});
    $('edWarn').textContent=ok?'Pista salva em [Minhas pistas].':'Não consegui salvar no navegador.'; },
};
function seg(el,items,get,set){ el.innerHTML=''; for(const [v,l] of items){ const b=document.createElement('button'); b.type='button'; b.textContent=l; b.setAttribute('aria-pressed',String(get()===v)); b.onclick=()=>{ set(v); [...el.children].forEach((x,i)=>x.setAttribute('aria-pressed',String(items[i][0]===get()))); }; el.appendChild(b); } }
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy; let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=clamp(t,0,1); return Math.hypot(px-ax-dx*t,py-ay-dy*t); }
$('ed').addEventListener('pointerdown',e=>Editor.down(e)); $('ed').addEventListener('pointermove',e=>Editor.move(e)); $('ed').addEventListener('pointerup',()=>Editor.up());
$('ed').addEventListener('dblclick',e=>{ const [x,y]=Editor.toWorld(e), h=Editor.pick(x,y); if(h!=null) Editor.remove(h); });
$('ed').addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',()=>{ if(Game.mode==='editor') Editor.resize(); });
$('edName').oninput=e=>{ Editor.def.name=e.target.value||'Sem nome'; Editor.refresh(); };
$('edWidth').oninput=e=>{ Editor.def.width=+e.target.value; $('edWidthV').textContent=e.target.value+' m'; Editor.refresh(); };
$('edTrees').oninput=e=>{ Editor.def.density=+e.target.value; Editor.sync(); Editor.refresh(); };
$('edTest').onclick=()=>Editor.play(); $('edSave').onclick=()=>Editor.save();
$('edNew').onclick=()=>{ Editor.def=Editor.blank(); Editor.sync(); Editor.refresh(); };
$('edBack').onclick=()=>{ Game.fromEditor=false; backToMenu(); };
$('edCopy').onclick=()=>{ const t=$('edJson'); try{ navigator.clipboard.writeText(t.value).then(()=>{$('edWarn').textContent='Código copiado.';},()=>{ t.select(); $('edWarn').textContent='Selecionei o código: use Ctrl+C.'; }); }catch(e){ t.select(); } };
$('edImport').onclick=()=>{ try{ const j=JSON.parse($('edJson').value); if(!Array.isArray(j.pts)||j.pts.length<4) throw 0; const w=clamp(+j.w||140,100,180);
    Editor.def=Object.assign(Editor.blank(),{name:String(j.name||'Importada').slice(0,20),w,h:w,width:clamp(+j.width||12,8,16),road:j.road==='dirt'?'dirt':'asphalt',seed:(+j.seed|0)||1,density:clamp(+j.density||1,0,2),
      pts:j.pts.map(p=>[clamp(+p[0]||0,6,w-6),clamp(+p[1]||0,6,w-6)]),ponds:(j.ponds||[]).map(p=>[+p[0],+p[1],+p[2]||12,+p[3]||8])}); Editor.sync(); Editor.refresh(); $('edWarn').textContent='Pista importada. Salve para ela aparecer no menu.'; }
  catch(e){ $('edWarn').textContent='Esse código não é uma pista válida.'; } };

// ====================================================================== laço principal
let last=performance.now(), acc=0;
function frame(now){
  let dt=Math.min(.2,(now-last)/1000); last=now;
  if(Game.mode==='editor') Editor.render();
  const R=Game.R;
  if(R&&(Game.mode==='race'||Game.mode==='paused'||Game.mode==='results')){
    const live=Game.mode==='race'||(R.net&&Game.mode==='paused');
    if(R.net==='guest'){ if(live) Net.guestFrame(R,dt); }
    else if(live){ acc+=dt; while(acc>=DT){ raceStep(R); if(R.net) Net.hostStep(R); acc-=DT; } } else acc=0;
    Gfx.frame(R,live?dt:0); updateHud(R,dt);
  }
  Sound.update(R,Game.mode==='race');
  requestAnimationFrame(frame);
}
try{ Gfx.init(); }catch(e){ document.body.insertAdjacentHTML('beforeend','<div class="box">Seu navegador não conseguiu iniciar o 3D (WebGL). Tente outro navegador.</div>'); }
buildMenu(); show('menu'); requestAnimationFrame(frame);

window.__gr={Tracks,loadTrack,CARS,drawCarIcon,simulate:async(name,secs,carName)=>{
  const e=Tracks.find(t=>t.name===name); const T=await loadTrack(e);
  const ents=Drivers.slice(0,6).map(d=>({drv:Object.assign({},d,{human:false,skill:100}),spec:carByName(carName||'General')}));
  Game.season=null; const R=newRace(T,ents,true); R.phase='run'; const n=Math.round(secs/DT); const tr=R.cars.map(()=>[]); for(let i=0;i<n;i++){ raceStep(R); if(i%25===0) R.cars.forEach((c,k)=>tr[k].push(c.x,c.y)); } window.__lastTrace={T,tr,names:R.cars.map(c=>c.name)};
  return {lapLen:Math.round(T.lapLen),cps:T.cps.length,cars:R.cars.map(c=>[c.name,c.lapsDone,c.best&&+c.best.toFixed(2)]),dbg:R.cars.filter(c=>c.lapsDone<2).map(c=>({n:c.name,x:+c.x.toFixed(1),y:+c.y.toFixed(1),idx:c.idx,N:T.N,next:c.nextCp,v:+Math.hypot(c.vx,c.vy).toFixed(1),h:+T.heightAt(c.x,c.y).toFixed(2),wet:T.wet(c.x,c.y),ai:c.ai&&c.ai.rev,wl:T.water,rx:+T.rx[c.idx].toFixed(1),ry:+T.ry[c.idx].toFixed(1)}))}; },
  Net,Gfx,start:async name=>{ selected=[Tracks.find(t=>t.name===name).id]; goStart(); }, Game, Opts, newRace, raceStep, Sound};
})();
